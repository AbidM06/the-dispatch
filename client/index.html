  // ── MAIN renderResearch DISPATCHER ────────────────────────────────────────
  function renderResearch() {
    const r = research;
    const src = researchSource || 'seeded';

    const REPORT_TYPES = [
      { id:'macro',       label:'MACRO',       desc:'Global Economics Comment — macro transmission, CB policy, cross-asset' },
      { id:'commodities', label:'COMMODITIES', desc:'Commodities Comment — supply/demand, price targets, Dispatch Angle' },
      { id:'equity',      label:'EQUITY',      desc:'US Equity Views — EPS forecasts, AI uplift, sector rotation, consensus vs Dispatch' },
      { id:'fx',          label:'FX',          desc:'G10 FX Viewpoint — pair views, CB reaction functions, trade barbell' },
      { id:'rates',       label:'RATES',       desc:'Rates & Carry deep-dive — the puzzle, CFTC flows, catalysts, level targets' },
      { id:'thematic',    label:'THEMATIC',    desc:'Thematic Lens — 4 structural themes, 8 predictions, key debates, stock focus list' },
    ];

    const typeTabs = React.createElement('div', { className:'research-type-tabs' },
      REPORT_TYPES.map(t =>
        React.createElement('div', {
          key: t.id,
          className:'research-type-tab' + (researchType === t.id ? ' active' : ''),
          onClick: () => { setResearchType(t.id); setResearch(null); },
          title: t.desc,
        }, t.label)
      )
    );

    const controls = React.createElement('div', { style:{display:'flex',gap:8,alignItems:'center',marginBottom:16,flexWrap:'wrap'} },
      React.createElement('input', {
        type:'text',
        value: researchTopic,
        onChange: e => setResearchTopic(e.target.value),
        placeholder:'Optional focus (e.g. "US tariffs", "JPY carry", "AI diffusion") — leave blank for top daily theme',
        style:{flex:1,padding:'7px 12px',fontFamily:'var(--mono)',fontSize:10,border:'1px solid var(--rule)',background:'var(--paper)',color:'var(--ink)',minWidth:200},
      }),
      React.createElement('button', {
        className:'btn',
        onClick: refreshResearch,
        disabled: researchLoading,
        style:{ opacity: researchLoading ? 0.6 : 1 },
      }, researchLoading ? 'GENERATING…' : 'GENERATE REPORT'),
      React.createElement(AICostBadge, { calls:1, cached:'24h' }),
      !r && React.createElement('button', {
        className:'btn',
        onClick: loadResearch,
        disabled: researchLoading,
      }, 'LOAD CACHED')
    );

    if (!r && !researchLoading && researchUnavailable) {
      const td = REPORT_TYPES.find(t => t.id === researchType);
      return React.createElement('div', null,
        typeTabs, controls,
        RpUnavailable(researchUnavailable, refreshResearch, td && td.desc)
      );
    }

    if (!r && !researchLoading) {
      const typeDesc = REPORT_TYPES.find(t => t.id === researchType);
      return React.createElement('div', null,
        typeTabs, controls,
        React.createElement('div', { className:'engine-empty' },
          React.createElement('div', { style:{marginBottom:8} }, (typeDesc?.desc || 'Report').toUpperCase() + ' — NOT LOADED'),
          React.createElement('div', { style:{fontSize:10,marginTop:4} }, 'Click GENERATE REPORT to produce a ' + (typeDesc?.desc || 'research report') + ' grounded in live data. Uses 1 AI call · cached 24h.')
        )
      );
    }
    if (researchLoading) {
      const secs = researchElapsed;
      const mins = Math.floor(secs / 60);
      const ss   = String(secs % 60).padStart(2, '0');
      const elapsed = mins > 0 ? `${mins}:${ss}` : `0:${ss}`;
      const phases = [
        { at:  0, msg: 'Querying live web data via Anthropic search…' },
        { at: 20, msg: 'Processing search results and macro context…' },
        { at: 45, msg: 'Synthesising report structure and scenarios…' },
        { at: 75, msg: 'Generating Dispatch Angle and client impact matrix…' },
        { at:110, msg: 'Finalising scenario charts and formatting JSON…' },
        { at:150, msg: 'Large report — still working, no timeout applied…' },
      ];
      const phase = [...phases].reverse().find(p => secs >= p.at) || phases[0];
      const barPct = Math.min(100, Math.round((secs / 180) * 100));
      return React.createElement('div', null,
        typeTabs, controls,
        React.createElement('div', { style:{padding:'36px 32px',textAlign:'center',fontFamily:'var(--mono)'} },
          // Elapsed clock
          React.createElement('div', { style:{fontSize:38,fontWeight:700,letterSpacing:'0.05em',color:'var(--ink)',lineHeight:1,marginBottom:8,fontVariantNumeric:'tabular-nums'} }, elapsed),
          React.createElement('div', { style:{fontSize:9,letterSpacing:'0.15em',color:'var(--steel)',marginBottom:24} }, 'ELAPSED'),
          // Progress bar
          React.createElement('div', { style:{width:'100%',maxWidth:420,margin:'0 auto 20px',height:2,background:'var(--rule)',borderRadius:1,overflow:'hidden'} },
            React.createElement('div', { style:{height:'100%',width:barPct+'%',background:'var(--acc-gold)',transition:'width 1s linear',borderRadius:1} })
          ),
          // Phase message
          React.createElement('div', { style:{fontSize:11,color:'var(--steel)',marginBottom:6,minHeight:18} }, phase.msg),
          React.createElement('div', { style:{fontSize:9.5,color:'var(--ink-low)',letterSpacing:'0.08em'} },
            'No timeout — report will appear when complete'
          )
        )
      );
    }

    // Compute source label/class for legacy sub-renderers
    const sourceLabel = src === 'live' ? 'LIVE' : src === 'cached' ? 'CACHED' : 'SEEDED';
    const sourceClass = src === 'live' ? 'source-live' : src === 'cached' ? 'source-cached' : 'source-seeded';

    // Dispatch to sub-renderer based on type stored in data or current selector
    const rType = r.reportType || researchType;
    let body;
    if      (rType === 'commodities') body = renderCommoditiesReport(r, src);
    else if (rType === 'fx')          body = renderFxReport(r, sourceLabel, sourceClass);
    else if (rType === 'rates')       body = renderRatesReport(r, sourceLabel, sourceClass);
    else if (rType === 'thematic')    body = renderThematicReport(r, sourceLabel, sourceClass);
    else if (rType === 'equity')      body = renderEquityReport(r, sourceLabel, sourceClass);
    else                              body = renderMacroReport(r, src);   // macro + unknown

    // Provenance wraps EVERY report type rather than living inside each renderer.
    // Verified data leads (it is the only part guaranteed real), the report body
    // follows, and the model's own estimates and cited sources close it out.
    return React.createElement('div', null,
      typeTabs,
      controls,
      RpGroundingWarning(r),
      RpVerifiedData(r.marketData, r.dataAsOf),
      RpPolicyProxy(r.policyPath),
      body,
      RpEstimates(r.estimates),
      RpUnverified(r.unverified),
      RpSources(r.citedSources, r.allSources)
    );
  }

  // ── ENGINE TAB ────────────────────────────────────────────────────────────
  function renderEngine() {
    const acct   = alpacaInfo?.summary;
    const perf   = enginePerf;
    const regime = engineMeta?.regime || 'Run engine to see current regime';

    function fmt$(n) { return n != null ? '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0}) : '—'; }
    function fmtPct(n) { return n != null ? (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%' : '—'; }
    function fmtR(n) { return n != null ? Number(n).toFixed(2) + '×' : '—'; }
    function timeAgo(iso) {
      if (!iso) return null;
      const mins = Math.round((Date.now() - new Date(iso)) / 60000);
      if (mins < 2)   return 'just now';
      if (mins < 60)  return `${mins}m ago`;
      if (mins < 1440) return `${Math.round(mins/60)}h ago`;
      return new Date(iso).toLocaleDateString();
    }

    // ── Alpaca account strip ──────────────────────────────────────────────────
    const accountStrip = acct && React.createElement('div', { className:'engine-account' },
      React.createElement('div', { className:'engine-account-cell' },
        React.createElement('div', { className:'engine-account-val' }, fmt$(acct.portfolio_value)),
        React.createElement('div', { className:'engine-account-lbl' }, 'PORTFOLIO VALUE')
      ),
      React.createElement('div', { className:'engine-account-cell' },
        React.createElement('div', { className:'engine-account-val' }, fmt$(acct.cash)),
        React.createElement('div', { className:'engine-account-lbl' }, 'CASH')

      React.createElement('div', { className:'engine-account-cell' },

        }, acct.equity && acct.last_equity ? fmtPct((parseFloat(acct.equity) - parseFloat(acct.last_equity)) / parseFloat(acct.last_equity) * 100) : '—'),
        React.createElement('div', { className:'engine-account-lbl' }, 'DAY P&L')

    if (!isoStr) return '';
    var diff = Date.now() - new Date(isoStr).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  const IV_QUESTIONS = {
    behavioral: [
      { id:'b1', q:'Walk me through your resume.', a:'"Sure, so I was born and raised in Tampa Bay and ended up deciding to go to Dartmouth since it seemed like it would be an entirely different world than what I was used to growing up.\n\nAt Dartmouth I\'m studying economics — which is a bit typical for someone trying to get into finance, I know — but I really do enjoy my macroeconomic policy classes.\n\nLast summer I was at [x] doing an asset management internship. I really enjoyed the firm and the people, and it gave me the chance to read lots of research reports from places like [bank]. I began to realize I wanted to feel a bit more connected to the markets and get more specialised in an actual product, which S&T provides.\n\nOf course, I\'d never presume to know exactly what desk I\'d like to be on. But I have enjoyed my macro classes and I really enjoyed reading rates research last summer, so I think somewhere in rates may be a good fit. But I\'m sure I\'ll probably entirely change my mind if I\'m fortunate enough to get an offer."', tips:'Keep under 2 min. Tell a story that makes it obvious why S&T. Nothing before college. 30-60 sec per resume line item. Type it out and time yourself first.' },
      { id:'b2', q:'Why S&T?', a:'"I think S&T provides a great opportunity for someone who is intellectually curious and has a mix of quantitative and qualitative attributes. To me, it\'s an incredible chance to get a front row seat to how a given market operates and to see how clients think about that market at any given time.\n\nI\'ve talked to those within S&T at various levels, so I know it\'s not all roses. But I still think on a risk-adjusted basis there\'s hardly a better job to have out of undergrad than in S&T given my personality and interests."', tips:'Do NOT say you\'ve followed markets since childhood or love investing on an app. That signals you don\'t know what S&T is. Show you understand: market-making, client service, risk management.' },
      { id:'b3', q:'What has been your impression of [bank] after talking to our S&T folks?', a:'"I\'ve really enjoyed talking to folks here. I think it\'s obvious that they\'re not only very smart — which is probably necessary to get an offer, I suppose — but also that they\'re very generous with their time and seem to genuinely love their jobs."', tips:'Short and genuine. Reference specific people you\'ve networked with if possible.' },
      { id:'b4', q:'What do we even do in S&T?', a:'"S&T is a catchall term covering desks in equities, commodities, fixed income, or FX. S&T encompasses desks that are more flow-oriented and those that are more illiquid or structured, with roles ranging from managing a book to dealing with clients to structuring novel transactions.\n\nWhat S&T really boils down to is serving clients by being a leading market maker and managing risk. This is accomplished by traders, sales people, salestraders, quants, and structurers depending on the desk.\n\nIt all comes down to serving clients and managing risk."', tips:'Hit: market-making, client service, risk management, flow vs structured desks.' },
      { id:'b5', q:'What\'s market making? Do you take proprietary bets here?', a:'"After the GFC, the Volcker Rule severely crimped the capacity for most desks to operate in a fully proprietary manner.\n\nAs a result, most desks are oriented towards market-making — providing clients the capacity to execute trades of various volumes by giving a bid, ask, or spread.\n\nDesks can\'t fully hedge out all their exposure at any given time, so market-making doesn\'t mean just taking the spread on trades. Every desk warehouses and manages some level of risk, so most operate in that middle ground between proprietary and pure market-making."', tips:'Volcker Rule → shift from prop to market-making. Key: client flow + risk warehousing.' },
      { id:'b6', q:'What are the major divisions or product groups of S&T?', a:'"The major divisions within S&T are equities, commodities, fixed income, and FX. There\'s nuance here as some desks are cross-asset, and there\'s quite a diversity within each division — fixed income, for example, covers swaps, treasuries, money markets, and MBS."', tips:'Equities / Commodities / Fixed Income / FX. Always acknowledge the nuance within each.' },
      { id:'b7', q:'Who are your clients?', a:'"All clients have in common that they are very large and need to transact in size. This could mean fast money (hedge funds), pension funds, endowments, private equity firms, or corporate clients. Who you deal with depends on the desk — treasuries attract many large institutional buyers, whereas distressed debt will bend more toward hedge funds."', tips:'Fast money, real money, corporates. Size of transaction is the common thread.' },
      { id:'b8', q:'Have you considered investment banking? Why not that?', a:'"I think everyone interested in S&T has probably also considered investment banking. From friends who have gone into IB, what they all say is that it can be quite boring and repetitive — despite the very long hours — and for the most part you feel disconnected from the market.\n\nWhile IB is a great job, I\'m just a bit too [extroverted / analytical] to think it would be a great fit for me personally."', tips:'Be genuine. Highlight connectivity to markets and client interaction as differentiators for S&T.' },
      { id:'b9', q:'What are your major concerns about S&T?', a:'"Unlike IB where the work is similar regardless of coverage group, in S&T you have a wide variance and always run the risk of getting onto a desk that you think is right for you but turns out not to be.\n\nFurther, there are regulatory and technological changes that one always has to weigh when thinking about where to start a career.\n\nUltimately, I\'ve thought a lot about my decision and while I have imperfect information, the pros much more than outweigh the cons."', tips:'Show self-awareness and honesty — don\'t pretend there are zero concerns. Finish with conviction.' },
      { id:'b10', q:'Is there a particular area of S&T that interests you?', a:'"Obviously it\'s hard to have a grasp on what a desk does, what the culture is like, before you begin. With that said, I do find credit quite interesting and I know [bank] has strong high-yield and distressed debt desks.\n\nThose would certainly be areas of particular interest, but many people come into S&T with an idea of where they want to be and end up realising another area is an even better fit — so I\'m open to exploration."', tips:'Give a broad area or 2-3 desks — never just one. Ending with openness avoids looking arrogant and deflects deep product follow-ups.' },
      { id:'b11', q:'Do you think you\'d rather be in sales or trading? Why?', a:'Trading: "I think I have a bit more of a quantitative skillset and while I\'m reasonably extroverted, perhaps not to the extent I\'d be great at talking to clients all day. I think being in the weeds, seeing the flow, helping manage a book — that\'s something I\'d really enjoy. My extroversion could help bridging the gap between traders and quants/sales."\n\nSales: "I\'m a very extroverted person who really enjoys talking to smart, interesting people. Obviously being in sales is not all roses — clients will get mad from time to time! But I\'d really enjoy a role that has me interfacing with clients, traders, and even members of the quant team."', tips:'Pick one that genuinely fits you. Speak to personality traits, not just job mechanics.' },
      { id:'b12', q:'Have you talked to many people who work in the industry?', a:'"Absolutely. I\'ve talked to quite a few people in S&T across a number of different firms, including some people here at [bank].\n\nI tried to cast a reasonably wide net — talking to people across desks and across roles — to best understand what S&T is practically speaking and how my skillset and personality may mesh with different desks."', tips:'This is why networking matters. Be specific — name desks or roles you\'ve spoken to.' },
      { id:'b13', q:'What do you think makes a great trader or salesperson?', a:'Sales: "A great salesperson needs to manage people like a trader manages risk — understanding who clients are, what they like to do, and ensuring that when things don\'t go their way, they don\'t have animosity towards the firm. They also probably have a keen understanding of the market and broad opinions clients would be interested in."\n\nTrading: "A great trader would be an excellent risk manager above all else — not only with the exposure they want in their book, but fully understanding their risk. They also need the capacity to deal with the ups and downs and be relentlessly focused for long stretches."', tips:'Sales: client relationship management + market knowledge. Trading: risk management + emotional resilience.' },
      { id:'b14', q:'What do you think the role of a summer analyst is in S&T?', a:'"The role of a summer analyst is to learn, be curious, find your fit, and not get in the way. People need to see your personality and you need to study where you fit best within S&T while understanding your value-add is not going to be overly large — so you shouldn\'t be getting in the way."', tips:'Humble, curious, self-aware. Don\'t oversell what you can contribute. Finding fit is the real job.' },
      { id:'b15', q:'What do you think are the best attributes for a summer analyst in S&T?', a:'"Being curious and asking smart questions, relentlessly trying to find where you fit best within the firm and what role is right for you, and having the emotional intelligence to know when you should be asking questions and when it\'s best to just observe. Of course, it\'s an added bonus if you can do something practically to help the desk."', tips:'Curiosity + emotional intelligence + self-awareness. The trifecta.' },
      { id:'b16', q:'Why do you want an offer specifically from this bank?', a:'"It\'s a combination of a few things. Looking at league tables, I know this bank is strong across a number of different products — and that\'s always a good thing.\n\nSecond, and more importantly, I\'ve found everyone I\'ve talked to here really enjoyed their summer and full-time experience. At the end of the day that counts the most — you don\'t want to do something that will make you miserable just because it\'s prestigious. So culture and job satisfaction do matter to me, and folks here seem to have both."', tips:'League tables + culture/people. Be genuine. Everyone knows you\'d take an offer anywhere — articulation is what matters.' },
      { id:'b17', q:'Tell me about how you keep up to date with the markets.', a:'"I try to keep up with markets as best I can while balancing college. I always try to skim the markets section of the WSJ and FT and read stories that pull my interest.\n\nI then also try to find research reports from banks on just about anything and enjoy hearing a more opinionated view about not only what has happened, but what will happen. I also read a few newsletters, like Matt Levine\'s from Bloomberg."', tips:'Be specific but careful — only mention things you can actually talk about. If you say Bloomberg terminal, you\'ll get follow-up questions on which functions you use.' },
      { id:'b18', q:'Can you give me an example of a story you\'ve read recently and why you found it interesting?', a:'"I read an interesting piece about how [macro development] was moving the long-end of the yield curve, because [mechanism]. Goldman Sachs also came out with their [report], which signalled [thesis]. Of course, [counterpoint or caveat that shows independent thinking]."', tips:'Find 1-2 articles from Bloomberg, WSJ, or FT you can speak to. Ideally a global macro story. The opinion you develop on it matters more than the article itself.' },
      { id:'b19', q:'You observe something unethical on the desk. What do you do?', a:'"First, I\'d want to make sure I understand the internal compliance procedures of [bank] and whether there\'s a proper channel to work through.\n\nMore generally, I\'d approach a VP or MD I have some relationship with. I\'d describe the scenario — but not the specific person — to gauge whether what occurred is normal or actually unethical. If it is unethical, they\'ll know how to handle the situation and the appropriate next steps."', tips:'Know the channel first. Describe scenario not person. Let more experienced people handle it — you don\'t have full context.' },
      { id:'b20', q:'Someone on the desk does something inappropriate (not illegal). How do you handle it?', a:'"As a very young person on the desk, I think it would be inappropriate for me to get solely involved in trying to remedy the action — instead I\'d seek to inform someone better positioned to handle the situation.\n\nIt\'s always important to understand you don\'t have perfect contextual knowledge and where possible make those in a position to handle it aware."', tips:'Junior staff escalate, they don\'t arbitrate. Epistemic humility is key.' },
      { id:'b21', q:'A classmate is sharing exam answers. What do you do?', a:'"I\'d take a step back and think about the fundamental fairness. If these answers were shared with everyone, the professor would change the exam — so not sharing them with everyone gives an unethical, unfair advantage.\n\nI would let the professor know and allow them to determine the next steps, as they have the authority to decide what can and should be done."', tips:'Banks ask ethical questions constantly (especially Goldman). Show principled reasoning, not just rule-following.' },
      { id:'b22', q:'A client calls and starts screaming at you. How do you handle it?', a:'"Part of any job is coming into contact with those who are angry about a situation, perhaps not of your own doing, and bearing the brunt of it.\n\nLike with any conflict, you want to seek to understand their perspective, offer your perspective, and generally let them vent. As a representative of the firm dealing with a client you don\'t want to end up in a situation where they never work with [bank] again because of your actions or because you lose your cool."', tips:'Understand → empathise → de-escalate. Never lose your cool. Client retention > being right.' },
      { id:'b23', q:'What makes for effective communication in your view?', a:'"Effective communication comes down to understanding the level of the person you\'re talking to and catering your language to their level while being clear, concise, and never demeaning.\n\nFor example, if I asked you to describe your job you could get very technical very quickly and it would be way over my head. Effective communication means understanding I don\'t know as much as you do, so you need to tamp down the terminology."', tips:'Audience-calibration is the core insight. Show you understand S&T communication — talking to a pension fund vs. a hedge fund PM requires very different language.' },
      { id:'b24', q:'If I were to call your prior boss, what would he or she say about you?', a:'"I think they would say I\'m a very hard worker, easy to get along with, and go out of my way to understand my place and role in the firm at any given time.\n\nBy that last part I mean I try not to get in the way when things are hectic and I can\'t help, but try to be involved when possible."', tips:'Hard worker + collaborative + situationally aware. Mirror the summer analyst answer.' },
      { id:'b25', q:'What\'s your greatest strength?', a:'Choose one that genuinely applies to you:\n• Work ethic\n• Determination to do the job even if it\'s ambiguous or difficult\n• Considerate of what one\'s role is and how to succeed within it\n• Ability to get along with a diverse group of people\n• Not easily overwhelmed — relish and enjoy a challenge', tips:'Pick what is really your greatest strength. Give a brief example to back it up.' },
      { id:'b26', q:'What\'s your greatest weakness?', a:'Candidates that go over well:\n• Very detail-oriented — sometimes spend too much time on short tasks to make sure it\'s 100% correct\n• Sometimes get lost in the weeds and forget the bigger picture\n• More extroverted and sometimes forget others are more introverted (good for sales)\n• More introverted and don\'t have an outgoing "sales" personality (good for trading/quant)', tips:'Don\'t pick something that would preclude you from getting the job. Make it a real weakness that has a logical upside.' },
      { id:'b27', q:'Tell me about a failure of yours. What did you learn from it?', a:'"In my last internship I was given a task I thought would only take a few hours but ended up being much more involved than I thought.\n\nI missed the deadline. It wasn\'t the end of the world, but it was embarrassing. I learned the need to budget my time appropriately, think hard about how long things will actually take, and be open and honest with senior people when I\'m struggling to meet a deadline so they know it will be delayed."', tips:'A missed deadline is a safe, relatable failure. The learning (time management + upward communication) is directly applicable to desk life.' },
      { id:'b28', q:'Where do you see yourself in five years?', a:'"Well, hopefully here full-time! More seriously, I would love to be involved in the markets in some way, still learning, and hopefully feeling like I\'m developing a deep knowledge in a certain segment of the market."', tips:'Short, humble, genuine. Avoid sounding like you\'re already planning to leave for a hedge fund.' },
      { id:'b29', q:'What\'s your favourite course been?', a:'"I took a course on economic history that I really enjoyed. A problem with how economics is taught today is how \'scientific\' it tries to be. This course was really the only one where we took a step back and asked, \'What is economics anyway?\' We started with Aristotle and moved up to Adam Smith, and all the grading was around essays about your own thinking and interpretation of these old texts, instead of just memorising formulas."', tips:'Do NOT say Finance 101 or Economics 101 — far too uninteresting. Pick something non-obvious that shows intellectual curiosity.' },
      { id:'b30', q:'Tell me about three people you admire / would like to meet.', a:'Pick three historical people you genuinely admire with a quick rationale. Examples:\n• John von Neumann\n• Justice Robert Jackson\n• Winston Churchill\n\nAvoid: family members, people alive today who may have politically divisive views.', tips:'Three historical/non-controversial figures. Have a one-sentence reason for each. Avoid famous financiers — too obvious.' },
      { id:'b31', q:'What\'s your favourite movie?', a:'Pick something that has won awards and is entirely non-finance:\n• Amadeus\n• Das Boot\n• Good Will Hunting\n\nDo NOT say The Wolf of Wall Street — leaves a terrible impression (that\'s not how high finance actually operates).', tips:'They want to see you\'re an interesting person. Finance movies = clichéd view of the industry.' },
      { id:'b32', q:'If you could do anything else besides S&T (in finance), what would you do?', a:'"I\'d want to stay connected to the markets in some way. The obvious answer would be either investment banking or research. I think research would probably be best for me as it\'s a bit more tethered to the market — so I\'d probably look to get into equity research or be part of one of the other research teams focusing on global macro."', tips:'Stay in finance. Non-profit, tech, academia all raise red flags about commitment to the industry.' },
      { id:'b33', q:'How likely would you be to accept an offer if given one?', a:'"Absolutely I\'d accept an offer. I\'ve done my homework and wouldn\'t be interviewing here if I wasn\'t confident that I\'d do well as a summer analyst, get a full-time offer, and come back."', tips:'Always say yes. Don\'t try to be cute about it. This question almost always means they\'re interested in you.' },
      { id:'b34', q:'Where else are you interviewing?', a:'Answer honestly. It\'s a small world and your interviewer may call up friends at other banks asking about your status. If you aren\'t interviewing elsewhere, trust that it won\'t be a ding against you.', tips:'This question almost always means they\'re interested in giving you an offer. Honesty is always the right call in a small industry.' },
    ],
    market: [
      { id:'m1', q:'What is one major asset class you\'re following closely?', a:'"I\'m quite interested in where rates are right now. In particular, we\'ve seen a steepening of the yield curve, which I think is indicative of the fact that markets anticipate some level of enhanced inflation and stronger economic growth moving forward, while the Fed holds the overnight rate at the lower bound."', tips:'Pick something you genuinely follow and can speak to for 90 seconds. Update the specific data points to today\'s levels before your interview.' },
      { id:'m2', q:'Are markets really efficient?', a:'"I believe that if the conditions of the Efficient Market Hypothesis hold true then markets could be efficient. However, I think it\'s hard to imagine many markets — unless they are very liquid, very easily accessible, and very transparent — could ever really be considered efficient."', tips:'Nuanced answer is better than a definitive yes/no. Shows you can think in shades.' },
      { id:'m3', q:'What\'s the mandate of the Federal Reserve? Are they living up to it?', a:'"The Fed has a dual mandate of price stability — considered keeping inflation below 2% — and maximum employment. Certainly the Fed has done a good job on the first front over the past number of decades. On the latter front, I would argue that the Fed alone can\'t generate maximum employment without fiscal policy being aligned."', tips:'Dual mandate: price stability (2% inflation) + maximum employment. Always discuss both.' },
      { id:'m4', q:'What are the major central banks and their chairs/governors?', a:'• Federal Reserve — Jerome Powell\n• European Central Bank — Christine Lagarde\n• Bank of England — Andrew Bailey\n• Bank of Japan — Kazuo Ueda\n• Bank of Canada — Tiff Macklem', tips:'Know the current names. These change — check before your interview. The BoJ governor is particularly important given YCC dynamics.' },
      { id:'m5', q:'What routine news events have a large impact on rates?', a:'"FOMC meetings, speeches from Fed board governors and the Chair, Non-Farm Payrolls (first Friday of every month), month/year-end rebalancing, global shocks (wars, economic crashes, etc.), and treasury auction results can all move rates."', tips:'FOMC / NFP / Fed speeches are the big three. Auction results are a nice addition that shows knowledge.' },
      { id:'m6', q:'What\'s the Fed Funds rate right now? Where do you think it\'ll go?', a:'Update to current rate before interview. Framework: "The target range is currently [X]. The market is pricing [cuts/hikes] over the next 12 months based on Fed Funds futures. The key drivers for any move would be [inflation path] and [employment data]."', tips:'Look it up fresh the morning of your interview. CME FedWatch shows futures-implied path. Form a view.' },
      { id:'m7', q:'What\'s the 10-year at, and where do you think it will go?', a:'Know the current 10Y yield (FRED: DGS10). Framework: "The 10-year is at roughly [X]bps. Yields have [direction] over the past few months. If we look at 1Y10Y forward rates, the market is pricing [direction]. I think this is [right/wrong] because [inflation/Fed/growth thesis]."', tips:'Always give a view, even if hedged. "I think, all else equal, we\'re likely to see X because Y, though Z is the key risk."' },
      { id:'m8', q:'What\'s the yield curve look like? Thoughts on it?', a:'"The yield curve shows the relationship between yield and maturity. Right now it is [shape]. I think we could end up seeing [driver] push the curve [direction]."', tips:'Know the current 2s10s spread. Is it inverted, flat, or steep? Have a thesis on where it goes.' },
      { id:'m9', q:'What do you think about credit markets right now?', a:'Reference current IG and HY spreads (BAMLH0A0HYM2 for HY OAS). Framework: "IG spreads are at [X], HY at [X]. This signals [tight/wide] credit conditions. The key driver has been [Fed policy / growth outlook / supply/demand]. I think [outlook]."', tips:'Know at least HY OAS and IG OAS. Tight = risk-on, wide = risk-off. Driven by: economic outlook + Fed + technicals.' },
      { id:'m10', q:'What are some important economic indicators to watch?', a:'"GDP, CPI, moves in 5Y5Y swap rates, initial jobless claims, non-farm payrolls, PMI, moves in the VIX, high yield and IG index trends, moves in the 10-year yield, and the S&P 500 level."', tips:'The interviewee list is solid. 5Y5Y is a nice addition that shows rates sophistication.' },
      { id:'m11', q:'If you could only follow one economic indicator, what would it be?', a:'"Inflation indicators. Changes in inflation — especially sharp changes — affect rates, and rates in turn change credit and equity valuations. If inflation ticks above target, you\'d expect the Fed to hike, yields to rise across the curve, the curve to likely flatten, equity valuations to potentially decline, and credit to widen."', tips:'This shows you understand cross-asset transmission. Inflation is genuinely the most cross-cutting indicator.' },
      { id:'m12', q:'What\'s the relationship between bonds and equities?', a:'"Historically a well-balanced 60/40 portfolio benefited from equities and bonds being negatively correlated — when equities sold off, bonds would rally, reducing portfolio volatility.\n\nHowever, we\'ve seen this correlation turn more positive in recent years — when equities sell off, bonds sometimes sell off too. This raises broader concerns about portfolio positioning for pension funds and endowments trying to maintain a steady return rate."', tips:'The correlation breakdown is the sophisticated point here. It\'s also directly relevant to your HIES/HIUS holdings discussion.' },
      { id:'m13', q:'What\'s the relationship between bond prices and yields?', a:'As bond prices decline, yields increase (and vice versa). A bond\'s yield moves inversely to its price because the coupon is fixed — if you pay less for the bond, the fixed coupon represents a higher return on your investment.', tips:'This is fundamental. Also know: YTM formula. If price = 90, coupon = 10%, 1yr maturity: YTM = (10 + 10) / 90 = 22.2%.' },
      { id:'m14', q:'What are the major FX rates? Any major trends in FX?', a:'Know the current major crosses: EUR/USD, USD/JPY, GBP/USD. Framework: "The major crosses are EUR/USD ≈ [X], USD/JPY ≈ [X], GBP/USD ≈ [X]. One major trend is [dollar strength/weakness] driven by [rate differentials / growth divergence / geopolitics]."', tips:'Look these up the morning of your interview. Have a 1-sentence thesis on the dollar.' },
      { id:'m15', q:'Why do currencies fluctuate?', a:'"In FX everything is relative — a currency is only \'strong\' or \'weak\' in relation to the currencies it trades against. What drives strength or weakness will be relative differences in monetary policy (interest rates, central banking policy), economic statistics (inflation, growth), and politics (stability, foreign policy, domestic spending)."', tips:'The three drivers: monetary policy differentials / economic differentials / political risk.' },
      { id:'m16', q:'How do you think about equity valuations right now?', a:'Look up current S&P 500 P/E ratio and forward P/E before interview. Framework: "The current S&P P/E is [X]. However, the forward P/E is [X], which is [above/below] the historical range of 18-24x. I think valuations are [stretched / reasonable] because [rates environment / earnings growth / macro backdrop]."', tips:'Current P/E vs forward P/E. Know that high current P/E can be misleading if earnings are temporarily depressed.' },
      { id:'m17', q:'Where do you see gold going?', a:'Know the current gold price and direction. Framework: "Gold is currently at [~$X], [up/down] [X]% YoY. Traditionally gold is viewed as an inflationary hedge and a safe haven when real yields fall. Right now, real yields are [level], which [supports/headwinds] gold. I\'d say [view]."', tips:'Gold moves inversely to real yields. When real yields rise, gold typically falls. Know this relationship cold.' },
    ],
    investment: [
      { id:'i1', q:'If you had $1,000,000 personally, how would you invest it?', a:'"Because of how young I am, I\'m not overly worried about a 40% drawdown. So instead of being heavy on bonds, I would probably be 50% S&P 500, 20% emerging market stocks, 10% investment grade bonds, 10% Treasuries, and 10% gold.\n\nGold would operate as a slight hedge against market underperformance and against currency debasement."', tips:'Tailor to your own age and risk tolerance. The sophistication is in the rationale for each allocation, not the exact numbers.' },
      { id:'i2', q:'Someone gave you $1,000,000 and wants a constant income stream. How would you invest it?', a:'"For this amount of money, it would probably make sense to look at a portfolio of municipal bonds, corporate bonds, Treasuries, and S&P 500 index funds. Perhaps 50% muni, 20% corporate, 10% Treasuries, 20% S&P 500.\n\nIf the individual has a current income, muni bonds help by reducing overall tax liability. The bond portfolio generates reliable coupon income while the S&P 500 adds growth and some volatility."', tips:'For income: munis (tax efficiency), IG corporates, Treasuries. S&P 500 ETF adds growth. The key is tax-adjusted yield on munis.' },
      { id:'i3', q:'Pitch me a stock.', a:'Framework:\n• Familiar name, not trendy (not Tesla)\n• Real financial metrics (not pure growth)\n• Know: recent earnings, EBIT/EBITDA margin, FCF, EPS, P/E, leverage ratios\n• Know: current price, where it was 6 months ago, price target, stop-loss\n• Multi-faceted thesis (operational + financial + market positioning)\n• Spend no more than 2-3 minutes\n• Note if a bank research team has a high price target\n\nExample structure: "[Company] is interesting because [thesis]. They recently reported [earnings with key metrics]. FCF is [X], leverage is [Y]. I think the stock is underpriced because [reasons]. My price target is [X], stop-loss at [Y]."', tips:'This question is about presentation skills, not stock-picking. No one thinks you can give an airtight pitch in 3 minutes. Show you know the key metrics and have a structured view.' },
      { id:'i4', q:'Pitch me a stock to short.', a:'Framework (all the same as long pitch, plus):\n• Do NOT pitch Tesla or any high-short-interest name\n• Know the borrowing cost: if borrow = 10% and you short $11,000, you pay ($11,000 × 10%)/365 = ~$3/day\n• Explain why high short interest makes borrowing costs prohibitive (even if right, you can bleed via borrow)\n• Set a stop-loss (where you buy to cover) and a profit target (where you take profit)\n\nKey: structural decline stories work best — retail, legacy media, etc.', tips:'Short interest + borrow cost is the sophisticated addition. Most candidates forget this entirely.' },
      { id:'i5', q:'Pitch me a global macro trade.', a:'Framework:\n• Keep it to 2-3 minutes, don\'t pick an options trade (follow-ups get very technical)\n• Stay humble: "this is just an idea of mine"\n• State entry AND exit levels in the proper units (rates in bps, FX in pips, etc.)\n• Explain the underlying economic theory driving the trade\n• Have a stop-loss and take-profit level\n\nExample structure: "A major story has been [macro thesis]. I think [direction] because [economic theory]. I would look at initiating a [trade] at [level] with a stop-loss at [level] and take-profit at [level]."', tips:'Interviewers care about how you speak about these things, not whether you\'re right. 2s10s flattener/steepener or a dollar long/short are safe ideas.' },
    ],
    interviewer: [
      { id:'q1', q:'What do you think makes for a great summer analyst? Is there anyone that really stands out in your mind?', a:'This is always the best first question to ask. Interviewers love giving their opinions on what makes for a great junior employee. It also positions you well by showing you\'re thinking about how to excel, not just how to get the offer.', tips:'Ask this first in every interview. Listen carefully — the answer tells you exactly what to demonstrate for the rest of the conversation.' },
      { id:'q2', q:'There\'s constant talk about how technology is changing the floor. How do you see technology altering S&T moving forward?', a:'Good question to ask someone with a quant-based role (equity derivatives trader). Be careful not to ask this to someone whose desk has been negatively affected by automation (e.g. cash equities) — could land awkwardly.', tips:'Frame it positively: "obviously it will change different desks to different degrees." Shows you understand the industry evolution.' },
      { id:'q3', q:'Post-GFC, there have been a lot of regulatory changes (most notably Dodd-Frank). Have those changes altered your view of S&T moving forward?', a:'A thoughtful question that shows you understand how S&T has changed over the last decade. References Volcker Rule, Basel III — signals genuine industry awareness.', tips:'You can ask this of almost anyone. Positions you as someone who has done their homework on the industry.' },
      { id:'q4', q:'Over the past five years some banks have pulled back on S&T risk allowance, but during COVID you saw S&T make up for lower IB profits. Do you think we\'ll see a swing back to S&T being given more risk allowance?', a:'Shows you understand that S&T divisions have operated under tighter constraints post-GFC, and that COVID showed the value of S&T. Doesn\'t sound pessimistic — sounds informed.', tips:'Ask this to more senior people. A VP or MD will have a genuine opinion. Juniors may not.' },
      { id:'q5', q:'Generally, what do you think a young person should be looking for in desks — more flow-based or illiquid, larger or more niche? Or is it purely based on personality and skillset?', a:'Interviewers love giving their opinions, and asking them what makes a great desk shows humility and open-mindedness about where you\'ll end up.\n\nThis is a great closing question for any interview.', tips:'Ask this last. Let the interviewer\'s answer guide your follow-up comments. If they say "follow your interest," show genuine curiosity about their desk.' },
    ],
    credit: [
      { id:'c1', q:'What are corporate bonds?', a:'Bonds issued by corporations, generally with maturities between 1-20 years, that have fixed coupons paid semi-annually on a 30/360 day-count convention.', tips:'Know: fixed coupon / semi-annual payment / 30/360 convention. Contrast with floating rate notes.' },
      { id:'c2', q:'What drives the pricing of corporate bonds?', a:'Ultimately, the market clearing price — what a marginal investor is willing to pay. Key factors:\n• Credit rating from Moody\'s or S&P\n• Historical performance and creditworthiness of the issuer\n• Where the bond sits in the capital structure (secured vs unsecured; how much debt ranks above it)\n• Where comparable bonds are trading (comps)', tips:'Capital structure position is the most sophisticated point. A senior secured bond is very different from a subordinated unsecured bond.' },
      { id:'c3', q:'What\'s the credit spread?', a:'The credit spread is the difference between the yield of a corporate bond and the yield of the underlying government bond (Treasury) of the same duration.\n\nFor example, T+250 on a 10-year corporate bond means it trades at the 10-year Treasury yield, plus 250 basis points (2.50%).', tips:'Know: IG spreads are typically 50-200bps. HY spreads are typically 300-700bps in normal markets, wider in stress.' },
      { id:'c4', q:'What makes credit spreads move?', a:'Spreads WIDEN due to:\n• General economic downturns\n• The company performing poorly\n• General pessimism in credit markets\n\nSpreads TIGHTEN if:\n• Economy is healthy\n• Company is doing well\n• Credit markets are very active (lots of new issuance pricing tight to Treasuries)', tips:'Spreads are essentially the market\'s price for credit risk. Wide = market thinks default risk is high. Think of it as the risk premium.' },
      { id:'c5', q:'What are Fallen Angels?', a:'Fallen Angels are bonds that were originally issued as investment grade (BBB- or above) but have since been downgraded below investment grade (BB+ or below).\n\nThey create a forced-selling dynamic because many IG-only mandates must sell them once they\'re downgraded, often at distressed levels.', tips:'The forced-selling dynamic creates an opportunity — HY desks can buy fallen angels cheap from IG funds that are forced to sell. A great example is COVID 2020.' },
      { id:'c6', q:'What are the most common types of debt in a capital structure, by seniority?', a:'From most senior to most junior:\n1. Revolver (revolving credit facility) — like a credit card\n2. Term Loans (TLA, TLB) — TLBs are often syndicated and traded on loan desks\n3. Senior Notes — secured or unsecured\n4. Subordinated Notes\n5. Mezzanine Debt\n6. Preferred Equity\n7. Common Equity', tips:'Know the waterfall. In a bankruptcy, proceeds flow top to bottom. Equity typically gets wiped out. The fulcrum security is the most interesting — it\'s where value breaks.' },
      { id:'c7', q:'What types of covenants will you find in corporate debt?', a:'Debt docs contain covenants — restrictions that, if broken, give holders the right to force a technical default.\n\nCommon covenants:\n• Coverage ratio (min EBITDA / interest expense)\n• Leverage ratio (max debt / EBITDA)\n• Restricted cash (min cash to keep aside)\n• Negative pledge provisions (can\'t pledge certain assets for new debt)\n• Restrictions on guarantees to subsidiaries\n• Payment priority in asset sales\n• Conditions under which additional debt can be placed above this debt', tips:'Covenant-lite (cov-lite) loans became common post-GFC. They have fewer maintenance covenants, giving issuers more flexibility but less protection for lenders.' },
    ],
    mbs: [
      { id:'mb1', q:'Philosophically, what really are MBS?', a:'A MBS is a form of ownership of a wide swath of loans (mortgages) and the cashflows tied to them over time. The MBS holder is essentially the one being paid by the individual holding the mortgage (without the mortgage holder knowing it). Every month the MBS holder receives a monthly payment consisting of a combination of principal repayment and interest on the mortgage pool.', tips:'Think of it as: you own the right to receive the mortgage payments from thousands of homeowners, pooled together.' },
      { id:'mb2', q:'What\'s the most common form of MBS?', a:'Passthroughs issued by government sponsored enterprises (GSEs) such as Fannie Mae, Freddie Mac, and Ginnie Mae.\n\nThe issuer takes a Servicing Fee and an Agency Fee, which are deducted from payments passed through to investors (so investors don\'t technically get 100% of mortgage payments).', tips:'Agency MBS (Fannie/Freddie/Ginnie) carry implicit government backing. Non-agency MBS do not — these were at the heart of the 2008 crisis.' },
      { id:'mb3', q:'What\'s the major difference between an MBS and a traditional bond?', a:'Traditional bond: semi-annual coupon payments, principal returned in full at a defined maturity. Timing and amounts are certain (unless default).\n\nMBS: combined principal + interest payments monthly. Timing is UNCERTAIN because:\n• Homeowners can prepay more than required (refinancing, selling home)\n• Rates decline → wave of refinancings → early principal return\n• Rates rise → fewer prepayments → extension of expected cashflows', tips:'The key uncertainty is timing, not amount. Know: prepayment risk + extension risk — these are the two sides of the same coin.' },
      { id:'mb4', q:'What are the two major risk categories for MBS?', a:'1. PREPAYMENT RISK: homeowners pay off more than required — via overpayments, selling their home, or refinancing when rates fall. You get your principal back early, but now have to reinvest it at lower rates.\n\n2. EXTENSION RISK: rates rise, prepayments slow down (no one refinances at higher rates), so the MBS extends in duration longer than expected — and you\'re stuck holding a lower-yielding security.\n\nBoth risks surround cashflow timing uncertainty.', tips:'This is the most sophisticated MBS question you\'d face in an interview. The asymmetry is key: when rates fall you get prepaid (bad for you), when rates rise you extend (also bad for you) — this negative convexity is unique to MBS.' },
    ],
    rates: [
      { id:'r1', q:'What are Treasuries? Can you categorise them?', a:'Government debt issued by the US Treasury, backed by the full faith and credit of the United States.\n\nCategories by maturity:\n• Bills: under 1 year (traded by money market desk)\n• FRNs: 2 years, floating rate linked to 3-month T-Bills, coupons paid quarterly (began 2014)\n• Notes: 2, 3, 5, 7, and 10 years\n• Bonds: 30 years', tips:'Bills / Notes / Bonds is the core answer. FRNs are a nice addition that shows depth.' },
      { id:'r2', q:'What are TIPS?', a:'Treasury Inflation-Protected Securities — bonds that offer an interest rate over and above whatever CPI happens to be. This locks in a certain REAL rate of return, whereas traditional Treasuries do not.\n\nIssued as 5-year or 10-year notes or 30-year bonds.\n\nThe principal of TIPS adjusts with CPI, so if inflation rises, both the coupon and principal increase.', tips:'TIPS are how you buy real yield protection. The 10Y TIPS yield ≈ the "real yield" (DFII10). Knowing TIPS → real yields → breakeven inflation = very impressive.' },
      { id:'r3', q:'What are Treasury futures?', a:'Futures allow market participants to take views on future rate movements in an off-balance-sheet capacity. Six main Treasury futures:\n• TU (2yr)\n• FV (5yr)\n• TY (10yr)\n• TN (10yr ultra-long)\n• US (30yr)\n• AUL (30yr ultra-long)\n\nUsed routinely in hedging and are extremely liquid. A future obliges the seller to deliver the underlying security at a future date.', tips:'Treasury futures are how rates traders hedge DV01 — selling TY futures is equivalent to going short 10yr duration.' },
      { id:'r4', q:'What does "curve trades" mean in rates?', a:'Rates traders position their books by taking advantage of relative changes along the yield curve — not by simply going long or short a specific point.\n\nFor example, if you think 2yr yields will rise more than 5yr yields (curve flattener between 2s and 5s), you sell 2s and buy 5s. The profit/loss depends on the relative move, not the absolute level.\n\nCurve trades use treasuries and futures to be relatively overweight or underweight certain areas of the curve.', tips:'Key pairs: 2s10s, 5s30s, 2s5s. A steepener = long short-end, short long-end (or vice versa). 2s10s inversion is a classic recession signal.' },
      { id:'r5', q:'What are traditional (fixed-for-floating) swaps?', a:'The most traditional swap exchanges fixed coupon payments for floating rate payments (typically linked to SOFR, formerly LIBOR).\n\nThe utility: if you think rates will rise, instead of receiving fixed coupon payments, you get a floating rate that increases as rates do (better off in rising rates, worse off in declining rates).\n\nAt initiation, both legs have equal value — it\'s a fair trade. One side "wins" as the driver of value moves in their direction.', tips:'Swap spread = swap rate minus Treasury yield. Know: paying fixed = long rates (profits if yields fall). Receiving fixed = short rates.' },
      { id:'r6', q:'What replaced LIBOR and why?', a:'LIBOR was replaced by SOFR (Secured Overnight Financing Rate) by 2022 due to the LIBOR manipulation scandal — some banks colluded to artificially increase LIBOR by submitting artificially high bids.\n\nSOFR is based on actual overnight repo transactions in the US Treasury market, making it harder to manipulate and more representative of actual funding costs.', tips:'LIBOR → SOFR is a major market event. Know: SOFR is overnight and risk-free, LIBOR had a credit risk component (bank-to-bank lending). This creates a "credit sensitive vs risk-free" debate.' },
    ],
    fx: [
      { id:'fx1', q:'What is a spot FX trade fundamentally?', a:'A spot FX trade is an agreement between two parties to exchange a specific amount of two currencies at the current "FX rate." Settlement is in two business days (T+2).', tips:'Spot = T+2 settlement. Forward = settlement beyond T+2. Swap = spot in one direction + forward in the other.' },
      { id:'fx2', q:'What are the three major forms of FX trades?', a:'• Spot trades: at the present FX rate, settled in two business days (~40% of volume)\n• Forward trades: settled more than two business days in the future (~10-15% of volume)\n• FX swaps: a trade at time X that is reversed at time X+n (~40% of volume)\n• FX options: ~5-10% of volume', tips:'By volume: spot ≈ swap ≈ 40% each, forwards ≈ 15%, options ≈ 5%. FX swaps dominate, which surprises most people.' },
      { id:'fx3', q:'What affects FX rates?', a:'"The right answer is probably everything, which is why many FX traders move to global macro funds.\n\nIn FX everything is relative — a currency is only \'strong\' or \'weak\' in relation to the currencies it trades against. Drivers of relative strength/weakness:\n• Monetary policy differentials (interest rates, QE/QT)\n• Economic statistics (inflation, growth, employment)\n• Politics (stability, foreign policy, fiscal policy)"', tips:'Three pillars: monetary policy / economic fundamentals / political risk. Carry trade (borrow low-yield, invest high-yield) is the fourth driver worth mentioning.' },
      { id:'fx4', q:'What is a pip?', a:'A pip is the smallest unit of price movement in FX. For most USD pairs it is $0.0001 (the fourth decimal place).\n\nSo if EUR/USD moves from 1.0800 to 1.0865, it has moved 65 pips.', tips:'Know pips for USD pairs = 0.0001. For JPY pairs = 0.01 (second decimal place). The bid-ask spread on majors is typically 1-3 pips.' },
      { id:'fx5', q:'What are FX call and put options?', a:'FX call options: the right, but not the obligation, to BUY an agreed amount of currency at the strike price.\n\nFX put options: the right, but not the obligation, to SELL an agreed amount of currency at the strike price.\n\nA call strike will be above the spot price (OTM at initiation). If the currency moves above the strike, the call becomes in-the-money and gains value.', tips:'Same as equity options but on currencies. Risk reversal = long call + short put (or vice versa). Very common trade in FX.' },
    ],
    clo: [
      { id:'cl1', q:'Philosophically, what is a CLO?', a:'A CLO (Collateralised Loan Obligation) is the largest, most actively traded form of securitised product. CLOs operate by:\n1. Taking leveraged bank loans\n2. Pooling them together\n3. Creating tranches of securities (bonds) backed by the cashflows of those loans\n\nThe fundamental purpose is RISK TRANSFORMATION: turning uniformly risky loans into bonds that are either very safe (AAA tranche) or quite risky (equity tranche).', tips:'CLO = securitisation of leveraged loans. Key insight: risk transformation through tranching.' },
      { id:'cl2', q:'Who are the parties involved in a CLO at issuance?', a:'• SPV (Special Purpose Vehicle): the nerve centre through which all counterparties interact\n• Investors: put cash into the SPV in return for notes (bonds) at various tranches\n• Collateral Manager: fills the SPV with leveraged loans (new issuance or secondary market)\n• Credit Rating Agency: assigns ratings to each tranche (except equity)\n• Underwriter: underwrites and distributes the notes to investors (no role after this)\n• Trustee: collects cashflows from loans and distributes to investors in priority order', tips:'Know the SPV structure. The collateral manager is the key active participant — they actively manage the loan portfolio within CLO guidelines.' },
      { id:'cl3', q:'How is a CLO structured?', a:'The CLO issues notes in decreasing order of priority:\n• AAA tranche: largest share, first priority on cashflows, lowest risk/yield\n• AA / A / BBB tranches: progressively lower priority, higher risk/yield\n• BB tranche: lowest rated, high yield, absorbs losses early\n• Equity tranche: no rating, no fixed coupon, receives residual cashflows — highest risk, potential for highest return\n\nThe levered loans OVERCOLLATERALISE the issuance — in theory, if no loans default, equity gets more than invested. But equity absorbs losses first.', tips:'The equity tranche is where the risk/reward lives. CLO managers often retain equity tranche to align incentives.' },
      { id:'cl4', q:'Why not just buy individual leveraged loans directly instead of CLOs?', a:'Two primary reasons:\n\n1. PAYMENT PRIORITY: the tranche of CLO debt you buy has priority on cashflows — an AA CLO tranche is safer than buying BB-rated loans directly\n\n2. DIVERSIFICATION: CLOs benefit from the law of large numbers. Instead of carefully studying one levered loan, you get general credit exposure across a diversified pool — reducing idiosyncratic default risk', tips:'CLOs are a way to get leveraged loan exposure with credit enhancement. The tranche structure lets investors of different risk appetites all participate in the same pool.' },
    ],
    muni: [
      { id:'mn1', q:'Simply put, what are muni bonds and who issues them?', a:'Municipal bonds are bonds issued to finance capital expenditures that are in the public interest or represent a public good — highways, wastewater plants, electrical grids, schools, etc.\n\nIssued by over 100,000 unique entities in the US: highway authorities, power authorities, hospitals, school districts, and all levels of government below federal (states, cities, counties).', tips:'100,000+ issuers creates enormous market fragmentation — this is why liquidity is a key topic.' },
      { id:'mn2', q:'Explain the tax exemption on muni bonds.', a:'Interest income earned from most muni bonds is NOT taxed at the federal level (and often not at the state level if issued in your state).\n\nThis makes munis appealing to high-net-worth individuals in high tax brackets.\n\nTax-Adjusted Yield formula:\nTax Adjusted Yield = Quoted Yield / (1 - marginal tax rate)\n\nExample: 2% muni yield at 30% tax rate → Tax Adjusted Yield = 2% / (1 - 0.30) = 2.86%', tips:'The tax-adjusted yield formula is critical. A 2% muni yield is NOT equivalent to a 2% corporate bond yield for a high-income investor.' },
      { id:'mn3', q:'What are the two kinds of muni bonds?', a:'1. General Obligation (GO) bonds: backed by the taxing power of the state/municipality — a broader pledge of credit quality\n\n2. Revenue bonds: tied directly to a specific project\'s revenue stream (e.g. a toll road, a hospital, a utility) — only backed by the revenues that project generates', tips:'GO bonds are generally safer (backed by tax authority). Revenue bonds carry project-specific risk but can offer higher yields.' },
      { id:'mn4', q:'How do you think about the actual yield of a muni bond?', a:'You must adjust the muni yield for its tax exemption before comparing to taxable bonds.\n\nTax Adjusted Yield = Quoted Yield / (1 - marginal tax rate)\n\nSo a 2% muni bond for someone in the 30% bracket is equivalent to receiving 2.86% on a taxable bond — 86bps of \'free\' extra yield from tax exemption.', tips:'This is the key muni concept. The higher your tax rate, the more attractive munis become relative to taxable bonds.' },
    ],
    regulation: [
      { id:'reg1', q:'What are the two major regulatory changes that have affected S&T over the last decade?', a:'1. BASEL III (fully implemented 2019): focused on CAPITAL CONTROLS — keeping banks sufficiently liquid and adequately capitalised. Raised tier 1 capital requirements and introduced liquidity coverage ratios.\n\n2. DODD-FRANK (came into effect 2015-16): focused on TRADING CONTROLS — keeping banks from doing risky things. The most S&T-relevant portion is the VOLCKER RULE, which restricts proprietary trading that is not in service of client transactions.', tips:'Basel III = capital adequacy / liquidity. Dodd-Frank / Volcker Rule = trading restrictions. Know the distinction between them.' },
      { id:'reg2', q:'How does a bank balance sheet compare to a traditional company?', a:'ASSETS: mostly financial securities — either primary issuance (loans) or bought on secondary market (securities held for trading).\n\nLIABILITIES: mix of equity, debt, and deposits. Deposits = retail customers\' savings accounts (liability from the bank\'s perspective).\n\nKey difference: high leverage is normal for banks (assets/equity of 10-20x vs 2-3x for normal companies). This is why bank regulation focuses so heavily on capital ratios.', tips:'Banks are highly leveraged by design. A 5% decline in assets can wipe out equity entirely — this is the systemic risk argument for Basel III.' },
      { id:'reg3', q:'What does marked-to-market mean?', a:'Every day, certain securities held by the bank (assets) are valued at their current fair market value — what they\'re trading at in the market.\n\nDuring volatile periods this creates apparent stress: if credit assets fall 5% due to a market crash, the asset side of the balance sheet shrinks, even if the bank believes the assets are worth more in the long run.\n\nThis was a large issue in the 2008 GFC — MBS fell significantly in value, forcing banks to sell at distressed prices to stay solvent, which created a vicious cycle.', tips:'Mark-to-market accounting creates pro-cyclicality — it amplifies booms and busts. Understanding this helps explain the GFC dynamics.' },
      { id:'reg4', q:'How do banks make money?', a:'Three primary revenue streams:\n\n1. TRADING / INVESTING PROFITS: from primary issuance and secondary market trading. Some proprietary investments where permitted.\n\n2. FEES FROM SERVICES: investment banking (M&A, ECM, DCM), asset management fees. Risk is limited vs trading.\n\n3. NET INTEREST INCOME (NII): the spread between what you pay depositors and what you earn on money lent out. Large retail banks (JPM, BAML) earn lots of NII. Purer investment banks (Goldman) earn less.', tips:'Know the difference: Goldman ≈ equal trading + IB fees, little NII. JPM ≈ significant NII + IB + trading. NII is sensitive to the rate environment.' },
      { id:'reg5', q:'What\'s GDP and its components?', a:'GDP measures goods and services created within an economy during a given period.\n\nExpenditures approach: C + I + G + NX\n• C = Consumer spending (~65-75% of US GDP)\n• I = Investment (business investment + inventory changes)\n• G = Government (federal + state/local spending)\n• NX = Net Exports (often negative for developed economies)\n\nUS GDP is primarily consumer-driven.', tips:'The composition matters: US consumption-heavy means retail sales, consumer confidence, and PCE data are critical leading indicators.' },
      { id:'reg6', q:'What are the two primary measures of inflation?', a:'1. CPI (Consumer Price Index): the change in price of a basket of goods and services that a "standard individual" would buy in a given year.\n\n2. Core CPI: same basket, stripped of food and energy due to their historical volatility.\n\nMarket measure: the 5Y5Y swap rate — an actively traded swap that indicates what the market expects inflation to be over a 5-year period beginning in 5 years. Usually around the Fed\'s 2% target.', tips:'The Fed targets PCE (Personal Consumption Expenditures), not CPI. PCE tends to run ~20-30bps below CPI historically.' },
      { id:'reg7', q:'What are the three financial statements?', a:'1. INCOME STATEMENT: revenues → expenses → net income. Shows profitability over a period. Includes non-cash items like depreciation.\n\n2. BALANCE SHEET: snapshot of assets, liabilities, and shareholders\' equity at a point in time. Assets = Liabilities + Equity.\n\n3. CASH FLOW STATEMENT: shows actual cash movements in three sections:\n• CFO: cash from operations\n• CFI: cash from investing activities\n• CFF: cash from financing activities\nUnlike the income statement, no non-cash items.', tips:'Know how they link: net income flows from IS to retained earnings on BS. D&A is added back in CFO. Capex appears in CFI.' },
      { id:'reg8', q:'What is EBITDA and why is it important?', a:'EBITDA = Earnings Before Interest, Tax, Depreciation, and Amortization.\n\nFound by: Net Income + Interest Expense + Tax Expense + D&A\n\nWhy it matters:\n• Normalises for capital structure choices (interest expense)\n• Normalises for tax jurisdiction\n• Removes D&A variability across companies\n• Allows meaningful cross-company comparison\n• Used in debt covenants (leverage = Debt/EBITDA, coverage = EBITDA/Interest)', tips:'EBITDA is a proxy for operating cash generation. Debt/EBITDA is the most common leverage metric. Know that EBITDA ≠ cash flow (ignores capex, working capital changes).' },
      { id:'reg9', q:'What are the three primary ways to value a company?', a:'1. PRECEDENT TRANSACTIONS: apply the EV/EBITDA multiple from past M&A transactions to the company\n\n2. COMPARABLES ANALYSIS: find EV/EBITDA of comparable public companies, average them, apply to the company\n\n3. DISCOUNTED CASH FLOW (DCF): project 5-year unlevered FCF, discount back at WACC, apply terminal multiple to year 5 FCF and discount that back. Sum = Enterprise Value.\n\n4. LBO (sets a floor): maximum PE fund would pay, given return requirements (typically 20%+ IRR)', tips:'In S&T you need working familiarity, not investment banking depth. Focus on the logic of each, not the mechanics. DCF ≠ comps — DCF is intrinsic, comps are market-relative.' },
    ],
    moneymarkets: [
      { id:'mm1', q:'Philosophically, what are money market securities?', a:'Money market securities are a broad set of securities traded by the money markets desk, all sharing one thing in common: duration (maturity) of less than one year.\n\nThey can be:\n• Secured or unsecured\n• Government-backed (T-bills) or corporate (commercial paper, CDs)\n• Interest-bearing or discounted (issued below par, mature at par)', tips:'Sub-1-year maturity is the defining characteristic. Think: the plumbing of the financial system.' },
      { id:'mm2', q:'What are the main money market securities?', a:'• Repos (repurchase agreements): sell a security and agree to buy it back at a specified later date at an agreed price\n• Fed Funds: overnight lending between banks to meet reserve requirements\n• Treasury Bills: government-backed, sub-1yr, sold at discount\n• Commercial Paper (CP): short-term corporate unsecured debt, typically 1-270 days\n• Certificates of Deposit (CDs): bank-issued time deposits with a fixed rate', tips:'Repos are the most actively traded and most volatile. The 2019 repo market spike showed their systemic importance.' },
      { id:'mm3', q:'What are repos and how do they work?', a:'A repo (repurchase agreement) involves:\n1. Party A SELLS a security (usually Treasuries) to Party B\n2. Party A simultaneously agrees to BUY the security back at a specified later date at an agreed higher price\n\nFrom Party A\'s perspective: a repo is essentially borrowing cash and using the security as collateral.\nFrom Party B\'s perspective: lending cash and holding the security as collateral (this is a "reverse repo").\n\nThe repo rate = the annualised interest rate implied by the difference between the sell price and the repurchase price.', tips:'Banks use repos to manage daily liquidity. The Fed uses reverse repos to drain excess reserves from the system (RRP). Repo rate = a critical short-term interest rate signal.' },
    ],
    eqderiv: [
      { id:'ed1', q:'What\'s the real price of an option?', a:'Intrinsic Value + Time Value\n\n• Intrinsic value: the amount the option is in-the-money (ITM). For a call: max(0, spot - strike). For a put: max(0, strike - spot). OTM options have zero intrinsic value.\n\n• Time value: the additional premium reflecting the possibility that the option moves further ITM before expiry. Decays over time (theta).', tips:'An ATM option has zero intrinsic value but maximum time value. Deep ITM options are mostly intrinsic value, little time value.' },
      { id:'ed2', q:'What assumptions does Black-Scholes make that are wrong?', a:'1. Normal distribution: actual equity returns show pronounced negative skew and fat tails — bigger chance of large losses than BS assumes\n2. Continuous random walk: markets gap; returns don\'t follow a continuous random walk\n3. Dynamic hedging without frictions: assumes perfect delta hedging with no transaction costs or liquidity constraints\n4. Fixed volatility: assumes vol is constant over the life of the option — in reality vol smiles/skews exist and vol is stochastic', tips:'The vol smile/skew is the most important real-world deviation from BS. It shows the market prices OTM puts at higher implied vol than ATM — the market prices tail risk (negative skew in returns) that BS doesn\'t.' },
      { id:'ed3', q:'What are the Greeks?', a:'Partial derivatives of the option pricing model — how much the option value changes for a small change in each input:\n\n• DELTA: change in option value per $1 move in the underlying. Long call = delta positive, long put = delta negative. Range: 0 to 1 (call), -1 to 0 (put).\n\n• GAMMA: rate of change of delta. Measures curvature. High when ATM, low when deep ITM/OTM. Tells you how much to rebalance your delta hedge.\n\n• THETA: time decay — rate of decline in time value as expiry approaches. Long options have negative theta (you pay time decay).\n\n• VEGA: sensitivity to a 1% change in implied vol. Long options are long vega — you benefit from rising vol.\n\n• RHO: sensitivity to interest rate changes. Less important for most short-dated options.', tips:'Delta hedging = eliminating directional exposure. Gamma = the cost of delta hedging (high gamma = need to rebalance often). Vega = your vol exposure. Know these intuitively.' },
      { id:'ed4', q:'What\'s implied volatility?', a:'Implied volatility (IV) is the vol assumption backed out from the actual market price of an option using the Black-Scholes model.\n\nRather than plugging in a vol assumption to get an option price, you observe the market price and solve backwards for the vol level that would generate that price.\n\nIV represents the market\'s expectation of future volatility embedded in option prices.', tips:'IV > realised vol historically (the vol risk premium). Selling options is generally profitable on average, but has blow-up risk.' },
      { id:'ed5', q:'What\'s the VIX?', a:'The CBOE Volatility Index, introduced in 1993. Measures implied volatility expectations built into S&P 500 index options with ~30 days to expiry.\n\nIt directly derives market expectations of volatility on the S&P 500 (not backed out from a model — it\'s a portfolio of options weighted by strike). Calculated in real time throughout the trading day.\n\nVIX of 20 means the market expects the S&P 500 to move ±20%/√12 ≈ ±5.8% over the next month.', tips:'VIX < 20 = complacency. VIX 20-30 = elevated anxiety. VIX > 30 = fear/crisis. The VIX spikes sharply in risk-off events (COVID hit 85) and mean-reverts slowly.' },
      { id:'ed6', q:'What is delta hedging in equity derivatives trading?', a:'Delta hedging involves going long or short the right amount of the underlying shares to achieve delta-neutrality — making the portfolio insensitive to small moves in the underlying.\n\nFor example, if you\'re long a call with delta = 0.40, you short 40 shares of the underlying per 100 contracts to be delta-neutral.\n\nAs the stock moves, delta changes (gamma), requiring continuous rebalancing. This rebalancing cost is the price you pay for being long gamma.', tips:'Delta hedging is the most fundamental activity on an equity derivatives desk. Being long gamma = you make money from large moves and pay theta. Short gamma = you collect theta but lose on large moves.' },
      { id:'ed7', q:'What is a convertible bond?', a:'A convertible bond is a corporate bond with an embedded call option that gives the holder the right to convert the bond into a predetermined number of shares (the conversion ratio).\n\nThe current value of those shares is called the conversion value or parity.\n\nBehaviours:\n• When stock is far below conversion price: behaves like a bond (low delta)\n• When stock is near conversion price: behaves like a mix of bond + equity\n• When stock is far above conversion price: behaves like equity (high delta)', tips:'The embedded option CANNOT be traded separately. Convertibles are priced using models that value both the bond component and the option component simultaneously.' },

  };

  // ── Interview prep helpers ────────────────────────────────────────────────
  function ivSaveProgress(newProg) {
    setIvProgress(newProg);
    try { localStorage.setItem('dispatch_iv_progress', JSON.stringify(newProg)); } catch(e) {}
  }

  function ivGetFiltered() {
    const cat = IV_CATEGORIES.find(c => c.id === ivCat);
    if (!cat) return [];
    const qs = IV_QUESTIONS[ivCat] || [];
    const term = ivSearch.trim().toLowerCase();
    const filtered = term ? qs.filter(q => q.q.toLowerCase().includes(term) || q.a.toLowerCase().includes(term)) : qs;
    if (ivShuffle && ivShuffled.length === filtered.length) {
      return ivShuffled.map(i => filtered[i]).filter(Boolean);
    }
    return filtered;
  }

  function ivComputeStats() {
    let total = 0, known = 0, review = 0;
    Object.values(IV_QUESTIONS).forEach(qs => {
      total += qs.length;
      qs.forEach(q => {
        if (ivProgress[q.id] === 'known') known++;
        else if (ivProgress[q.id] === 'review') review++;
      });
    });
    return { total, known, review, unseen: total - known - review };
  }

  function ivStartShuffle(filtered) {
    const idxs = filtered.map((_, i) => i);
    for (let i = idxs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    setIvShuffled(idxs);
  }

  // ── Interview prep timer effect ────────────────────────────────────────────
  React.useEffect(() => {
    if (!ivTimerActive) return;
    const interval = setInterval(() => {
      setIvTimerSecs(s => s - 1);
    }, 1000);
    return () => clearInterval(interval);
  }, [ivTimerActive]);

  React.useEffect(() => {
    if (ivFlipped) {
      setIvTimerSecs(120);
      setIvTimerActive(true);
    } else {
      setIvTimerActive(false);
    }
  }, [ivFlipped]);

      )
    ),

    // ── Main area ──────────────────────────────────────────────────────────
    React.createElement('div', { className:'main-area' },

      budgetStatus && budgetStatus.apiFallback && budgetStatus.apiFallback.active &&
        React.createElement('div', { className:'ai-fallback-banner' },
          '⚠ AI FALLBACK ACTIVE — deterministic mode · retrying in ',
          React.createElement('strong', null, budgetStatus.apiFallback.retryInMins + 'm'),
          ' · All AI-powered sections showing cached or seeded data'
        ),

      // Topbar
      React.createElement('div', { className:'topbar' },
        React.createElement('div', { className:'topbar-brand' }, 'The Dispatch'),
        React.createElement('div', { className:'topbar-divider' }),
        React.createElement('div', { className:'topbar-title' }, TAB_LABELS[tab] || tab.toUpperCase()),
        React.createElement('div', { className:'topbar-actions' },
          React.createElement('div', {
            className: 'sb-status-dot' + (isLive ? ' live' : ''),
            style: { width:6, height:6, borderRadius:'50%', flexShrink:0 },
            title: snapshotMeta ? snapshotMeta.source.toUpperCase() + (snapshotMeta.stale ? ' · STALE' : ' · LIVE') : 'Loading…'
          }),
          React.createElement('button', {
            className: 'theme-toggle',
            onClick: toggleTheme,
            title: themeMode === 'day' ? 'Switch to night mode' : 'Switch to day mode'
          }, themeMode === 'day' ? '☽' : '☀')
        )
      ),

      // Page content
      React.createElement('div', { className:'page-content' }, renderTab())
    ),

    // Toast
    React.createElement('div', { className:'toast-wrap' },
      toasts.map(t => React.createElement('div', { key:t.id, className:'toast toast-'+t.type+' show' }, t.msg))
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
}
</script>
</body>
</html>
