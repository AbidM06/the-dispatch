<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dispatch — Market Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Load order: React → ReactDOM → PropTypes → D3 → Recharts -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>

<style>
/* ── THE DISPATCH — Swiss Editorial ─────────────────────────────────────────
   Day:   Cream & Black (Palette A) — Patek Philippe / NZZ
   Night: Charcoal & Gold (Palette D) — Julius Bär / Swiss Private Bank
   Playfair Display (headlines) · IBM Plex Mono (data) · Inter (chrome)
────────────────────────────────────────────────────────────────────────── */

/* DAY MODE — default (:root) */
:root {
  --bg:          #F4EFE6;
  --bg-alt:      #ECE7DC;
  --bg-card:     rgba(28,24,20,.035);
  --border:      rgba(28,24,20,.08);
  --border-med:  rgba(28,24,20,.15);
  --ink:         #1A1410;
  --ink-mid:     #5E5448;
  --ink-low:     #9A9080;
  --masthead:    #1A1410;
  --masthead-fg: #F0EBE0;
  --gold:        #B8924A;
  --gold-dim:    rgba(184,146,74,.12);
  --gold-border: rgba(184,146,74,.28);
  --gold-light:  #CCA05A;
  --pos:         #2D6A4F;
  --neg:         #A03228;
  --neu:         #2A5280;
  --green:       #2D6A4F;
  --red:         #A03228;
  --blue:        #2A5280;
  --steel:       #8A8070;
  --acc-snapshot:#2A5280;
  --acc-risk:    #A03228;
  --acc-signals: #2D6A4F;
  --acc-portfolio:#B8924A;
  --acc-research:#B8924A;
  --acc-gold:    #B8924A;
  --acc-gold-lt: #CCA05A;
  --econ-title:  #B8924A;
  --econ-body:   #5A5248;
  --econ-date:   #9A9080;
  --paper:       var(--bg-alt);
  --cream:       var(--bg-alt);
  --font:        'IBM Plex Mono', monospace;
  --mono:        'IBM Plex Mono', monospace;
  --serif:       'Playfair Display', serif;
  --display:     'Playfair Display', serif;
  --sans:        'Inter', sans-serif;
  --ease:        cubic-bezier(.4,0,.2,1);
  --ease-std:    cubic-bezier(.4,0,.2,1);
  --radius:      3px;
  --radius-sm:   2px;
  --sb-w:        58px;
  --sb-w-open:   182px;
  --rule:        rgba(28,24,20,.06);
}

/* NIGHT MODE — Charcoal & Gold */
[data-theme="night"] {
  --bg:          #181510;
  --bg-alt:      #111009;
  --bg-card:     rgba(192,154,80,.07);
  --border:      rgba(192,154,80,.11);
  --border-med:  rgba(192,154,80,.22);
  --ink:         #EDE6D2;
  --ink-mid:     #8A7E6C;
  --ink-low:     #504840;
  --masthead:    #111009;
  --masthead-fg: #C09A50;
  --gold:        #C09A50;
  --gold-dim:    rgba(192,154,80,.13);
  --gold-border: rgba(192,154,80,.30);
  --gold-light:  #D4AA60;
  --pos:         #7AAF8A;
  --neg:         #B06050;
  --neu:         #7A9AB0;
  --green:       #7AAF8A;
  --red:         #B06050;
  --blue:        #7A9AB0;
  --steel:       #5A5448;
  --acc-snapshot:#7A9AB0;
  --acc-risk:    #B06050;
  --acc-signals: #7AAF8A;
  --acc-portfolio:#C09A50;
  --acc-research:#C09A50;
  --acc-gold:    #C09A50;
  --acc-gold-lt: #D4AA60;
  --econ-title:  #D4AA60;
  --econ-body:   #ADA090;
  --econ-date:   #4A4438;
  --rule:        rgba(192,154,80,.09);
}

/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.65;
  font-variant-numeric: tabular-nums;
  transition: background 220ms ease, color 220ms ease;
}
/* Smooth theme transition on key containers */
.topbar, .page-content, .sidebar, .main-area,
.card, .snap-card, .event-card, .risk-card,
.rp-report, .rp-exhibit { transition: background 220ms ease, border-color 220ms ease, color 220ms ease; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(128,100,48,.25); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(128,100,48,.4); }
[data-theme="night"] ::-webkit-scrollbar-thumb { background: rgba(192,154,80,.2); }
[data-theme="night"] ::-webkit-scrollbar-thumb:hover { background: rgba(192,154,80,.35); }

/* ── APP SHELL ── */
.app-shell { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sb-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--masthead);
  border-right: 1px solid var(--gold-border);
  transition: width .22s var(--ease), background 220ms ease, border-color 220ms ease;
  overflow: hidden;
  z-index: 50;
}
.sidebar:hover { width: var(--sb-w-open); }
.sb-nav {
  flex: 1;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 11px;
  height: 38px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.sb-item:hover:not(.active) { background: rgba(255,255,255,.06); }
.sb-item.active { background: var(--gold-dim); }
.sb-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: .4;
  color: var(--masthead-fg);
}
.sb-item.active .sb-icon { opacity: 1; color: var(--gold); }
.sb-icon svg { width: 15px; height: 15px; }
.sb-label {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--masthead-fg);
  opacity: 0;
  transition: opacity .18s;
  pointer-events: none;
}
.sidebar:hover .sb-label { opacity: 1; }
.sb-item.active .sb-label { color: var(--gold); }
.sb-sep { height: 14px; flex-shrink: 0; }

/* ── THEME TOGGLE ── */
.theme-toggle {
  background: transparent;
  border: 1px solid var(--gold-border);
  color: var(--gold);
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: background 150ms, border-color 150ms, color 150ms;
  flex-shrink: 0;
  line-height: 1;
}
.theme-toggle:hover { background: var(--gold-dim); border-color: var(--gold); }
.sb-footer {
  padding: 12px 10px 14px;
  border-top: 1px solid rgba(255,255,255,.055);
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
  overflow: hidden;
}
.sb-status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-low);
  flex-shrink: 0;
}
.sb-status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2.2s ease-in-out infinite; }
.sb-footer-text { font-size: 8.5px; letter-spacing: .1em; color: var(--ink-low); opacity: 0; transition: opacity .18s; }
.sidebar:hover .sb-footer-text { opacity: 1; }

/* ── MAIN AREA ── */
.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ── TOPBAR ── */
.topbar {
  height: 56px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.topbar-brand { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: .01em; flex-shrink: 0; }
.topbar-title { font-size: 9px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-mid); }
.topbar-divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
.topbar-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }

/* ── PAGE CONTENT ── */
.page-content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px;
  animation: fadeUp .28s var(--ease) both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.content { padding: 32px 36px; }

/* ── AI FALLBACK BANNER ── */
.ai-fallback-banner {
  background: rgba(240,107,107,.07);
  border-bottom: 1px solid rgba(240,107,107,.2);
  color: #f06b6b;
  font-size: 9.5px;
  letter-spacing: .1em;
  padding: 7px 28px;
  text-transform: uppercase;
}

/* ── COMMAND BAR (topbar elements) ── */
.cmd-btn { background: transparent; border: 1px solid var(--border-med); color: var(--ink-mid); padding: 4px 11px; cursor: pointer; font-family: var(--font); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; transition: all .15s; border-radius: var(--radius-sm); white-space: nowrap; }
.cmd-btn:hover { background: var(--bg-alt); color: var(--ink); border-color: var(--border-med); }
.cmd-btn:disabled { opacity: .3; cursor: not-allowed; }
.cmd-sep { width: 1px; height: 13px; background: var(--border); flex-shrink: 0; }
.cmd-badge { font-size: 8px; letter-spacing: .08em; padding: 2px 8px; border: 1px solid; border-radius: 3px; }
.cmd-badge-live   { color: var(--green); border-color: rgba(62,207,142,.25); background: rgba(62,207,142,.07); }
.cmd-badge-cache  { color: var(--gold);  border-color: var(--gold-border);   background: var(--gold-dim); }
.cmd-badge-seeded { color: var(--ink-low); border-color: rgba(82,82,104,.28); background: rgba(82,82,104,.06); }
.cmd-sync { font-size: 8px; color: var(--ink-low); letter-spacing: .06em; }
.budget-widget { display: flex; align-items: center; gap: 7px; font-size: 8.5px; letter-spacing: .07em; }
.budget-label { color: var(--ink-low); }
.budget-val   { font-weight: 500; }
.budget-green { color: var(--green); }
.budget-amber { color: var(--gold); }
.budget-red   { color: var(--red); }
.budget-sep   { color: var(--border); }

/* ── LAYOUT GRIDS ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }

/* ── CARDS ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 18px;
  transition: border-color .22s, box-shadow .22s;
  position: relative;
}
.card:hover { border-color: var(--border-med); box-shadow: 0 2px 16px rgba(28,24,20,.09); }
:root .card:hover { box-shadow: 0 4px 20px rgba(28,24,20,.08), 0 1px 3px rgba(28,24,20,.06); }
[data-theme="night"] .card:hover { box-shadow: 0 4px 28px rgba(0,0,0,.4), 0 0 0 1px rgba(192,154,80,.12); border-color: rgba(192,154,80,.22); }
.card-title { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-low); margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

/* ── STAT VALUES ── */
.stat-val   { font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1; letter-spacing: -.025em; margin-bottom: 5px; }
.stat-label { font-size: 9.5px; color: var(--ink-low); letter-spacing: .12em; text-transform: uppercase; }

/* ── COLOURS ── */
.pos { color: var(--pos); } .neg { color: var(--neg); } .neu { color: var(--neu); }

/* ── SECTION TITLE ── */
.section-title { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-low); margin: 28px 0 16px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

/* ── BADGES ── */
.badge      { display: inline-block; padding: 2px 7px; font-size: 8.5px; font-weight: 500; letter-spacing: .1em; border-radius: 3px; }
.badge-high { background: rgba(240,107,107,.1); color: var(--red);   border: 1px solid rgba(240,107,107,.25); }
.badge-med  { background: rgba(245,166,35,.1);  color: var(--gold);  border: 1px solid rgba(245,166,35,.25); }
.badge-low  { background: rgba(62,207,142,.1);  color: var(--green); border: 1px solid rgba(62,207,142,.25); }
.badge-held     { background: var(--gold-dim); border: 1px solid var(--gold-border); color: var(--gold); font-size: 8px; padding: 2px 7px; border-radius: 3px; }
.badge-not-held { background: rgba(82,82,104,.06); border: 1px solid rgba(82,82,104,.2); color: var(--ink-low); font-size: 8px; padding: 2px 7px; border-radius: 3px; }

/* ── SOURCE BADGES ── */
.src-badge  { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; letter-spacing: .08em; padding: 2px 7px; border: 1px solid transparent; border-radius: 3px; }
.src-live   { background: rgba(62,207,142,.08); color: var(--green); border-color: rgba(62,207,142,.22); }
.src-cache  { background: var(--gold-dim); color: var(--gold); border-color: var(--gold-border); }
.src-seeded { background: rgba(82,82,104,.07); color: var(--ink-low); border-color: rgba(82,82,104,.18); }
.src-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.src-dot-live { background: var(--green); animation: pulse 2s infinite; }
.src-dot-cache  { background: var(--gold); }
.src-dot-seeded { background: var(--ink-low); }
.shariah-badge       { font-size: 8px; letter-spacing: .1em; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--ink-mid); }
.shariah-badge-halal { background: rgba(62,207,142,.08); border-color: rgba(62,207,142,.25); color: var(--green); }

/* ── LIVE DOT ── */
.dot      { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot-live { background: var(--green); animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

/* ── BUTTONS ── */
.btn         { background: transparent; border: 1px solid var(--border-med); color: var(--ink-mid); padding: 5px 13px; cursor: pointer; font-family: var(--font); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; transition: all .15s; border-radius: var(--radius-sm); }
.btn:hover   { background: var(--bg-alt); color: var(--ink); border-color: var(--border-med); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
.btn-primary:hover { background: rgba(245,166,35,.22); }
.btn-approve { background: rgba(62,207,142,.1); border-color: rgba(62,207,142,.3); color: var(--green); }
.btn-reject  { background: rgba(240,107,107,.1); border-color: rgba(240,107,107,.3); color: var(--red); }
.btn-copy    { background: transparent; border: 1px solid var(--border-med); color: var(--ink-low); padding: 3px 8px; cursor: pointer; font-family: var(--font); font-size: 9px; letter-spacing: .1em; border-radius: 3px; transition: all .15s; }
.btn-copy:hover { background: rgba(255,255,255,.07); color: var(--ink); }

/* ── FORM INPUTS ── */
.idea-form-input  { width: 100%; padding: 6px 10px; background: rgba(255,255,255,.04); border: 1px solid var(--border-med); font-family: var(--font); font-size: 12px; color: var(--ink); outline: none; border-radius: var(--radius-sm); }
.idea-form-input:focus  { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
.idea-form-select { padding: 6px 10px; background: rgba(255,255,255,.04); border: 1px solid var(--border-med); font-family: var(--font); font-size: 11px; color: var(--ink); outline: none; cursor: pointer; width: 100%; border-radius: var(--radius-sm); }
.glos-search { border: 1px solid var(--border-med); background: rgba(255,255,255,.04); color: var(--ink); }
.glos-search:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
.thesis-textarea { background: rgba(255,255,255,.04); border: 1px solid var(--border-med); color: var(--ink); font-family: var(--font); }

/* ── TABLES ── */
table { width: 100%; border-collapse: collapse; }
thead { background: var(--bg-alt); }
th { text-align: left; padding: 9px 14px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-low); font-weight: 400; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--ink); }
tbody tr:hover td { background: var(--bg-alt); }

/* ── RISK / PROGRESS BARS ── */
.risk-bar-bg  { background: rgba(255,255,255,.08); height: 3px; margin-top: 8px; border-radius: 2px; }
.risk-bar-fill { height: 3px; transition: width .5s; border-radius: 2px; }
.attr-bar-bg  { background: rgba(255,255,255,.08); height: 5px; border-radius: 2px; }
.attr-bar     { height: 5px; transition: width .5s; border-radius: 2px; }
.attr-row     { display: grid; grid-template-columns: 80px 1fr 80px 70px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.hhi-low { color: var(--green); } .hhi-med { color: var(--gold); } .hhi-high { color: var(--red); }

/* ── ECON CARDS ── */
.econ-card  { background: var(--bg-alt); border: 1px solid var(--border-med); border-left: 2px solid var(--gold); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px; }
.econ-label { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; padding: 2px 8px; margin-bottom: 8px; display: inline-block; font-weight: 500; color: var(--gold); background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 3px; }

/* ── WATCHLIST ── */
.watchlist-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.watchlist-row:last-child { border-bottom: none; }
.watchlist-row:hover { background: rgba(255,255,255,.025); margin: 0 -8px; padding: 12px 8px; border-radius: 3px; transition: background .15s; }
.ticker   { color: var(--blue); font-weight: 500; font-size: 13px; letter-spacing: .05em; }
.wl-price { font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
.wl-chg   { font-size: 11.5px; letter-spacing: .03em; }

/* ── SIGNALS / BRIEF ── */
.sig-header { font-size: 9px; letter-spacing: .15em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 8px; }
.sig-bull { color: var(--green); font-size: 10px; font-weight: 500; }
.sig-bear { color: var(--red);   font-size: 10px; font-weight: 500; }
.sig-neu  { color: var(--steel); font-size: 10px; }
.brief-regime { font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 10px; line-height: 1.15; font-family: var(--serif); letter-spacing: -.01em; }
.brief-driver { display: inline-block; padding: 3px 9px; background: rgba(122,184,245,.08); border: 1px solid rgba(122,184,245,.2); font-size: 9px; color: var(--blue); letter-spacing: .1em; margin: 3px 4px 3px 0; border-radius: 3px; }

/* ── SCENARIO ── */
.scenario-selector { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.scenario-tab { padding: 8px 18px; font-size: 10px; letter-spacing: .12em; cursor: pointer; background: transparent; border: none; border-right: 1px solid var(--border); color: var(--steel); transition: all .15s; }
.scenario-tab:last-child { border-right: none; }
.scenario-tab.active-bear { background: rgba(240,107,107,.1); color: var(--red); }
.scenario-tab.active-base { background: var(--gold-dim); color: var(--gold); }
.scenario-tab.active-bull { background: rgba(62,207,142,.1); color: var(--green); }
.scenario-title     { font-size: clamp(16px,1.5vw,22px); font-weight: 600; color: var(--ink); font-family: var(--serif); line-height: 1.25; margin: 10px 0 8px; }
.scenario-narrative { font-size: clamp(12px,1.1vw,15px); color: var(--ink-mid); line-height: 1.75; }
.scenario-assets    { margin-top: 14px; font-size: 12px; color: var(--ink-mid); }
.scenario-grid      { display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 12px; }
.scenario-card      { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
.scenario-prob      { font-size: clamp(28px,3vw,42px); font-weight: 700; font-family: var(--mono); line-height: 1; letter-spacing: -.02em; }
.scenario-prob-base { color: var(--gold); }
.scenario-prob-bull { color: var(--green); }
.scenario-prob-bear { color: var(--red); }
.scenario-prob-bar  { height: 3px; background: var(--border); border-radius: 2px; margin: 8px 0 4px; overflow: hidden; }
.scenario-prob-fill-base { height: 3px; background: var(--gold); border-radius: 2px; }
.scenario-prob-fill-bull { height: 3px; background: var(--green); border-radius: 2px; }
.scenario-prob-fill-bear { height: 3px; background: var(--red); border-radius: 2px; }

/* ── CALENDAR ── */
.cal-section-title { font-size: 10px; letter-spacing: .18em; color: var(--steel); padding: 12px 0 8px; border-bottom: 2px solid var(--border-med); margin-bottom: 4px; }
.cal-row  { display: grid; grid-template-columns: 72px 60px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: start; }
.cal-row:last-child { border-bottom: none; }
.cal-date { font-size: 11px; color: var(--blue); font-weight: 500; letter-spacing: .04em; }
.cal-ticker { font-size: 11px; font-weight: 500; color: var(--ink); letter-spacing: .05em; }
.cal-event { font-size: 12px; font-weight: 500; color: var(--ink); line-height: 1.4; }
.cal-event-news { font-size: clamp(13px,1.2vw,16px); font-weight: 400; color: var(--ink); line-height: 1.5; display: flex; align-items: baseline; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.cal-event-news:last-child { border-bottom: none; }
.cal-date-news { font-size: 10px; color: var(--ink-low); letter-spacing: .06em; flex-shrink: 0; font-family: var(--mono); }
.cal-name-news { font-size: clamp(13px,1.2vw,16px); color: var(--ink); flex: 1; }
.cal-note { font-size: 10.5px; color: var(--steel); line-height: 1.5; margin-top: 2px; }
.cal-est  { font-size: 10px; color: var(--gold); margin-top: 3px; letter-spacing: .03em; }
.imp-high { background: rgba(240,107,107,.1); color: var(--red); border: 1px solid rgba(240,107,107,.28); font-size: 9px; padding: 2px 7px; letter-spacing: .1em; border-radius: 3px; }
.imp-med  { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold-border); font-size: 9px; padding: 2px 7px; letter-spacing: .1em; border-radius: 3px; }
.imp-high-news { background: rgba(240,107,107,.1); color: var(--red); border: 1px solid rgba(240,107,107,.28); font-size: 9px; padding: 2px 7px; border-radius: 3px; letter-spacing: .08em; flex-shrink: 0; }
.imp-med-news  { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold-border); font-size: 9px; padding: 2px 7px; border-radius: 3px; letter-spacing: .08em; flex-shrink: 0; }
.imp-low-news  { background: rgba(82,82,104,.06); color: var(--ink-low); border: 1px solid rgba(82,82,104,.18); font-size: 9px; padding: 2px 7px; border-radius: 3px; letter-spacing: .08em; flex-shrink: 0; }

/* ── STATS STRIP ── */
.stats-strip { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
.stats-cell  { flex: 1; padding: 16px 20px; border-right: 1px solid var(--border); background: var(--bg-card); }
.stats-cell:last-child { border-right: none; }
.stats-num  { font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1; letter-spacing: -.02em; }
.stats-lbl  { font-size: 9px; color: var(--steel); letter-spacing: .12em; margin-top: 5px; text-transform: uppercase; }
.s-known  { color: var(--green); } .s-review { color: var(--gold); } .s-unseen { color: var(--ink-mid); } .s-total { color: var(--blue); }

/* ── MISC LAYOUT ── */
.corr-matrix { overflow-x: auto; }
.wc-row { display: grid; grid-template-columns: 72px 1fr 62px 50px 65px; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: center; font-size: 11px; }
.wc-row:last-child { border-bottom: none; }
.idea-dir-long  { color: var(--green); font-size: 10px; font-weight: 500; }
.idea-dir-short { color: var(--red);   font-size: 10px; font-weight: 500; }
.risk-ok    { color: var(--green); font-size: 9px; font-weight: 500; letter-spacing: .1em; }
.risk-warn  { color: var(--gold);  font-size: 9px; font-weight: 500; letter-spacing: .1em; }
.risk-block { color: var(--red);   font-size: 9px; font-weight: 500; letter-spacing: .1em; }
.pending-row { display: grid; grid-template-columns: 60px 60px 60px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: center; font-size: 11px; }
.exec-log-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
.overlay     { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 999; display: flex; align-items: center; justify-content: center; }
.overlay-box { background: var(--bg); border: 1px solid var(--border-med); border-radius: var(--radius); padding: 28px; max-width: 520px; width: 90%; }
.ts   { font-size: 9.5px; color: var(--ink-low); margin-top: 4px; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.skeleton { background: linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; height: 16px; border-radius: 3px; margin-bottom: 4px; }
@keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
.cb-strip { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.cb-cell  { flex: 1; padding: 18px 20px; border-right: 1px solid var(--border); background: rgba(255,255,255,.02); }
.cb-cell:last-child { border-right: none; }
.cb-label { font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.cb-text  { font-size: clamp(13px,1.2vw,16px); color: var(--ink); font-weight: 400; margin-top: 6px; line-height: 1.65; }

/* ── EXPLAINER ── */
.explainer-panel     { margin-top: 10px; padding: 10px 12px; border-top: 1px solid var(--border); border-left: 3px solid var(--blue); background: rgba(122,184,245,.05); font-size: 11px; line-height: 1.68; color: var(--ink-mid); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.explainer-term      { font-size: 8.5px; letter-spacing: .15em; color: var(--blue); font-weight: 500; margin-bottom: 7px; }
.explainer-row-label { font-size: 8px; letter-spacing: .12em; margin-top: 8px; margin-bottom: 3px; display: block; color: var(--ink-low); }
.explain-btn         { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border-med); background: transparent; color: var(--steel); font-size: 8px; cursor: pointer; margin-left: 6px; vertical-align: middle; transition: all .15s; line-height: 1; flex-shrink: 0; }
.explain-btn:hover, .explain-btn.xopen { background: var(--blue); border-color: var(--blue); color: var(--bg); }

/* ── DRAFT CARDS ── */
.draft-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 14px; }
.draft-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: border-color .15s; }
.draft-card:hover { border-color: var(--border-med); }
.draft-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.draft-card-ticker { font-size: 14px; font-weight: 600; color: var(--blue); letter-spacing: .05em; }
.draft-card-meta   { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.draft-card-body   { font-size: 11.5px; color: var(--ink-mid); line-height: 1.65; margin-bottom: 10px; }
.draft-card-actions { display: flex; gap: 8px; }
.draft-meta-cell   { display: flex; flex-direction: column; gap: 2px; }
.draft-meta-lbl    { font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.draft-meta-val    { font-size: 11px; color: var(--ink); font-weight: 500; }

/* ── ENGINE ── */
.engine-header { font-size: 9px; letter-spacing: .2em; color: var(--ink-low); text-transform: uppercase; }
.engine-grid   { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 14px; }
.engine-card   { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.engine-card-head       { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.engine-card-ticker     { font-size: 14px; font-weight: 600; color: var(--blue); }
.engine-card-ticker-row { display: flex; gap: 8px; align-items: center; }
.engine-conf-bar-bg     { background: rgba(255,255,255,.08); height: 3px; border-radius: 2px; margin-top: 4px; }
.engine-conf-bar        { height: 3px; border-radius: 2px; transition: width .5s; }
.engine-conf-row        { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.engine-conf-val        { font-size: 9px; color: var(--ink-mid); }
.engine-rationale       { font-size: 11.5px; color: var(--ink-mid); line-height: 1.6; margin: 8px 0; }
.engine-flags           { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.engine-flag            { font-size: 8px; letter-spacing: .1em; padding: 2px 7px; border: 1px solid var(--border); border-radius: 3px; color: var(--ink-mid); }
.engine-regime          { font-size: 12px; font-weight: 600; color: var(--ink); }
.engine-regime-sub      { font-size: 10px; color: var(--ink-mid); margin-top: 2px; }
.engine-empty           { border: 1px dashed var(--border-med); border-radius: var(--radius); padding: 32px; text-align: center; color: var(--ink-low); font-size: 11px; }
.engine-learn-section   { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.engine-learn-label     { font-size: 8px; letter-spacing: .15em; color: var(--ink-low); text-transform: uppercase; }
.engine-learn-body      { font-size: 12px; color: var(--ink-mid); line-height: 1.65; padding: 12px 16px; }
.engine-learn-toggle    { background: rgba(255,255,255,.04); border: none; border-top: 1px solid var(--border); width: 100%; padding: 7px 16px; font-family: var(--font); font-size: 9px; color: var(--ink-mid); cursor: pointer; text-align: left; letter-spacing: .1em; }
.engine-learn-toggle:hover { background: rgba(255,255,255,.07); }
.engine-perf            { display: flex; gap: 0; }
.engine-perf-cell       { flex: 1; padding: 10px 14px; border-right: 1px solid var(--border); background: rgba(255,255,255,.025); }
.engine-perf-cell:last-child { border-right: none; }
.engine-perf-lbl        { font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.engine-perf-val        { font-size: 16px; font-weight: 600; color: var(--ink); margin-top: 2px; }
.engine-account         { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.engine-account-cell    { padding: 10px 14px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.02); }
.engine-account-cell:last-child { border-bottom: none; }
.engine-account-lbl     { font-size: 8.5px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.engine-account-val     { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 2px; }
.engine-playbook-row    { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.engine-playbook-name   { font-size: 11px; color: var(--ink); }
.engine-playbook-cat    { font-size: 8px; letter-spacing: .1em; padding: 2px 7px; background: rgba(255,255,255,.05); color: var(--ink-mid); border-radius: 3px; }
.engine-falsif-list     { list-style: none; padding: 0; }
.engine-falsif-item     { font-size: 11px; color: var(--ink-mid); padding: 5px 0; border-bottom: 1px solid var(--border); line-height: 1.5; }
.engine-term-name       { font-size: 11px; font-weight: 600; color: var(--ink); }
.engine-term-def        { font-size: 11px; color: var(--ink-mid); }
.engine-terms-grid      { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.engine-pos-row         { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
.scan-row               { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.scan-conf-bar          { background: rgba(255,255,255,.07); height: 3px; width: 80px; border-radius: 2px; }
.scan-conf-fill         { height: 3px; border-radius: 2px; background: var(--gold); }

/* ── BACKTEST ── */
.bt-panel { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.bt-stats { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.bt-stat  { flex: 1; padding: 10px 14px; border-right: 1px solid var(--border); background: rgba(255,255,255,.02); }
.bt-stat:last-child { border-right: none; }
.bt-stat-lbl { font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.bt-stat-val { font-size: 16px; font-weight: 600; color: var(--ink); margin-top: 2px; }
.bt-label { font-size: 9px; letter-spacing: .14em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 8px; }
.bt-block { margin-bottom: 10px; }
.bt-months { display: flex; flex-wrap: wrap; gap: 4px; }
.bt-month  { font-size: 8.5px; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--border); color: var(--ink-mid); }
.bt-month-lbl { font-size: 8px; color: var(--ink-low); margin-right: 4px; }
.bt-executed-badge { font-size: 8px; padding: 1px 6px; border-radius: 3px; background: rgba(62,207,142,.1); color: var(--green); border: 1px solid rgba(62,207,142,.22); }
.bt-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 10px; }
.bt-metric-cell { background: rgba(255,255,255,.025); border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius-sm); }
.bt-metric-lbl  { font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.bt-metric-val  { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 2px; }
.bt-sizing      { margin-top: 8px; display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.bt-sizing-cell { background: rgba(255,255,255,.02); border: 1px solid var(--border); padding: 7px 10px; border-radius: var(--radius-sm); }
.bt-sizing-lbl  { font-size: 8px; color: var(--ink-low); }
.bt-sizing-val  { font-size: 12px; font-weight: 500; color: var(--ink); }

/* ── RESEARCH REPORTS ── */
.research-masthead   { padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.research-type-tabs  { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.research-type-tab   { padding: 6px 14px; font-size: 9px; letter-spacing: .14em; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--ink-mid); transition: all .15s; background: transparent; text-transform: uppercase; }
.research-type-tab.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
.research-title      { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.3; margin-bottom: 6px; font-family: var(--serif); }
.research-subtitle   { font-size: 13px; color: var(--ink-mid); margin-bottom: 12px; }
.research-meta       { font-size: 9px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.research-firm       { font-size: 9px; letter-spacing: .12em; color: var(--gold); }
.research-body       { font-size: 13px; color: var(--ink-mid); line-height: 1.8; }
.research-section-head { font-size: 9px; letter-spacing: .18em; color: var(--ink-low); text-transform: uppercase; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.research-abstract   { list-style: none; }
.research-abstract-item { font-size: 12px; color: var(--ink-mid); padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.6; }
.research-abstract-item::before { content: '→ '; color: var(--gold); }
.research-impact-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.research-impact-lbl { font-size: 8px; letter-spacing: .15em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 4px; }
.research-impact-val { font-size: 13px; color: var(--ink); font-weight: 500; }
.research-source-badge, .rp-source-badge { font-size: 8px; letter-spacing: .1em; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border-med); color: var(--ink-mid); }
.research-disclaimer { font-size: 10px; color: var(--ink-low); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 16px; }

/* ── PROVENANCE & CROSS-ASSET ─────────────────────────────────────────────────
   Verified data reads as an instrument panel — mono, tabular, quietly authoritative.
   Model output keeps the editorial serif treatment used elsewhere. The visual
   split is the point: a reader should be able to tell measured from generated
   at a glance, without reading a word. */

.rp-verified { border: 1px solid var(--acc-gold); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 16px; background: rgba(184,146,74,.05); }
.rp-verified-hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 11px; }
.rp-verified-title { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--acc-gold); font-weight: 700; }
.rp-verified-sub { font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; color: var(--ink-low); }
.rp-verified-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(124px,1fr)); gap: 9px; }
.rp-verified-cell { border-left: 2px solid var(--acc-gold); padding-left: 8px; }
.rp-verified-lbl { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 2px; }
.rp-verified-val { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
.rp-verified-src { font-family: var(--mono); font-size: 7.5px; color: var(--ink-low); letter-spacing: .04em; margin-top: 2px; }
.rp-verified-foot { font-family: var(--mono); font-size: 8.5px; color: var(--ink-low); margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.5; }

.rp-policy-proxy { border: 1px dashed var(--border-med); border-radius: var(--radius); padding: 12px 15px; margin-bottom: 16px; }
.rp-pp-tight   { border-left: 3px solid var(--red); }
.rp-pp-ease    { border-left: 3px solid var(--green, #4A7C59); }
.rp-pp-neutral { border-left: 3px solid var(--steel); }
.rp-pp-hd { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 7px; }
.rp-pp-tag { font-family: var(--mono); font-size: 7.5px; letter-spacing: .14em; padding: 2px 6px; border: 1px solid var(--border-med); border-radius: 3px; color: var(--ink-low); }
.rp-pp-dir { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--ink); }
.rp-pp-gap { font-family: var(--mono); font-size: 11px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
.rp-pp-reading { font-size: 11.5px; color: var(--ink-mid); line-height: 1.6; margin-bottom: 6px; }
.rp-pp-method { font-family: var(--mono); font-size: 8.5px; color: var(--ink-low); margin-bottom: 4px; }
.rp-pp-caveat { font-family: var(--mono); font-size: 8.5px; color: var(--red); line-height: 1.5; }

.rp-ungrounded { border: 1px solid var(--red); border-radius: var(--radius); padding: 12px 15px; margin-bottom: 16px; background: rgba(180,60,50,.05); }
.rp-ungrounded-hd { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--red); font-weight: 700; margin-bottom: 6px; }
.rp-ungrounded-body { font-size: 11.5px; color: var(--ink-mid); line-height: 1.6; }

.rp-estimates { border: 1px solid var(--border-med); border-radius: var(--radius); padding: 13px 15px; margin-top: 18px; }
.rp-est-hd { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--ink); font-weight: 700; margin-bottom: 4px; }
.rp-est-note { font-family: var(--mono); font-size: 8.5px; color: var(--ink-low); margin-bottom: 10px; }
.rp-est-tbl { width: 100%; border-collapse: collapse; }
.rp-est-th { font-family: var(--mono); font-size: 7.5px; letter-spacing: .12em; color: var(--ink-low); text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border-med); }
.rp-est-td { font-size: 10.5px; color: var(--ink-mid); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.45; }
.rp-est-fig { font-family: var(--mono); font-weight: 700; color: var(--ink); white-space: nowrap; }
.rp-est-conf-high   { color: var(--ink); font-family: var(--mono); font-size: 9px; letter-spacing: .06em; }
.rp-est-conf-medium { color: var(--ink-mid); font-family: var(--mono); font-size: 9px; letter-spacing: .06em; }
.rp-est-conf-low    { color: var(--red); font-family: var(--mono); font-size: 9px; letter-spacing: .06em; }

.rp-unverified { border-left: 3px solid var(--red); padding: 10px 0 10px 13px; margin-top: 16px; }
.rp-unver-hd { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--red); margin-bottom: 6px; }
.rp-unver-list { list-style: none; margin: 0; padding: 0; }
.rp-unver-item { font-size: 11px; color: var(--ink-mid); line-height: 1.6; padding: 3px 0; }
.rp-unver-item::before { content: '· '; color: var(--red); }

.rp-sources { border-top: 1px solid var(--border-med); padding-top: 12px; margin-top: 18px; }
.rp-src-hd { font-family: var(--mono); font-size: 9px; letter-spacing: .13em; color: var(--ink-low); margin-bottom: 8px; }
.rp-src-list { margin: 0; padding-left: 18px; }
.rp-src-item { font-size: 10.5px; color: var(--ink-mid); line-height: 1.65; padding: 2px 0; }
.rp-src-link { color: var(--ink-mid); text-decoration: none; border-bottom: 1px solid var(--border-med); }
.rp-src-link:hover { color: var(--acc-gold); border-bottom-color: var(--acc-gold); }
.rp-src-age { font-family: var(--mono); font-size: 8.5px; color: var(--ink-low); }
.rp-sources-empty .rp-src-none { font-family: var(--mono); font-size: 9.5px; color: var(--red); line-height: 1.55; }

.rp-unavailable { text-align: center; padding: 46px 32px; }
.rp-unavail-mark { font-family: var(--mono); font-size: 34px; color: var(--border-med); line-height: 1; margin-bottom: 14px; }
.rp-unavail-hd { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; color: var(--ink); font-weight: 700; margin-bottom: 10px; }
.rp-unavail-reason { font-size: 12.5px; color: var(--ink-mid); margin-bottom: 6px; }
.rp-unavail-detail { font-family: var(--mono); font-size: 9.5px; color: var(--red); margin-bottom: 14px; word-break: break-word; }
.rp-unavail-note { font-size: 11px; color: var(--ink-low); line-height: 1.65; max-width: 460px; margin: 0 auto 12px; }
.rp-unavail-last { font-family: var(--mono); font-size: 9px; color: var(--ink-low); letter-spacing: .05em; }

.rp-xa-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 10px; margin-bottom: 12px; }
.rp-xa-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; }
.rp-xa-high   { border-left: 3px solid var(--red); }
.rp-xa-medium { border-left: 3px solid var(--acc-gold); }
.rp-xa-low    { border-left: 3px solid var(--steel); }
.rp-xa-hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.rp-xa-name { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; color: var(--ink-low); }
.rp-xa-sev { font-family: var(--mono); font-size: 7.5px; letter-spacing: .1em; color: var(--ink-mid); }
.rp-xa-level { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.rp-xa-impact { font-size: 11px; color: var(--ink-mid); line-height: 1.55; }
.rp-xa-synth { border-left: 2px solid var(--acc-gold); padding: 9px 0 9px 12px; font-size: 12px; color: var(--ink-mid); line-height: 1.65; }
.rp-xa-synth-lbl { font-family: var(--mono); font-size: 8px; letter-spacing: .13em; color: var(--acc-gold); margin-bottom: 4px; }

.rp-rs-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 10px; margin-bottom: 10px; }
.rp-rs-cell { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.rp-rs-lbl { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; color: var(--ink-low); margin-bottom: 3px; }
.rp-rs-val { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

.rp-scn-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 10px; }
.rp-scn-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 13px; }
.rp-scn-bear { border-top: 2px solid var(--red); }
.rp-scn-base { border-top: 2px solid var(--steel); }
.rp-scn-bull { border-top: 2px solid var(--green, #4A7C59); }
.rp-scn-hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.rp-scn-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; font-weight: 700; color: var(--ink); }
.rp-scn-prob { font-family: var(--mono); font-size: 11px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
.rp-scn-out { font-family: var(--mono); font-size: 10px; color: var(--ink); margin-bottom: 6px; line-height: 1.5; }
.rp-scn-trig { font-size: 10.5px; color: var(--ink-low); line-height: 1.5; margin-bottom: 5px; }
.rp-scn-narr { font-size: 11px; color: var(--ink-mid); line-height: 1.55; }

.rp-risk-item { border-bottom: 1px solid var(--border); padding: 9px 0; }
.rp-risk-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.rp-risk-ch { font-family: var(--mono); font-size: 7.5px; letter-spacing: .1em; padding: 2px 6px; border: 1px solid var(--border-med); border-radius: 3px; color: var(--ink-low); }
.rp-risk-prob { font-family: var(--mono); font-size: 8px; letter-spacing: .09em; }
.rp-risk-high   { color: var(--red); }
.rp-risk-medium { color: var(--acc-gold); }
.rp-risk-low    { color: var(--steel); }
.rp-risk-name { font-size: 12px; color: var(--ink); font-weight: 500; }
.rp-risk-impact { font-family: var(--mono); font-size: 9.5px; color: var(--ink-mid); margin-bottom: 3px; }
.rp-risk-narr { font-size: 11px; color: var(--ink-mid); line-height: 1.55; }

.rp-inval { border: 1px dashed var(--border-med); border-radius: var(--radius); padding: 12px 15px; margin-top: 16px; }
.rp-inval-hd { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--ink); font-weight: 700; margin-bottom: 7px; }
.rp-inval-list { list-style: none; margin: 0 0 7px; padding: 0; }
.rp-inval-item { font-size: 11.5px; color: var(--ink-mid); line-height: 1.6; padding: 3px 0; }
.rp-inval-item::before { content: '□ '; color: var(--acc-gold); }
.rp-inval-narr { font-size: 11px; color: var(--ink-low); line-height: 1.6; }

@media (max-width: 640px) {
  .rp-verified-grid { grid-template-columns: repeat(auto-fill,minmax(104px,1fr)); }
  .rp-xa-grid, .rp-scn-grid { grid-template-columns: 1fr; }
  .rp-est-tbl { display: block; overflow-x: auto; }
}
.research-conclusion { font-size: 12px; color: var(--ink-mid); line-height: 1.7; }
.research-risk-channel, .research-risk-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.research-risk-text  { color: var(--ink-mid); }
.research-risk-mag   { color: var(--red); font-size: 9px; letter-spacing: .08em; }
.research-market-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(130px,1fr)); gap: 8px; margin-bottom: 12px; }
.research-mkt-item   { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.research-mkt-label  { font-size: 8px; letter-spacing: .12em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 4px; }
.research-mkt-text   { font-size: 12px; color: var(--ink); font-weight: 500; }

/* ── REPORT COMPONENTS (rp-*) ── */
.rp-wrap         { animation: fadeUp .24s var(--ease) both; }
.rp-masthead     { padding: 18px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.rp-type         { font-size: 8px; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
.rp-title        { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.25; margin-bottom: 5px; font-family: var(--serif); }
.rp-subtitle     { font-size: 13px; color: var(--ink-mid); margin-bottom: 10px; }
.rp-meta         { font-size: 9px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.rp-section-head { font-size: 9px; letter-spacing: .18em; color: var(--ink-low); text-transform: uppercase; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.rp-body         { font-size: 13px; color: var(--ink-mid); line-height: 1.8; margin-bottom: 16px; }
.rp-topline      { font-size: 13px; color: var(--ink); line-height: 1.65; font-weight: 500; }
.rp-takeaways    { list-style: none; }
.rp-takeaway     { font-size: 12px; color: var(--ink-mid); padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.6; }
.rp-takeaway::before { content: '→ '; color: var(--gold); }
.rp-conviction   { font-size: 9px; letter-spacing: .12em; padding: 3px 10px; border-radius: 3px; border: 1px solid var(--border-med); text-transform: uppercase; }
.rp-exhibit      { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.rp-exhibit-label   { font-size: 8px; letter-spacing: .15em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 6px; }
.rp-exhibit-caption { font-size: 10px; color: var(--ink-low); margin-top: 6px; font-style: italic; }
.rp-exhibit-sub     { font-size: 9px; color: var(--ink-low); margin-top: 3px; }
.rp-exhibit-source  { font-size: 8.5px; color: var(--ink-low); }
.rp-exhibit-chart   { height: 200px; }
.rp-targets-table   { width: 100%; border-collapse: collapse; }
.rp-tgt-bull { color: var(--green); font-weight: 600; } .rp-tgt-base { color: var(--gold); font-weight: 600; } .rp-tgt-bear { color: var(--red); font-weight: 600; }
.rp-scenario-strip  { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.rp-sc-cell      { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.rp-sc-cell:last-child { border-bottom: none; }
.rp-sc-label     { font-size: 8px; letter-spacing: .12em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 3px; }
.rp-sc-prob      { color: var(--gold); font-size: 13px; font-weight: 600; }
.rp-sc-trigger, .rp-sc-outcome, .rp-sc-narrative { font-size: 11px; color: var(--ink-mid); line-height: 1.6; }
.rp-top-trade    { background: rgba(62,207,142,.06); border: 1px solid rgba(62,207,142,.2); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.rp-da-item      { padding: 8px 0; border-bottom: 1px solid var(--border); }
.rp-da-headline  { font-size: 12px; color: var(--ink); font-weight: 500; margin-bottom: 4px; }
.rp-da-label     { font-size: 8px; letter-spacing: .1em; color: var(--ink-low); text-transform: uppercase; }
.rp-da-trade, .rp-da-mechanism { font-size: 11px; color: var(--ink-mid); line-height: 1.5; }
.rp-da-col-label { font-size: 8.5px; font-weight: 600; letter-spacing: .1em; }
.rp-da-win { color: var(--green); } .rp-da-lose { color: var(--red); }
.rp-da-wl        { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rp-dispatch-angle { font-size: 12px; color: var(--ink-mid); line-height: 1.65; }
.rp-watchpoint   { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-mid); }
.rp-watchpoints  { list-style: none; }
.rp-client-matrix { width: 100%; border-collapse: collapse; }
.rp-cm-head      { background: rgba(255,255,255,.04); }
.rp-cm-head-cell, .rp-cm-cell { padding: 8px 12px; border: 1px solid var(--border); font-size: 11px; }
.rp-cm-rel       { color: var(--gold); font-size: 9px; }
.rp-cm-type      { color: var(--ink-mid); }
.rp-audience     { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.rp-aud-tag      { font-size: 8px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 3px; color: var(--ink-mid); }
.rp-tk-n  { color: var(--gold); font-weight: 600; }
.rp-tk-text { color: var(--ink-mid); font-size: 11px; }
/* ── SCENARIO TABLE (replaces area cone) ── */
.rp-sc-tbl        { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.rp-sc-tbl-hd     { display: grid; grid-template-columns: 110px 52px 1fr 150px; background: rgba(255,255,255,.04); border-bottom: 1px solid var(--border); padding: 7px 14px; gap: 10px; }
.rp-sc-tbl-hd-cell{ font-size: 8px; letter-spacing: .14em; color: var(--ink-low); text-transform: uppercase; font-family: var(--mono); }
.rp-sc-tbl-row    { border-bottom: 1px solid var(--border); }
.rp-sc-tbl-row:last-child { border-bottom: none; }
.rp-sc-tbl-main   { display: grid; grid-template-columns: 110px 52px 1fr 150px; padding: 10px 14px; border-left: 3px solid transparent; gap: 10px; align-items: start; }
.rp-sc-tbl-row-bear .rp-sc-tbl-main { border-left-color: var(--red); }
.rp-sc-tbl-row-base .rp-sc-tbl-main { border-left-color: var(--gold); }
.rp-sc-tbl-row-bull .rp-sc-tbl-main { border-left-color: var(--green); }
.rp-sc-tbl-scenario { font-size: 9px; letter-spacing: .1em; font-family: var(--mono); font-weight: 700; text-transform: uppercase; padding-top: 1px; }
.rp-sc-tbl-row-bear .rp-sc-tbl-scenario { color: var(--red); }
.rp-sc-tbl-row-base .rp-sc-tbl-scenario { color: var(--gold); }
.rp-sc-tbl-row-bull .rp-sc-tbl-scenario { color: var(--green); }
.rp-sc-tbl-prob   { font-size: 13px; color: var(--ink); font-weight: 700; font-family: var(--mono); }
.rp-sc-tbl-trigger{ font-size: 11px; color: var(--ink-mid); line-height: 1.5; }
.rp-sc-tbl-outcome{ font-size: 11px; color: var(--ink); font-weight: 600; font-family: var(--mono); line-height: 1.4; }
.rp-sc-tbl-narr   { font-size: 11px; color: var(--ink-low); line-height: 1.6; padding: 4px 14px 10px 17px; }
/* ── LIVE DATA EXHIBIT ── */
.rp-ld-tbl        { width: 100%; border-collapse: collapse; }
.rp-ld-th         { font-size: 8px; letter-spacing: .14em; color: var(--ink-low); text-transform: uppercase; padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; font-family: var(--mono); }
.rp-ld-td         { font-size: 11.5px; color: var(--ink-mid); padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.03); vertical-align: middle; }
.rp-ld-val        { font-size: 12px; color: var(--ink); font-weight: 700; font-family: var(--mono); }
.rp-ld-up         { color: var(--green); font-family: var(--mono); font-size: 11px; }
.rp-ld-dn         { color: var(--red);   font-family: var(--mono); font-size: 11px; }
.rp-ld-flat       { color: var(--ink-low); font-family: var(--mono); font-size: 11px; }
.rp-ld-src        { font-size: 9.5px; color: var(--ink-low); }

/* ── SALES TAB ── */
.sales-header       { font-size: 9px; letter-spacing: .2em; color: var(--ink-low); text-transform: uppercase; }
.sales-headline     { font-size: clamp(22px,2.2vw,32px); font-weight: 400; color: var(--ink); line-height: 1.2; margin-bottom: 8px; font-family: var(--serif); letter-spacing: -.01em; }
.sales-morning-note { background: rgba(122,184,245,.07); border-left: 2px solid var(--blue); border-radius: 0 var(--radius) var(--radius) 0; padding: 18px 22px; color: var(--ink-mid); font-size: clamp(13px,1.2vw,16px); line-height: 1.8; }
.sales-regime-tag   { display: inline-block; font-size: 8px; letter-spacing: .12em; padding: 2px 8px; border: 1px solid var(--border-med); border-radius: 3px; color: var(--ink-mid); text-transform: uppercase; margin-right: 4px; }

/* ── CLIENT CARDS ── */
.client-grid        { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 14px; }
.client-card        { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.client-card-head   { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.client-icon        { font-size: 20px; }
.client-type        { font-size: 9px; letter-spacing: .12em; color: var(--ink-low); text-transform: uppercase; }
.client-product     { font-size: 9px; letter-spacing: .1em; color: var(--blue); }
.client-section-lbl { font-size: 8px; letter-spacing: .12em; color: var(--ink-low); text-transform: uppercase; margin-top: 10px; margin-bottom: 4px; }
.client-concern, .client-impact, .client-body { font-size: clamp(12px,1.1vw,14px); color: var(--ink-mid); line-height: 1.7; }
.client-questions   { list-style: none; }
.client-question    { font-size: clamp(12px,1.1vw,14px); color: var(--ink-mid); padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.55; }
.client-talking     { font-size: clamp(12px,1.1vw,14px); color: var(--green); line-height: 1.7; }

/* ── THEMATIC ── */
.thematic-themes-grid   { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 12px; }
.thematic-theme-card    { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; transition: border-color .15s; }
.thematic-theme-card:hover { border-color: var(--border-med); }
.thematic-theme-name    { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.thematic-theme-desc    { font-size: 11px; color: var(--ink-mid); line-height: 1.55; }
.thematic-theme-stock   { font-size: 10px; color: var(--blue); margin-top: 6px; }
.thematic-debate        { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.thematic-debate-title  { font-size: 13px; font-weight: 600; color: var(--ink); padding: 12px 14px; border-bottom: 1px solid var(--border); }
.thematic-debate-cols   { display: grid; grid-template-columns: 1fr 1fr; }
.thematic-debate-col-head { padding: 8px 14px; font-size: 9px; letter-spacing: .14em; font-weight: 600; text-transform: uppercase; }
.thematic-debate-bull   { background: rgba(62,207,142,.06); color: var(--green); }
.thematic-debate-bear   { background: rgba(240,107,107,.06); color: var(--red); }
.thematic-debate-view   { padding: 10px 14px; font-size: 11.5px; color: var(--ink-mid); line-height: 1.65; border-top: 1px solid var(--border); }
.thematic-pred-theme    { font-size: 9px; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; }
.thematic-pred-text     { font-size: 12px; color: var(--ink-mid); line-height: 1.6; }
.thematic-pred-body     { padding: 10px 14px; }
.thematic-pred-impl     { font-size: 11px; color: var(--blue); margin-top: 6px; }
.thematic-pred-n        { font-size: 9px; color: var(--ink-low); }
.thematic-predictions   { list-style: none; }

/* ── FX ── */
.fx-pair-table { width: 100%; border-collapse: collapse; }
.fx-type-badge { font-size: 8px; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); color: var(--ink-mid); letter-spacing: .08em; }
.fx-barbell      { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fx-barbell-head { font-size: 9px; letter-spacing: .14em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 8px; }
.fx-barbell-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--ink-mid); }

/* ── RATES ── */
.rates-catalyst-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 10px; }
.rates-catalyst      { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
.rates-catalyst-name { font-size: 10px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.rates-catalyst-n    { font-size: 8px; color: var(--ink-low); }
.rates-catalyst-text { font-size: 11px; color: var(--ink-mid); line-height: 1.55; }
.rates-levels-table  { width: 100%; border-collapse: collapse; }
.rates-client-box    { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; }
.rates-puzzle-box    { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.rates-puzzle-label  { font-size: 8.5px; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }

/* ── NEWS ── */
.news-grid        { display: grid; grid-template-columns: repeat(auto-fill,minmax(380px,1fr)); gap: 16px; }
.news-panel       { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 28px; }
.news-panel-title { font-size: 9px; letter-spacing: .18em; color: var(--ink-low); text-transform: uppercase; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.news-item        { padding: 13px 0; border-bottom: 1px solid var(--border); }
.news-item:last-child { border-bottom: none; }

<body>
<div id="root"></div>

<script>
// ─── BOOT: wait for Recharts ─────────────────────────────────────────────────
function boot(attempt) {
  if (attempt > 40) {
    document.getElementById('root').innerHTML = '<p style="color:#c0392b;padding:40px">Error: Recharts failed to load. Check your internet connection.</p>';
    return;
  }
  if (typeof window.Recharts === 'undefined') { setTimeout(() => boot(attempt + 1), 300); return; }
  init();
}
boot(0);

function init() {
const { useState, useEffect, useCallback, useRef } = React;
const {
  LineChart, Line, AreaChart, Area, BarChart, Bar, PieChart, Pie, Cell,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceLine,
} = window.Recharts;

const PIE_COLORS = ['#1c3a5e','#1a7a4a','#c8972a','#5b21b6','#8b4513','#2d6a8f'];

// ─── API CLIENT ───────────────────────────────────────────────────────────────
// All data fetching goes through the Express backend.
// Never calls external APIs directly.

const API_BASE = window.location.hostname === 'localhost' ? '' : '';

async function apiFetch(path, opts) {
  const res = await fetch(`${API_BASE}${path}`, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const error = new Error(body.error || `HTTP ${res.status}`);
    error.status  = res.status;
    error.payload = body;   // e.g. the research "unavailable" envelope
    throw error;
  }
  return res.json();
}

// ─── SOURCE BADGE HELPER ─────────────────────────────────────────────────────
// Returns a React element showing provenance: source, timestamp, stale flag.
function SourceBadge({ source, fetchedAt, stale }) {
  if (!source) return null;
  const cls = source === 'live' ? 'src-live' : source === 'cache' ? 'src-cache' : 'src-seeded';
  const dotCls = source === 'live' ? 'src-dot-live' : source === 'cache' ? 'src-dot-cache' : 'src-dot-seeded';
  const label = source === 'live' ? 'LIVE' : source === 'cache' ? 'CACHED' : 'SEEDED';
  const ts    = fetchedAt ? new Date(fetchedAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
  return React.createElement('span', { className:`src-badge ${cls}`, title: fetchedAt || source },
    React.createElement('span', { className:`src-dot ${dotCls}` }),
    `${label}${ts ? ' · ' + ts : ''}${stale && source !== 'seeded' ? ' ⚠' : ''}`
  );
}

// ─── AI COST BADGE ────────────────────────────────────────────────────────────
function AICostBadge({ calls = 1, cached = '24h' }) {
  return React.createElement('span', { className:'ai-cost-badge', title:`Uses ${calls} Anthropic API call(s) — counted against your daily/monthly cap` },
    `⚡ ${calls} AI call${calls > 1 ? 's' : ''} · cached ${cached}`
  );
}

function FreeBadge({ source = 'FRED' }) {
  return React.createElement('span', { className:'free-badge', title:`Free data from ${source}` },
    `FREE · ${source}`
  );
}

// ─── STAT CARD ────────────────────────────────────────────────────────────────
function StatCard(title, val, label, cls, explainer) {
  return React.createElement('div', { className:'card' },
    React.createElement('div', { className:'card-title' }, title),
    React.createElement('div', { className:`stat-val ${cls||''}` }, val),
    React.createElement('div', { className:'stat-label' }, label),
    explainer || null
  );
}

// ─── EXPLAINER DATA (educational context for each metric) ────────────────────
const EXPLAINERS = {
  dgs10:   { term:'10-Year Treasury Yield', what:"The annualised return investors demand to lend to the US government for 10 years. The benchmark 'risk-free rate' against which all assets are priced.", port:"Every equity in your portfolio is discounted against this rate. AMD, as a high-growth stock with earnings weighted far into the future, is most sensitive — a 50bp rise in the 10Y historically reduces growth stock P/Es by 6–10%." },
  dfii10:  { term:'Real Yield (10Y TIPS)', what:"The return on inflation-protected Treasuries. Real yield = Nominal yield − Breakeven inflation. The true risk-free real return with zero credit risk and zero inflation risk.", port:"AMD is a 'long-duration equity': most of its value comes from earnings projected 5–10 years out. Every 25bp rise in real yields reduces the present value of those future earnings by roughly 1–2 P/E turns." },
  t10yie:  { term:'Breakeven Inflation Rate', what:"Nominal 10Y yield minus TIPS 10Y yield — the market's implied 10-year average inflation forecast. If actual inflation matches the breakeven exactly, nominal bonds and TIPS earn identical returns.", port:"High breakevens structurally support SGLN (gold as inflation hedge). They are negative for HBKS (nominal bonds lose purchasing power) and AMD (persistent inflation keeps the Fed hawkish, deferring re-rating)." },
  hyspread:{ term:'High Yield OAS', what:"Option-Adjusted Spread: the extra yield investors demand over Treasuries to hold sub-investment-grade bonds. It's the credit market's real-time fear gauge.", port:"HY spreads are a leading indicator — they typically widen 2–4 months before equity drawdowns materialise. A rapid widening from 3% to 5%+ would signal a risk-off shift pressuring HIUS and AMD." },
  t10y2y:  { term:'10Y–2Y Yield Curve', what:"Spread between 10-year and 2-year Treasury yields. An inverted curve (negative) has preceded every US recession since the 1970s — inversion signals markets expect the Fed to cut, implying a slowdown today.", port:"A bear steepener (long rates rising faster than short-end) simultaneously hurts long-duration equities (AMD) and bond funds (HBKS). HIJS faces additional pressure as BoJ allows JGB yields to rise." },
  rsi14:   { term:'RSI — Relative Strength Index', what:"A momentum oscillator (0–100) measuring speed of recent price moves over a 14-day lookback. Above 70 = overbought; below 30 = oversold.", port:"RSI does not determine intrinsic value — it measures momentum. A sustained move below 30 alongside high volume signals capitulation. A confirmed move above RSI 50 signals a momentum regime shift." },
  portbeta:{ term:'Weighted Portfolio Beta', what:"Portfolio beta = sum of (each position's weight × its beta vs S&P 500). Beta of 1.0 means your portfolio moves in line with the index; 1.5 means 50% more. Measures systematic (market) risk.", port:"SGLN's negative beta (−0.08) is your partial hedge against equity selloffs. AMD's high beta (1.82) means a 10% S&P drawdown historically corresponds to an ~18% AMD drawdown." },
  hhiindex:{ term:'Herfindahl-Hirschman Index', what:"HHI = sum of squared portfolio weights × 10,000. Below 1,000 = diversified; 1,000–1,800 = moderate; above 1,800 = concentrated. Adopted from competition law by risk managers.", port:"A high HHI means returns are dominated by one or two positions. Institutional risk desks set maximum HHI thresholds to ensure no single idea drives performance." },

    setExplainLoading(prev => ({ ...prev, [key]: true }));
    try {
      const resp = await apiFetch(`/api/explain/${encodeURIComponent(ticker)}`);
      setExplainData(prev => ({ ...prev, [key]: resp.data }));
    } catch (err) {
      setExplainData(prev => ({ ...prev, [key]: { ticker, what: 'Unavailable', now: err.message, portfolio: '', confidence: 0 } }));

    setExplainLoading(prev => ({ ...prev, [key]: false }));

      setBuilderOOSStart(p.oosSampleStart);

  async function runBuilderBacktest(save = false) {
    if (!process.env || !builderDriver || !builderTarget) return;
    if (builderDriver === builderTarget) { showToast('Driver and target must differ', 'info'); return; }
    if (save && !builderName.trim()) { showToast('Enter a model name before saving', 'info'); return; }
    setBuilderRunning(true);
    setBuilderResult(null);
    setCustomNarrative(null);
    try {
      const body = {
        driverSeriesId: builderDriver,
        targetSeriesId: builderTarget,
        direction:      builderDirection,
        strategy:       builderStrategy,
        isSampleStart:  builderISStart,
        isSampleEnd:    builderISEnd   || null,
        oosSampleStart: builderOOSStart || null,
        oosSampleEnd:   builderOOSEnd  || null,
        name:           builderName.trim() || `${builderDriver} → ${builderTarget}`,
      };
      const endpoint = save ? '/api/correlations/saved' : '/api/correlations/custom';
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const json = await resp.json();
      if (!resp.ok) { showToast(json.error || 'Backtest failed', 'error'); return; }
      setBuilderResult(json.data);
      if (save) {
        showToast('Model saved', 'success');
        loadSavedModels();
      }
    } catch (err) {
      showToast('Builder error: ' + err.message, 'error');
    } finally {
      setBuilderRunning(false);
    }
  }

    try {
      const resp = await apiFetch('/api/research/report?type=' + researchType);
      setResearch(resp.data);
      setResearchSource(resp.source || 'live');
      setResearchUnavailable(null);
    } catch (err) {
      // A 503 means the server refused to fabricate a report. Render why, rather
      // than leaving the last report on screen as though it were current.
      const payload = err.payload && err.payload.data;
      if (payload && payload.available === false) {
        setResearch(null);
        setResearchUnavailable(payload);
      } else {
        showToast('Research report error: ' + err.message, 'error');
      }
    }
    setResearchLoading(false);
  }

        body: JSON.stringify({ topic: researchTopic, type: researchType }),
      });

      setResearchSource(resp.source || 'live');
      setResearchUnavailable(null);
      loadBudgetStatus(); // refresh budget after AI call
      showToast('Research report generated (' + resp.source + ')', 'success');
    } catch (err) {
      const payload = err.payload && err.payload.data;
      if (payload && payload.available === false) {
        setResearch(null);

  // ── DESK: submit new idea ────────────────────────────────────────────────
  async function submitNewIdea(e) {
    e && e.preventDefault();
    const body = {
      ticker:       newIdea.ticker.toUpperCase().trim(),
      direction:    newIdea.direction,
      thesis:       newIdea.thesis.trim(),
      catalyst:     newIdea.catalyst.trim(),
      entry:        parseFloat(newIdea.entry),
      stop:         parseFloat(newIdea.stop),
      target:       parseFloat(newIdea.target),
      invalidation: newIdea.invalidation.trim(),
      horizon:      newIdea.horizon,
      confidence:   parseInt(newIdea.confidence, 10),
      sizePct:      parseFloat(newIdea.sizePct),
      notes:        newIdea.notes.trim(),
    };
    setIdeaSubmitting(true);
    setLastRiskCheck(null);
    try {
      const resp = await apiFetch('/api/ideas', {
        method:  'POST',
        headers: { 'content-type': 'application/json' },
        body:    JSON.stringify(body),
      });
      setLastRiskCheck(resp.data.riskCheck);
      await loadIdeasData();
      if (resp.data.riskCheck?.level !== 'BLOCK') {
        setShowIdeaForm(false);
        setNewIdea({ ticker:'', direction:'LONG', thesis:'', catalyst:'', entry:'', stop:'', target:'', invalidation:'', horizon:'3 months', confidence:65, sizePct:5, notes:'' });
        showToast(`Idea created: ${body.ticker} ${body.direction}`, 'success');
      } else {
        showToast('BLOCK: address risk check before creating idea', 'error');
      }
    } catch (err) {
      showToast('Create idea failed: ' + err.message, 'error');
    }
    setIdeaSubmitting(false);
  }

  // ── DESK: close idea ─────────────────────────────────────────────────────
  async function submitClose() {
    if (!closingId) return;
    try {
      await apiFetch(`/api/ideas/${closingId}`, {
        method:  'PATCH',
        headers: { 'content-type': 'application/json' },
        body:    JSON.stringify({
          status:       'CLOSED',
          outcome:      closeOutcome,
          actualPnLPct: closePnL !== '' ? parseFloat(closePnL) : null,
        }),
      });
      setClosingId(null);
      setClosePnL('');
      await loadIdeasData();
      showToast('Idea closed', 'success');
    } catch (err) {
      showToast('Close failed: ' + err.message, 'error');
    }
  }

  // ── DESK: cancel (soft-delete) idea ─────────────────────────────────────
  async function cancelIdea(id) {
    if (!window.confirm('Cancel this idea?')) return;
    try {
      await apiFetch(`/api/ideas/${id}`, { method: 'DELETE' });
      await loadIdeasData();
      showToast('Idea cancelled', 'success');
    } catch (err) {
      showToast('Cancel failed: ' + err.message, 'error');
    }
  }

    setGeneratingIdeas(true);
    setDraftIdeas([]);

    try {

  async function addDraftIdea(draft) {
    try {
      await apiFetch('/api/ideas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ticker:       draft.ticker,
          direction:    draft.direction || 'LONG',
          thesis:       draft.thesis    || '',
          catalyst:     draft.catalyst  || '',
          entry:        parseFloat(draft.entry)  || null,
          stop:         parseFloat(draft.stop)   || null,
          target:       parseFloat(draft.target) || null,
          invalidation: draft.invalidation || '',
          horizon:      draft.horizon     || '3 months',
          confidence:   parseInt(draft.confidence, 10) || 65,
          sizePct:      parseFloat(draft.sizePct) || 5,
          notes:        draft.notes || '',
        }),
      });
      setDraftIdeas(prev => prev.filter(d => d !== draft));
      await loadIdeasData();
      showToast(`${draft.ticker} idea added to tracker`, 'success');
    } catch (err) {
      showToast('Add failed: ' + err.message, 'error');
    }
  }

  //   SEARCHED  — the model found it on a page this session. RpSources lists the

  // ── COMMODITY PRICE HISTORY CHART (52-week EIA data) ─────────────────────
  function RpPriceHistoryChart(data, exhibitNum) {
    if (!data || !data.length) return null;
    const hasWti   = data.some(d => d.wti   !== undefined);

    const hasNg    = data.some(d => d.ng    !== undefined);
    if (!hasWti && !hasBrent && !hasNg) return null;

    // Thin the dataset for display: keep every 2nd point if more than 30 entries
    const display = data.length > 30
      ? data.filter((_, i) => i % 2 === 0 || i === data.length - 1)
      : data;

    // Format period label: "2025-04-01" → "Apr 25" style; handle ISO week "2025-W14"
    function fmtLabel(p) {
      if (!p) return "";
      if (p.includes("-W")) return p.slice(2); // "25-W14"
      const parts = p.split("-");
      if (parts.length >= 2) {
        const months = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return months[parseInt(parts[1], 10)] + " '" + parts[0].slice(2);
      }
      return p.slice(2);
    }

    const formatted = display.map(d => ({ ...d, _label: fmtLabel(d.period) }));

    const interval = Math.max(1, Math.floor(formatted.length / 8));
