<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dispatch — Market Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@300;400;500&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">

<!-- Load order: React → ReactDOM → PropTypes → D3 → Recharts -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>

<style>
/* ── THE DISPATCH — v3 REDESIGN ─────────────────────────────────────────────
   Bloomberg-terminal sharp × editorial newspaper.
   Cormorant Garamond (display) · IBM Plex Mono (data) · Source Serif 4 (body)
   Signature motif: ruled ledger grid + paper grain overlay
   Adaptive theme: day 06:30–18:30 · night 18:30–06:30
   Module accents: Snapshot=blue · Risk=red · Signals=green · Portfolio=amber · Research=slate
────────────────────────────────────────────────────────────────────────── */

/* ── THEME TOKENS ── */
:root {
  --bg:         #f2ede2;
  --bg-alt:     #e9e4d9;
  --bg-card:    #ede8dc;
  --ink:        #0f0e14;
  --ink-mid:    #3d3a47;
  --ink-low:    #6b6778;
  --border:     rgba(15,14,20,0.11);
  --border-med: rgba(15,14,20,0.20);
  --masthead:   #0c0b11;
  --masthead-fg:#e8e3d8;
  --rule:       rgba(15,14,20,0.07);
  --acc-snapshot:#1e4a8c;
  --acc-risk:    #8b1a1a;
  --acc-signals: #145a32;
  --acc-portfolio:#854d0e;
  --acc-research: #374151;
  --acc-gold:    #b8862a;
  --acc-gold-lt: #d4a843;
  --pos:    #145a32;
  --neg:    #8b1a1a;
  --neu:    #1e4a8c;
  --display:'Cormorant Garamond','Georgia',serif;
  --mono:   'IBM Plex Mono','Courier New',monospace;
  --serif:  'Source Serif 4','Georgia',serif;
  --sans:   'Source Serif 4','Georgia',serif;
  --ease:   cubic-bezier(.22,.68,0,1.2);
  --ease-std:cubic-bezier(.4,0,.2,1);
  /* v2→v3 alias layer — keeps all old var() refs working in CSS + JS */
  --green:      var(--pos);
  --red:        var(--neg);
  --blue:       var(--neu);
  --steel:      var(--ink-low);
  --paper:      var(--bg);
  --cream:      var(--bg-card);
  --gold:       var(--acc-gold);
  --gold-light: var(--acc-gold-lt);
}
[data-theme="night"] {
  --bg:         #0e0d13;
  --bg-alt:     #141319;
  --bg-card:    #171620;
  --ink:        #e4dfd5;
  --ink-mid:    #9e98aa;
  --ink-low:    #5e5869;
  --border:     rgba(228,223,213,0.10);
  --border-med: rgba(228,223,213,0.19);
  --masthead:   #090810;
  --masthead-fg:#e4dfd5;
  --rule:       rgba(228,223,213,0.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:13px;line-height:1.6;min-height:100vh;transition:background .35s var(--ease-std),color .35s var(--ease-std)}

/* ── MASTHEAD ── */
.header{background:var(--masthead);padding:0 32px;position:sticky;top:0;z-index:100;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 19px,rgba(255,255,255,0.022) 19px,rgba(255,255,255,0.022) 20px);pointer-events:none}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative;z-index:1}
.header-wordmark{display:flex;flex-direction:column;gap:2px}
.header-title{font-family:var(--display);font-size:clamp(22px,3vw,34px);font-weight:600;color:var(--masthead-fg);letter-spacing:0.14em;line-height:1;text-transform:uppercase}
.header-title-accent{color:var(--acc-gold-lt);font-style:italic;font-weight:400}
.header-rule-line{width:100%;height:1px;background:linear-gradient(90deg,var(--acc-gold-lt),transparent 55%);opacity:.45;margin-top:3px}
.header-sub{color:rgba(228,223,213,0.30);font-family:var(--mono);font-size:8.5px;letter-spacing:0.24em;text-transform:uppercase;margin-top:3px}
.header-meta{display:flex;align-items:center;gap:14px}
.header-live{font-family:var(--mono);font-size:8.5px;color:#4ade80;letter-spacing:0.1em;display:flex;align-items:center;gap:4px}
.header-status{font-family:var(--mono);font-size:8.5px;color:rgba(228,223,213,0.30);letter-spacing:0.08em}
.theme-toggle{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.11);color:rgba(228,223,213,0.55);padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;transition:all .18s}
.theme-toggle:hover{background:rgba(255,255,255,0.11);color:var(--masthead-fg)}

/* ── COMMAND BAR ── */
.command-bar{background:var(--masthead);border-bottom:2px solid var(--acc-gold);padding:6px 32px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.cmd-btn{background:transparent;border:1px solid rgba(255,255,255,0.13);color:rgba(228,223,213,0.60);padding:4px 11px;cursor:pointer;font-family:var(--mono);font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;transition:all .16s;white-space:nowrap}
.cmd-btn:hover{background:rgba(255,255,255,0.08);color:var(--masthead-fg);border-color:rgba(255,255,255,0.24)}
.cmd-btn:disabled{opacity:.32;cursor:not-allowed}
.cmd-sep{width:1px;height:13px;background:rgba(255,255,255,0.09);flex-shrink:0}
.cmd-badge{font-family:var(--mono);font-size:8px;letter-spacing:0.08em;padding:2px 8px;border:1px solid}
.cmd-badge-live{color:#4ade80;border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.05)}
.cmd-badge-cache{color:var(--acc-gold-lt);border-color:rgba(212,168,67,.28);background:rgba(212,168,67,.05)}
.cmd-badge-seeded{color:var(--ink-low);border-color:rgba(107,103,120,.22);background:rgba(107,103,120,.04)}
.cmd-sync{font-family:var(--mono);font-size:8px;color:rgba(228,223,213,0.28);letter-spacing:0.06em;margin-left:auto}
.budget-widget{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:0.07em}
.budget-label{color:rgba(228,223,213,0.32)}
.budget-val{font-weight:500}
.budget-green{color:#4ade80}
.budget-amber{color:var(--acc-gold-lt)}
.budget-red{color:#f87171}
.budget-sep{color:rgba(228,223,213,0.14)}

/* ── TIERED NAVIGATION ── */
.nav-wrapper{background:var(--bg-alt);border-bottom:2px solid var(--ink)}
.nav-primary{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 32px;overflow-x:auto}
.nav-secondary{display:flex;gap:0;padding:0 32px;background:var(--bg);overflow-x:auto}
.tab{padding:10px 20px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--ink-low);font-family:var(--mono);font-size:8.5px;letter-spacing:0.18em;text-transform:uppercase;transition:color .16s,border-color .16s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none}
.tab:hover:not(.active){color:var(--ink)}
.tab-primary.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tab-market.active{border-bottom-color:var(--acc-snapshot);color:var(--acc-snapshot)}
.tab-risk.active{border-bottom-color:var(--acc-risk);color:var(--acc-risk)}
.tab-signals.active{border-bottom-color:var(--acc-signals);color:var(--acc-signals)}
.tab-portfolio.active{border-bottom-color:var(--acc-portfolio);color:var(--acc-portfolio)}
.tab-secondary{padding:7px 16px;font-size:8px}
.tab-secondary.active{color:var(--ink);border-bottom-color:var(--acc-gold);font-weight:500}
.tab-lab{color:rgba(107,103,120,0.55);font-size:7.5px}
.tab-lab.active{color:var(--ink-mid);border-bottom-color:var(--ink-low)}

/* ── LAYOUT ── */
.content{padding:28px 32px;max-width:1440px;margin:0 auto;animation:fadeUp .28s var(--ease-std) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ── CARDS ── */
.card{background:var(--bg-card);border:1px solid var(--border);padding:18px;position:relative;transition:border-color .18s}
.card::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 23px,var(--rule) 23px,var(--rule) 24px);pointer-events:none;opacity:.55}
.card:hover{border-color:var(--border-med)}
.card-title{font-family:var(--mono);font-size:8.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-low);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;position:relative;z-index:1}

/* ── STAT CARDS ── */
.stat-val{font-family:var(--display);font-size:30px;font-weight:600;color:var(--ink);margin-bottom:4px;letter-spacing:-0.01em;line-height:1;position:relative;z-index:1}
.stat-label{font-family:var(--mono);font-size:9px;color:var(--ink-low);letter-spacing:0.08em;position:relative;z-index:1}

/* ── COLOURS ── */
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--neu)}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 7px;font-family:var(--mono);font-size:8.5px;font-weight:500;letter-spacing:0.12em}
.badge-high{background:rgba(139,26,26,.09);color:var(--neg);border:1px solid rgba(139,26,26,.22)}
.badge-med{background:rgba(184,134,42,.09);color:#7d5500;border:1px solid rgba(184,134,42,.28)}
.badge-low{background:rgba(20,90,50,.09);color:var(--pos);border:1px solid rgba(20,90,50,.22)}

/* ── SOURCE BADGE ── */
.src-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;letter-spacing:0.08em;padding:2px 6px;border:1px solid transparent}
.src-live{background:rgba(20,90,50,.08);color:var(--pos);border-color:rgba(20,90,50,.2)}
.src-cache{background:rgba(184,134,42,.07);color:#7d5500;border-color:rgba(184,134,42,.2)}
.src-seeded{background:rgba(107,103,120,.07);color:var(--ink-low);border-color:rgba(107,103,120,.15)}
.src-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.src-dot-live{background:var(--pos);animation:pulse 2s infinite}
.src-dot-cache{background:var(--acc-gold)}
.src-dot-seeded{background:var(--ink-low)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── BUTTONS ── */
.btn{background:var(--bg-alt);border:1px solid var(--border-med);color:var(--ink-mid);padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;transition:all .16s}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--acc-gold-lt);font-weight:500}
.btn-primary:hover{background:var(--ink-mid);border-color:var(--ink-mid)}

/* ── SECTION TITLE ── */
.section-title{font-family:var(--mono);font-size:8.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-low);margin:24px 0 14px;display:flex;justify-content:space-between;align-items:center;padding-bottom:7px;border-bottom:1px solid var(--border)}

/* ── TABLES ── */
table{width:100%;border-collapse:collapse}
thead{background:var(--ink)}
th{text-align:left;padding:8px 12px;font-family:var(--mono);font-size:8.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(228,223,213,0.50);font-weight:400}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink)}
tbody tr:hover td{background:var(--bg-alt)}

/* ── RISK BARS ── */
.risk-bar-bg{background:rgba(15,14,20,0.09);height:3px;margin-top:8px}
.risk-bar-fill{height:3px;transition:width .5s}

/* ── ECON CARDS ── */
.econ-card{background:var(--ink);color:var(--bg);border:none;border-left:3px solid var(--acc-gold);padding:16px 18px;margin-bottom:12px}
.econ-label{font-family:var(--mono);font-size:8.5px;letter-spacing:0.2em;text-transform:uppercase;padding:2px 8px;margin-bottom:8px;display:inline-block;font-weight:500;color:var(--acc-gold-lt);background:rgba(212,168,67,0.10);border:1px solid rgba(212,168,67,0.22)}

/* ── MISC ── */
.ts{font-family:var(--mono);font-size:9.5px;color:var(--ink-low);margin-top:4px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── WATCHLIST ── */
.watchlist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.watchlist-row:last-child{border-bottom:none}
.watchlist-row:hover{background:rgba(200,151,42,0.05);margin:0 -6px;padding:9px 6px;transition:background .15s}
.ticker{font-family:var(--mono);color:var(--blue);font-weight:500;font-size:13px;letter-spacing:0.05em}
.wl-price{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink)}
.wl-chg{font-family:var(--mono);font-size:10.5px;letter-spacing:0.03em}

/* ── LIVE DOT ── */
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-live{background:var(--green);animation:pulse 2s infinite}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:0;font-family:var(--mono);font-size:11px;letter-spacing:0.05em;max-width:340px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:auto;box-shadow:2px 4px 16px rgba(13,13,15,0.18)}
.toast.show{opacity:1;transform:translateY(0)}
.toast-error{background:var(--paper);border:1px solid rgba(192,57,43,.4);color:var(--red);border-left:3px solid var(--red)}
.toast-success{background:var(--paper);border:1px solid rgba(26,122,74,.35);color:var(--green);border-left:3px solid var(--green)}
.toast-info{background:var(--paper);border:1px solid rgba(28,58,94,.25);color:var(--blue);border-left:3px solid var(--blue)}

/* ── COPY BUTTON ── */
.btn-copy{background:transparent;border:1px solid rgba(13,13,15,0.2);color:var(--steel);padding:3px 8px;border-radius:0;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;transition:all .18s}
.btn-copy:hover{background:var(--ink);color:var(--gold-light);border-color:var(--ink)}

/* ── EXPLAINER ── */
.explain-btn{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(13,13,15,0.22);background:transparent;color:var(--steel);font-size:8px;font-family:var(--mono);cursor:pointer;margin-left:6px;vertical-align:middle;transition:all .15s;line-height:1;flex-shrink:0}
.explain-btn:hover,.explain-btn.xopen{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.explainer-panel{margin-top:10px;padding:10px 11px;border-top:1px solid var(--rule);border-left:3px solid var(--blue);background:rgba(28,58,94,0.04);font-size:11px;line-height:1.68;color:#0d0d0f}
.explainer-term{font-family:var(--mono);font-size:8.5px;letter-spacing:0.15em;color:var(--blue);font-weight:500;margin-bottom:7px}
.explainer-row-label{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;margin-top:8px;margin-bottom:3px;display:block}

/* ── SCENARIO ── */
.scenario-selector{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--rule)}
.scenario-tab{padding:8px 18px;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;cursor:pointer;background:transparent;border:none;border-right:1px solid var(--rule);color:var(--steel);transition:all .15s}
.scenario-tab:last-child{border-right:none}
.scenario-tab.active-bear{background:rgba(192,57,43,.12);color:var(--red)}
.scenario-tab.active-base{background:rgba(200,151,42,.12);color:var(--gold)}
.scenario-tab.active-bull{background:rgba(26,122,74,.12);color:var(--green)}

/* ── CALENDAR ── */
.cal-section-title{font-family:var(--mono);font-size:10px;letter-spacing:0.18em;color:var(--steel);padding:12px 0 8px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.cal-row{display:grid;grid-template-columns:72px 60px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.cal-row:last-child{border-bottom:none}
.cal-date{font-family:var(--mono);font-size:11px;color:var(--blue);font-weight:500;letter-spacing:0.04em}
.cal-ticker{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink);letter-spacing:0.05em}
.cal-event{font-size:12px;font-weight:500;color:var(--ink);line-height:1.4}
.cal-note{font-size:10.5px;color:var(--steel);line-height:1.5;margin-top:2px}
.cal-est{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:3px;letter-spacing:0.03em}
.imp-high{background:rgba(192,57,43,.08);color:var(--red);border:1px solid rgba(192,57,43,.3);font-family:var(--mono);font-size:9px;padding:2px 7px;letter-spacing:0.1em}
.imp-med{background:rgba(200,151,42,.08);color:var(--gold);border:1px solid rgba(200,151,42,.3);font-family:var(--mono);font-size:9px;padding:2px 7px;letter-spacing:0.1em}

/* ── RISK TABLE ── */
.hhi-low{color:var(--green)}.hhi-med{color:var(--gold)}.hhi-high{color:var(--red)}

/* ── LOADING SKELETON ── */
.skeleton{background:linear-gradient(90deg,rgba(13,13,15,0.06) 25%,rgba(13,13,15,0.10) 50%,rgba(13,13,15,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;height:16px;border-radius:0;margin-bottom:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── RESPONSIVE ── */
@media (max-width: 1024px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width: 760px){
  .header{padding:14px 18px;flex-direction:column;align-items:flex-start;gap:12px}
  .header-title{font-size:22px}
  .header-meta{width:100%;align-items:flex-start}
  .tabs{overflow-x:auto;white-space:nowrap}
  .tab{padding:10px 14px;font-size:9.5px;flex:0 0 auto}
  .content{padding:14px 16px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .card{padding:14px}
  table{display:block;overflow-x:auto}
  .cal-row{grid-template-columns:60px 50px 1fr}
}

/* ── THESIS LAB ── */
.thesis-form{background:var(--cream);border:1px solid var(--rule);padding:20px;margin-bottom:20px}
.thesis-textarea{width:100%;min-height:90px;padding:10px 12px;background:var(--paper);border:1px solid rgba(13,13,15,0.2);font-family:var(--sans);font-size:13px;color:var(--ink);resize:vertical;line-height:1.6;outline:none}
.thesis-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(28,58,94,.1)}
.thesis-select{padding:5px 10px;background:var(--paper);border:1px solid rgba(13,13,15,0.2);font-family:var(--mono);font-size:11px;color:var(--ink);outline:none;cursor:pointer}
.thesis-score-bar-bg{background:rgba(13,13,15,.09);height:6px;margin-top:8px;margin-bottom:6px}
.thesis-score-bar{height:6px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.trigger-chip{display:inline-block;padding:3px 8px;background:rgba(13,13,15,.07);border:1px solid rgba(13,13,15,.12);font-family:var(--mono);font-size:9px;color:var(--steel);margin:3px 4px 3px 0;letter-spacing:0.04em}
.thesis-key-metric{text-align:center;padding:8px 6px;background:rgba(13,13,15,.04);border:1px solid var(--rule)}
.thesis-rec-buy{color:var(--green);background:rgba(26,122,74,.08);border:1px solid rgba(26,122,74,.25);font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 10px;letter-spacing:0.1em}
.thesis-rec-hold{color:#7d5a00;background:rgba(200,151,42,.08);border:1px solid rgba(200,151,42,.3);font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 10px;letter-spacing:0.1em}
.thesis-rec-sell{color:var(--red);background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.25);font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 10px;letter-spacing:0.1em}

/* ── ATTRIBUTION PANEL ── */
.attr-row{display:grid;grid-template-columns:80px 1fr 80px 70px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.attr-bar-bg{background:rgba(13,13,15,.08);height:5px}
.attr-bar{height:5px;transition:width .5s}

/* ── SCENARIO CUSTOM FORM ── */
.scenario-input{padding:5px 9px;background:var(--paper);border:1px solid rgba(13,13,15,.2);font-family:var(--mono);font-size:12px;color:var(--ink);width:90px;outline:none;text-align:right}
.scenario-input:focus{border-color:var(--blue)}
.scenario-impact-row{display:grid;grid-template-columns:60px 1fr 80px 80px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule)}

/* ── DESK TAB ── */
.brief-regime{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.2}
.brief-driver{display:inline-block;padding:3px 9px;background:rgba(28,58,94,0.08);border:1px solid rgba(28,58,94,0.2);font-family:var(--mono);font-size:9px;color:var(--blue);letter-spacing:0.1em;margin:3px 4px 3px 0}
.sig-bull{color:var(--green);font-family:var(--mono);font-size:10px;font-weight:500}
.sig-bear{color:var(--red);font-family:var(--mono);font-size:10px;font-weight:500}
.sig-neu{color:var(--steel);font-family:var(--mono);font-size:10px}
.wc-row{display:grid;grid-template-columns:72px 1fr 62px 50px 65px;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);align-items:center;font-size:11px}
.wc-row:last-child{border-bottom:none}
.idea-form-input{width:100%;padding:5px 9px;background:var(--paper);border:1px solid rgba(13,13,15,.2);font-family:var(--sans);font-size:12px;color:var(--ink);outline:none}
.idea-form-input:focus{border-color:var(--blue)}
.idea-form-select{padding:5px 9px;background:var(--paper);border:1px solid rgba(13,13,15,.2);font-family:var(--mono);font-size:11px;color:var(--ink);outline:none;cursor:pointer;width:100%}
.risk-ok{color:var(--green);font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.1em}
.risk-warn{color:#7d5a00;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.1em}
.risk-block{color:var(--red);font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.1em}
.stats-strip{display:flex;gap:0;border:1px solid var(--rule);margin-bottom:18px}
.stats-cell{flex:1;padding:11px 16px;border-right:1px solid var(--rule);background:var(--cream)}
.stats-cell:last-child{border-right:none}
.stats-num{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);line-height:1}
.stats-lbl{font-family:var(--mono);font-size:8.5px;color:var(--steel);letter-spacing:0.1em;margin-top:3px}
.idea-dir-long{color:var(--green);font-family:var(--mono);font-size:10px;font-weight:500}
.idea-dir-short{color:var(--red);font-family:var(--mono);font-size:10px;font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(13,13,15,0.52);z-index:999;display:flex;align-items:center;justify-content:center}
.overlay-box{background:var(--paper);border:1px solid var(--ink);padding:24px;min-width:320px;max-width:480px;width:90%;position:relative}
/* ── Draft Ideas ── */
.draft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.draft-card{background:var(--paper);border:1px solid var(--rule);padding:16px;position:relative}
.draft-card-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.draft-card-ticker{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:0.08em}
.draft-card-body{font-size:11px;line-height:1.55;color:var(--ink);margin-bottom:10px}
.draft-card-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.draft-meta-cell{font-family:var(--mono);font-size:10px}
.draft-meta-lbl{color:var(--steel);font-size:9px;letter-spacing:0.08em;margin-bottom:1px}
.draft-meta-val{font-weight:600}
.draft-card-actions{display:flex;gap:8px}
.source-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;padding:2px 8px;border:1px solid;margin-left:auto}
.source-badge-ai{color:var(--blue);border-color:rgba(30,100,200,.3);background:rgba(30,100,200,.05)}
.source-badge-det{color:var(--steel);border-color:rgba(74,85,104,.3);background:rgba(74,85,104,.04)}

/* ── ENGINE TAB ── */
.engine-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.engine-regime{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);flex:1}
.engine-regime-sub{font-family:var(--mono);font-size:9px;color:var(--steel);letter-spacing:0.1em;margin-top:2px}
.engine-account{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);margin-bottom:18px}
.engine-account-cell{padding:12px 16px;border-right:1px solid var(--rule);background:var(--cream)}
.engine-account-cell:last-child{border-right:none}
.engine-account-val{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);line-height:1}
.engine-account-lbl{font-family:var(--mono);font-size:8px;color:var(--steel);letter-spacing:0.12em;margin-top:3px}
.engine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:24px}
.engine-card{background:var(--paper);border:1px solid var(--rule);padding:0;overflow:hidden}
.engine-card-head{padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.engine-card-ticker-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.engine-card-ticker{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:0.06em}
.engine-dir-long{color:var(--green);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0.12em;padding:2px 7px;background:rgba(26,122,74,.09);border:1px solid rgba(26,122,74,.25)}
.engine-dir-short{color:var(--red);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0.12em;padding:2px 7px;background:rgba(192,57,43,.09);border:1px solid rgba(192,57,43,.25)}
.engine-decision-allowed{font-family:var(--mono);font-size:8.5px;letter-spacing:0.1em;padding:2px 7px;color:var(--green);background:rgba(26,122,74,.07);border:1px solid rgba(26,122,74,.2)}
.engine-decision-caution{font-family:var(--mono);font-size:8.5px;letter-spacing:0.1em;padding:2px 7px;color:#7d5a00;background:rgba(200,151,42,.08);border:1px solid rgba(200,151,42,.3)}
.engine-decision-blocked{font-family:var(--mono);font-size:8.5px;letter-spacing:0.1em;padding:2px 7px;color:var(--red);background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.25)}
.shariah-badge{font-family:var(--mono);font-size:8px;letter-spacing:0.08em;padding:2px 6px;border-radius:3px;margin-left:5px}
.shariah-badge-halal{color:#1a7a4a;background:rgba(26,122,74,.06);border:1px solid rgba(26,122,74,.18)}
.shariah-badge-sector{font-size:8px;color:var(--steel);margin-left:4px}
.engine-playbook-row{display:flex;align-items:center;gap:6px}
.engine-playbook-name{font-family:var(--mono);font-size:9px;color:var(--blue);letter-spacing:0.08em;text-transform:uppercase}
.engine-playbook-cat{font-family:var(--mono);font-size:8px;color:var(--steel);letter-spacing:0.06em;padding:1px 5px;background:rgba(13,13,15,.06);border:1px solid var(--rule)}
.engine-conf-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.engine-conf-bar-bg{flex:1;height:4px;background:rgba(13,13,15,.1)}
.engine-conf-bar{height:4px;background:var(--gold);transition:width .5s}
.engine-conf-val{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink);min-width:32px;text-align:right}
.engine-rationale{padding:12px 16px;font-size:11.5px;line-height:1.6;color:var(--ink);border-bottom:1px solid var(--rule)}
.engine-learn-toggle{width:100%;padding:9px 16px;background:var(--cream);border:none;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--steel);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.engine-learn-toggle:hover{background:rgba(13,13,15,.06)}
.engine-learn-section{padding:14px 16px;background:rgba(245,240,232,.6);border-bottom:1px solid var(--rule)}
.engine-learn-label{font-family:var(--mono);font-size:8.5px;letter-spacing:0.12em;color:var(--blue);margin-bottom:5px;text-transform:uppercase}
.engine-learn-body{font-size:11px;line-height:1.65;color:var(--ink);margin-bottom:14px}
.engine-learn-body:last-child{margin-bottom:0}
.engine-terms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.engine-term{padding:8px 10px;background:var(--paper);border:1px solid var(--rule)}
.engine-term-name{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--blue);letter-spacing:0.06em;margin-bottom:3px}
.engine-term-def{font-size:10px;line-height:1.5;color:var(--steel)}
.engine-falsif-list{list-style:none;padding:0;margin:0}
.engine-falsif-item{font-size:11px;line-height:1.55;color:var(--ink);padding:4px 0 4px 14px;position:relative;border-bottom:1px solid rgba(13,13,15,.06)}
.engine-falsif-item:last-child{border-bottom:none}
.engine-falsif-item::before{content:'✕';position:absolute;left:0;color:var(--red);font-size:9px;top:5px}
.engine-flags{padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px}
.engine-flag{font-family:var(--mono);font-size:8.5px;letter-spacing:0.06em;padding:2px 8px;background:rgba(192,57,43,.06);border:1px solid rgba(192,57,43,.2);color:var(--red)}
.engine-perf{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--rule);margin-bottom:20px}
.engine-perf-cell{padding:11px 14px;border-right:1px solid var(--rule);background:var(--cream)}
.engine-perf-cell:last-child{border-right:none}
.engine-perf-val{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);line-height:1}
.engine-perf-lbl{font-family:var(--mono);font-size:8px;color:var(--steel);letter-spacing:0.1em;margin-top:3px}
.engine-positions{margin-bottom:20px}
.engine-pos-row{display:grid;grid-template-columns:70px 50px 50px 1fr 80px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:11px}
.engine-pos-row:last-child{border-bottom:none}
.engine-empty{padding:40px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:0.08em;border:1px dashed rgba(13,13,15,.15)}
@media(max-width:640px){.engine-account{grid-template-columns:1fr 1fr}.engine-perf{grid-template-columns:1fr 1fr}.engine-terms-grid{grid-template-columns:1fr}}

/* ── NEWS TAB ── */
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.news-panel{background:var(--cream);border:1px solid var(--rule);border-radius:0;padding:16px}
.news-panel-title{font-size:9px;font-weight:700;letter-spacing:0.2em;color:var(--steel);text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.news-item{padding:10px 0;border-bottom:1px solid var(--rule)}
.news-item:last-child{border-bottom:none}
.news-headline{font-size:12px;color:var(--ink);line-height:1.5;margin-bottom:4px;font-weight:500}
.news-meta{font-size:10px;color:var(--steel);font-family:var(--mono);letter-spacing:0.04em}
.news-ticker-btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.news-ticker-btn{padding:4px 12px;border-radius:0;border:1px solid var(--rule);background:transparent;color:var(--steel);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;transition:all .15s}
.news-ticker-btn:hover{border-color:var(--blue);color:var(--blue)}
.news-ticker-btn.active{background:var(--ink);color:var(--gold-light);border-color:var(--ink)}
.sentiment-bar{height:6px;border-radius:0;overflow:hidden;display:flex;margin:8px 0;border:1px solid var(--rule)}
.sentiment-bull{background:var(--green)}
.sentiment-bear{background:var(--red)}
.cal-event-news{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.cal-event-news:last-child{border-bottom:none}
.cal-date-news{font-family:var(--mono);font-size:10px;color:var(--blue);min-width:70px;letter-spacing:0.04em}
.cal-name-news{font-size:12px;color:var(--ink);flex:1}
.imp-high-news{background:rgba(192,57,43,.08);color:var(--red);border:1px solid rgba(192,57,43,.3);font-family:var(--mono);font-size:9px;padding:2px 7px;letter-spacing:0.1em}
.imp-med-news{background:rgba(200,151,42,.08);color:var(--gold);border:1px solid rgba(200,151,42,.3);font-family:var(--mono);font-size:9px;padding:2px 7px;letter-spacing:0.1em}
.imp-low-news{background:rgba(26,122,74,.08);color:var(--green);border:1px solid rgba(26,122,74,.25);font-family:var(--mono);font-size:9px;padding:2px 7px;letter-spacing:0.1em}

/* ── GLOSSARY TAB ── */
.tod-card{background:var(--ink);border:1px solid rgba(200,151,42,0.3);border-radius:0;padding:20px;margin-bottom:20px;border-left:3px solid var(--gold)}
.tod-label{font-size:9px;font-weight:700;letter-spacing:0.2em;color:var(--gold-light);text-transform:uppercase;margin-bottom:8px}
.tod-term{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--paper);margin-bottom:6px}
.tod-cat{display:inline-block;font-size:9px;padding:2px 8px;border-radius:0;background:rgba(232,192,96,.12);color:var(--gold-light);border:1px solid rgba(232,192,96,.25);font-family:var(--mono);letter-spacing:0.1em;margin-bottom:12px}
.tod-def{font-size:13px;color:rgba(245,240,232,0.88);line-height:1.7;margin-bottom:10px}
.tod-example{font-size:12px;color:rgba(245,240,232,0.55);font-style:italic;border-left:3px solid rgba(200,151,42,.4);padding-left:12px;margin-bottom:10px}
.tod-note{font-size:11px;padding:8px 12px;border-radius:0;margin-top:8px;line-height:1.6}
.tod-note.islamic{background:rgba(26,122,74,.12);color:#6ee7b7;border-left:3px solid var(--green)}
.tod-note.interview{background:rgba(200,151,42,.12);color:var(--gold-light);border-left:3px solid var(--gold)}
.glos-search{width:100%;padding:8px 12px;background:var(--cream);border:1px solid var(--rule);border-radius:0;color:var(--ink);font-family:var(--sans);font-size:13px;margin-bottom:12px;box-sizing:border-box;outline:none}
.glos-search:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(28,58,94,.1)}
.glos-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.glos-cat-btn{padding:4px 12px;border-radius:0;border:1px solid var(--rule);background:transparent;color:var(--steel);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;transition:all .15s}
.glos-cat-btn:hover{border-color:var(--blue);color:var(--blue)}
.glos-cat-btn.active{background:var(--ink);color:var(--gold-light);border-color:var(--ink)}
.glos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.glos-card{background:var(--cream);border:1px solid var(--rule);border-radius:0;padding:14px;cursor:pointer;transition:border-color .15s}
.glos-card:hover{border-color:var(--blue)}
.glos-card-term{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:4px;font-family:var(--sans)}
.glos-card-cat{font-family:var(--mono);font-size:9px;color:var(--steel);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px}
.glos-card-def{font-size:11px;color:var(--steel);line-height:1.5}
.glos-expanded{background:var(--cream);border:1px solid var(--blue);border-left:3px solid var(--blue);border-radius:0;padding:20px;margin-top:16px}
.glos-expanded-term{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px}
.glos-close-btn{float:right;background:transparent;border:1px solid var(--rule);color:var(--steel);padding:4px 10px;border-radius:0;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;transition:all .15s}
.glos-close-btn:hover{background:var(--ink);color:var(--paper)}

/* ── SALES TAB ── */
.sales-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.sales-headline{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink);line-height:1.3;max-width:760px}
.sales-regime-tag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:0.12em;padding:3px 10px;background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.25);color:var(--red);margin-top:6px}
.sales-morning-note{padding:16px 20px;background:rgba(28,58,94,.05);border-left:3px solid var(--blue);font-size:13px;line-height:1.75;color:var(--ink);margin-bottom:20px;font-style:italic}
/* Scenario probability bars */
.scenario-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.scenario-card{padding:14px 16px;border:1px solid var(--rule);background:var(--paper)}
.scenario-card-base{border-top:3px solid var(--blue)}
.scenario-card-bull{border-top:3px solid var(--green)}
.scenario-card-bear{border-top:3px solid var(--red)}
.scenario-prob{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1}
.scenario-prob-base{color:var(--blue)}
.scenario-prob-bull{color:var(--green)}
.scenario-prob-bear{color:var(--red)}
.scenario-prob-bar{height:4px;background:rgba(13,13,15,.08);margin:6px 0 10px}
.scenario-prob-fill-base{height:4px;background:var(--blue)}
.scenario-prob-fill-bull{height:4px;background:var(--green)}
.scenario-prob-fill-bear{height:4px;background:var(--red)}
.scenario-title{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.1em;color:var(--ink);margin-bottom:6px;text-transform:uppercase}
.scenario-narrative{font-size:11px;line-height:1.6;color:var(--steel);margin-bottom:8px}
.scenario-assets{font-family:var(--mono);font-size:9px;color:var(--blue);letter-spacing:0.04em}
/* Cross-asset matrix */
.xasset-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--rule);margin-bottom:20px}
.xasset-cell{padding:10px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--paper)}
.xasset-cell:nth-child(5n){border-right:none}
.xasset-cell:nth-last-child(-n+5){border-bottom:none}
.xasset-asset{font-family:var(--mono);font-size:8.5px;letter-spacing:0.04em;color:var(--steel);margin-bottom:4px;line-height:1.3}
.xasset-signal{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.08em;margin-bottom:3px}
.xasset-bull{color:var(--green)}
.xasset-bear{color:var(--red)}
.xasset-neutral{color:var(--gold)}
.xasset-rationale{font-size:9.5px;line-height:1.45;color:var(--ink)}
/* Client impact cards */
.client-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.client-card{border:1px solid var(--rule);background:var(--paper);overflow:hidden}
.client-card-head{padding:12px 14px 10px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.client-icon{font-size:18px;line-height:1}
.client-type{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.08em;color:var(--ink);flex:1}
.client-urgency-HIGH{font-family:var(--mono);font-size:8px;padding:2px 7px;background:rgba(192,57,43,.08);color:var(--red);border:1px solid rgba(192,57,43,.25);letter-spacing:0.08em}
.client-urgency-MEDIUM{font-family:var(--mono);font-size:8px;padding:2px 7px;background:rgba(200,151,42,.08);color:var(--gold);border:1px solid rgba(200,151,42,.3);letter-spacing:0.08em}
.client-urgency-LOW{font-family:var(--mono);font-size:8px;padding:2px 7px;background:rgba(26,122,74,.08);color:var(--green);border:1px solid rgba(26,122,74,.25);letter-spacing:0.08em}
.client-body{padding:12px 14px}
.client-concern{font-size:11.5px;line-height:1.6;color:var(--ink);margin-bottom:10px;font-weight:500}
.client-impact{font-size:11px;line-height:1.6;color:var(--steel);margin-bottom:10px}
.client-section-lbl{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;color:var(--blue);margin-bottom:5px;text-transform:uppercase}
.client-questions{list-style:none;padding:0;margin:0 0 10px}
.client-question{font-size:10.5px;line-height:1.5;color:var(--steel);padding:3px 0 3px 12px;position:relative;border-bottom:1px solid rgba(13,13,15,.05)}
.client-question:last-child{border-bottom:none}
.client-question::before{content:'?';position:absolute;left:0;color:var(--blue);font-family:var(--mono);font-size:9px;font-weight:700}
.client-talking{padding:10px 12px;background:rgba(28,58,94,.05);border-left:2px solid var(--blue);font-size:11px;line-height:1.65;color:var(--ink);margin-bottom:8px}
.client-product{font-size:10.5px;line-height:1.55;color:var(--steel);padding:8px 14px;background:var(--cream);border-top:1px solid var(--rule)}
.client-product::before{content:'◈ ';color:var(--gold);font-size:10px}
/* Central bank strip */
.cb-strip{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0;border:1px solid var(--rule);margin-bottom:20px}
.cb-cell{padding:12px 16px;border-right:1px solid var(--rule)}
.cb-cell:last-child{border-right:none}
.cb-label{font-family:var(--mono);font-size:8.5px;letter-spacing:0.12em;color:var(--blue);margin-bottom:5px;text-transform:uppercase}
.cb-text{font-size:11px;line-height:1.65;color:var(--ink)}
/* Catalysts */
.catalyst-row{display:grid;grid-template-columns:160px 80px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:start;font-size:11px}
.catalyst-row:last-child{border-bottom:none}
.catalyst-event{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:0.04em;color:var(--ink)}
.catalyst-date{font-family:var(--mono);font-size:9px;color:var(--steel)}
.catalyst-impact{line-height:1.55;color:var(--steel)}
@media(max-width:900px){.xasset-grid{grid-template-columns:repeat(2,1fr)}.scenario-grid{grid-template-columns:1fr}.client-grid{grid-template-columns:1fr 1fr}.cb-strip{grid-template-columns:1fr}}
@media(max-width:640px){.client-grid{grid-template-columns:1fr}}
/* ── ENGINE ENHANCEMENTS ── */
.pending-row{display:grid;grid-template-columns:80px 50px 1fr 60px auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:11px}
.pending-row:last-child{border-bottom:none}
.scan-row{display:grid;grid-template-columns:70px 1fr 100px auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);font-size:11px}
.scan-row:last-child{border-bottom:none}
.scan-conf-bar{height:4px;background:rgba(13,13,15,.08);border-radius:0;overflow:hidden}
.scan-conf-fill{height:4px;background:var(--gold);transition:width .4s}
.exec-log-row{display:grid;grid-template-columns:60px 60px auto 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:10px}
.exec-log-row:last-child{border-bottom:none}
.badge-executed{font-family:var(--mono);font-size:9px;padding:2px 7px;background:rgba(26,122,74,.08);color:var(--green);border:1px solid rgba(26,122,74,.25);letter-spacing:0.08em}
.badge-rejected{font-family:var(--mono);font-size:9px;padding:2px 7px;background:rgba(192,57,43,.08);color:var(--red);border:1px solid rgba(192,57,43,.25);letter-spacing:0.08em}
.badge-skipped{font-family:var(--mono);font-size:9px;padding:2px 7px;background:rgba(200,151,42,.08);color:var(--gold);border:1px solid rgba(200,151,42,.3);letter-spacing:0.08em}
.btn-approve{background:rgba(26,122,74,.08);border:1px solid rgba(26,122,74,.3);color:var(--green);padding:3px 10px;border-radius:0;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.08em;transition:all .15s}
.btn-approve:hover{background:var(--green);color:var(--paper);border-color:var(--green)}
.btn-reject{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.3);color:var(--red);padding:3px 10px;border-radius:0;cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:0.08em;transition:all .15s}
.btn-reject:hover{background:var(--red);color:var(--paper);border-color:var(--red)}
.badge-not-held{font-family:var(--mono);font-size:8px;padding:2px 6px;background:rgba(200,151,42,.08);color:var(--gold);border:1px solid rgba(200,151,42,.25);letter-spacing:0.08em}
.badge-held{font-family:var(--mono);font-size:8px;padding:2px 6px;background:rgba(28,58,94,.08);color:var(--blue);border:1px solid rgba(28,58,94,.2);letter-spacing:0.08em}
/* ── SIGNALS TAB (correlations + backtest) ── */
.sig-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.corr-matrix{display:inline-block;border:1px solid var(--rule);overflow:auto;margin-bottom:20px;max-width:100%}
.corr-matrix table{border-collapse:collapse;font-family:var(--mono);font-size:9px}
.corr-matrix th,.corr-matrix td{padding:5px 7px;border:1px solid var(--rule);white-space:nowrap}
.corr-matrix th{background:var(--cream);font-weight:700;letter-spacing:0.06em;color:var(--steel)}
.corr-cell-pos{font-weight:700}
.corr-cell-neg{font-weight:700}
.pair-tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:2px solid var(--rule);margin-bottom:20px}
.pair-tab{padding:8px 16px;font-family:var(--mono);font-size:9.5px;letter-spacing:0.08em;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--steel);transition:all .15s}
.pair-tab:hover{color:var(--ink);background:var(--cream)}
.pair-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.pair-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.backtest-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--rule)}
.bt-metric-cell{padding:10px 12px;border-right:1px solid var(--rule)}
.bt-metric-cell:last-child{border-right:none}
.bt-metric-val{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1}
.bt-metric-lbl{font-family:var(--mono);font-size:8px;color:var(--steel);letter-spacing:0.1em;margin-top:2px}
.param-grid-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px}
.param-grid-table th{padding:5px 10px;background:var(--cream);border:1px solid var(--rule);font-size:8.5px;letter-spacing:0.08em;color:var(--steel)}
.param-grid-table td{padding:5px 10px;border:1px solid var(--rule)}
.param-grid-best{background:rgba(26,122,74,.07)}
.signal-badge-long{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;background:rgba(26,122,74,.1);color:var(--green);border:1px solid rgba(26,122,74,.3);letter-spacing:0.08em}
.signal-badge-short{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;background:rgba(192,57,43,.1);color:var(--red);border:1px solid rgba(192,57,43,.3);letter-spacing:0.08em}
.signal-badge-flat{font-family:var(--mono);font-size:10px;padding:3px 10px;background:rgba(200,151,42,.08);color:var(--gold);border:1px solid rgba(200,151,42,.3);letter-spacing:0.08em}
.meth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.meth-item{padding:10px 14px;background:var(--cream);border:1px solid var(--rule)}
.meth-label{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;color:var(--blue);margin-bottom:4px;text-transform:uppercase}
.meth-val{font-size:11px;line-height:1.55;color:var(--ink)}
@media(max-width:900px){.pair-layout{grid-template-columns:1fr}.backtest-metrics{grid-template-columns:1fr 1fr 1fr}.meth-grid{grid-template-columns:1fr}}
/* ── RESEARCH TAB — v3 sell-side layout ── */
/* Masthead */
.rp-wrap{max-width:900px}
.rp-masthead{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.rp-topline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rp-type{font-family:var(--mono);font-size:8px;letter-spacing:0.22em;color:var(--ink-low);text-transform:uppercase}
.rp-conviction{font-family:var(--mono);font-size:8px;padding:2px 8px;letter-spacing:0.12em;font-weight:700}
.rp-conviction-high{background:#145a32;color:#fff}
.rp-conviction-med{background:#854d0e;color:#fff}
.rp-conviction-spec{background:var(--ink);color:#aaa}
.rp-audience{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.rp-aud-tag{font-family:var(--mono);font-size:7.5px;padding:1px 6px;border:1px solid var(--border-med);color:var(--ink-low);letter-spacing:0.08em}
.rp-aud-tag.active{border-color:var(--acc-snapshot);color:var(--acc-snapshot)}
.rp-title{font-family:var(--display);font-size:clamp(20px,2.5vw,30px);font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:6px}
.rp-subtitle{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--ink-mid);line-height:1.55;margin-bottom:10px}
.rp-meta{font-family:var(--mono);font-size:8.5px;color:var(--ink-low);letter-spacing:0.07em;display:flex;gap:18px;flex-wrap:wrap}
/* Key takeaways */
.rp-takeaways{background:rgba(30,74,140,0.04);border-left:3px solid var(--acc-snapshot);padding:14px 18px;margin-bottom:22px}
.rp-takeaway{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid rgba(30,74,140,0.07)}
.rp-takeaway:last-child{border-bottom:none}
.rp-tk-n{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--acc-snapshot);min-width:14px;padding-top:3px}
.rp-tk-text{font-size:12px;line-height:1.7;color:var(--ink)}
/* Numbered exhibits */
.rp-exhibit{margin-bottom:24px}
.rp-exhibit-label{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:0.14em;color:var(--ink-low);text-transform:uppercase;margin-bottom:3px}
.rp-exhibit-caption{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink);margin-bottom:3px}
.rp-exhibit-sub{font-family:var(--mono);font-size:8.5px;color:var(--ink-low);margin-bottom:10px}
.rp-exhibit-source{font-family:var(--mono);font-size:7.5px;color:var(--ink-low);margin-top:6px;letter-spacing:0.06em}
.rp-exhibit-chart{background:var(--bg-card);border:1px solid var(--border);padding:8px}
/* Body prose */
.rp-section-head{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:0.18em;color:var(--acc-snapshot);text-transform:uppercase;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.rp-body{font-family:var(--serif);font-size:12.5px;line-height:1.85;color:var(--ink);margin-bottom:16px}
/* Scenario strip (3-col) */
.rp-scenario-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--border-med);margin-bottom:22px}
.rp-sc-cell{padding:14px 16px;border-right:1px solid var(--border-med)}
.rp-sc-cell:last-child{border-right:none}
.rp-sc-bear{border-top:3px solid var(--neg)}
.rp-sc-base{border-top:3px solid var(--acc-snapshot)}
.rp-sc-bull{border-top:3px solid var(--pos)}
.rp-sc-label{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px}
.rp-sc-prob{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;margin-bottom:4px}
.rp-sc-bear .rp-sc-label,.rp-sc-bear .rp-sc-prob{color:var(--neg)}
.rp-sc-base .rp-sc-label,.rp-sc-base .rp-sc-prob{color:var(--acc-snapshot)}
.rp-sc-bull .rp-sc-label,.rp-sc-bull .rp-sc-prob{color:var(--pos)}
.rp-sc-trigger{font-family:var(--mono);font-size:8.5px;color:var(--ink-low);margin-bottom:8px}
.rp-sc-outcome{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink);margin-bottom:8px}
.rp-sc-narrative{font-size:10.5px;line-height:1.6;color:var(--ink-mid)}
/* Dispatch Angle — the opinionated callout */
.rp-dispatch-angle{background:var(--ink);color:var(--bg);padding:20px 24px;margin-bottom:22px;position:relative;overflow:hidden}
.rp-dispatch-angle::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 19px,rgba(255,255,255,0.025) 19px,rgba(255,255,255,0.025) 20px);pointer-events:none}
.rp-da-label{font-family:var(--mono);font-size:8px;letter-spacing:0.22em;color:var(--acc-gold-lt);text-transform:uppercase;margin-bottom:8px}
.rp-da-headline{font-family:var(--display);font-size:clamp(16px,2vw,22px);font-weight:600;color:var(--bg);line-height:1.25;margin-bottom:12px;font-style:italic}
.rp-da-mechanism{font-size:12px;line-height:1.8;color:rgba(232,227,216,0.88);margin-bottom:16px}
.rp-da-wl{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.rp-da-col-label{font-family:var(--mono);font-size:8px;letter-spacing:0.14em;font-weight:700;margin-bottom:7px}
.rp-da-win .rp-da-col-label{color:#4ade80}
.rp-da-lose .rp-da-col-label{color:#f87171}
.rp-da-item{font-size:11px;line-height:1.6;color:rgba(232,227,216,0.80);padding:4px 0 4px 12px;position:relative;border-bottom:1px solid rgba(255,255,255,0.06)}
.rp-da-item:last-child{border-bottom:none}
.rp-da-win .rp-da-item::before{content:'↑';position:absolute;left:0;color:#4ade80;font-family:var(--mono);font-size:9px}
.rp-da-lose .rp-da-item::before{content:'↓';position:absolute;left:0;color:#f87171;font-family:var(--mono);font-size:9px}
.rp-da-trade{border-top:1px solid rgba(255,255,255,0.12);padding-top:12px;font-family:var(--mono);font-size:9.5px;color:var(--acc-gold-lt);letter-spacing:0.05em}
.rp-da-trade::before{content:'◈ TRADE EXPRESSION: ';font-size:8px;letter-spacing:0.14em;opacity:.65}
/* Client Impact Matrix */
.rp-client-matrix{border:1px solid var(--border-med);margin-bottom:22px;overflow:hidden}
.rp-cm-head{display:grid;grid-template-columns:140px 60px 1fr 1fr 1fr;gap:0;background:var(--ink);padding:8px 12px}
.rp-cm-head-cell{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;color:rgba(232,227,216,0.55);text-transform:uppercase}
.rp-cm-row{display:grid;grid-template-columns:140px 60px 1fr 1fr 1fr;gap:0;padding:10px 12px;border-bottom:1px solid var(--border);align-items:start}
.rp-cm-row:last-child{border-bottom:none}
.rp-cm-row:hover{background:var(--bg-alt)}
.rp-cm-type{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ink);letter-spacing:0.06em}
.rp-cm-rel{font-family:var(--mono);font-size:8px;padding:2px 6px;text-align:center}
.rp-cm-rel-high{background:rgba(139,26,26,0.1);color:var(--neg);border:1px solid rgba(139,26,26,0.2)}
.rp-cm-rel-med{background:rgba(133,77,14,0.1);color:var(--acc-portfolio);border:1px solid rgba(133,77,14,0.2)}
.rp-cm-rel-low{background:rgba(107,103,120,0.1);color:var(--ink-low);border:1px solid var(--border)}
.rp-cm-cell{font-size:10.5px;line-height:1.55;color:var(--ink-mid);padding-right:8px}
/* Price targets table */
.rp-targets-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:20px}
.rp-targets-table th{padding:7px 12px;background:var(--ink);color:rgba(232,227,216,0.7);font-family:var(--mono);font-size:7.5px;letter-spacing:0.12em;text-align:left}
.rp-targets-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;vertical-align:top}
.rp-targets-table tr:hover td{background:var(--bg-alt)}
.rp-tgt-bull{color:var(--pos);font-weight:700}
.rp-tgt-bear{color:var(--neg);font-weight:700}
.rp-tgt-base{color:var(--acc-snapshot);font-weight:700}
/* Key metrics strip */
.rp-metrics-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--border-med);margin-bottom:22px}
.rp-metric-cell{padding:10px 12px;border-right:1px solid var(--border-med)}
.rp-metric-cell:last-child{border-right:none}
.rp-metric-val{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink);line-height:1}
.rp-metric-lbl{font-family:var(--mono);font-size:7.5px;color:var(--ink-low);letter-spacing:0.1em;margin-top:3px}
.rp-metric-targets{font-family:var(--mono);font-size:8px;color:var(--ink-low);margin-top:4px}
/* General utilities */
.rp-top-trade{padding:12px 18px;background:rgba(20,90,50,0.07);border-left:3px solid var(--pos);margin-bottom:20px;font-size:12px;line-height:1.7;color:var(--ink);font-weight:500}
.rp-top-trade::before{content:'◈ TOP TRADE · ';font-family:var(--mono);font-size:8.5px;color:var(--pos);font-weight:700;letter-spacing:0.12em}
.rp-watchpoints{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.rp-watchpoint{display:flex;gap:10px;padding:7px 12px;background:var(--bg-alt);border-left:2px solid var(--acc-gold);font-family:var(--mono);font-size:9.5px;color:var(--ink)}
.rp-watchpoint::before{content:'⊙';color:var(--acc-gold);font-size:11px}
.rp-source-badge{font-family:var(--mono);font-size:7.5px;padding:2px 7px;letter-spacing:0.08em;display:inline-block}
.rp-source-live{background:rgba(20,90,50,.1);color:var(--pos);border:1px solid rgba(20,90,50,.25)}
.rp-source-seeded{background:rgba(184,134,42,.1);color:var(--acc-gold);border:1px solid rgba(184,134,42,.3)}
.rp-source-cache{background:rgba(30,74,140,.07);color:var(--neu);border:1px solid rgba(30,74,140,.2)}
/* Legacy classes kept for sub-renderers not yet migrated */
.research-masthead{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.research-firm{font-family:var(--mono);font-size:9px;letter-spacing:0.2em;color:var(--steel);text-transform:uppercase;margin-bottom:4px}
.research-title{font-family:var(--display);font-size:24px;font-weight:600;color:var(--ink);line-height:1.25;margin-bottom:6px}
.research-subtitle{font-family:var(--serif);font-size:14px;font-style:italic;color:var(--steel);margin-bottom:10px;line-height:1.4}
.research-meta{font-family:var(--mono);font-size:9px;color:var(--steel);letter-spacing:0.08em;display:flex;gap:20px;flex-wrap:wrap}
.research-abstract{background:rgba(30,74,140,.04);border-left:3px solid var(--neu);padding:14px 18px;margin-bottom:20px}
.research-abstract-item{font-size:12px;line-height:1.7;color:var(--ink);padding:4px 0 4px 14px;position:relative}
.research-abstract-item::before{content:'■';position:absolute;left:0;color:var(--neu);font-size:7px;top:8px}
.research-body{font-family:var(--serif);font-size:12.5px;line-height:1.8;color:var(--ink);margin-bottom:18px}
.research-scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.research-scenario{padding:14px 16px;border:1px solid var(--rule)}
.research-scenario-base{border-top:3px solid var(--neu)}
.research-scenario-stress{border-top:3px solid var(--neg)}
.research-scenario-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.1em;margin-bottom:4px;text-transform:uppercase}
.research-scenario-anchor{font-family:var(--mono);font-size:9px;color:var(--steel);margin-bottom:8px}

<body>
<div id="root"></div>

<script>
// ─── BOOT: wait for Recharts ─────────────────────────────────────────────────
function boot(attempt) {
  if (attempt > 40) {
    document.getElementById('root').innerHTML = '<p style="color:#c0392b;padding:40px">Error: Recharts failed to load. Check your internet connection.</p>';
    return;
  }
  if (typeof window.Recharts === 'undefined') { setTimeout(() => boot(attempt + 1), 300); return; }
  init();
}
boot(0);

function init() {
const { useState, useEffect, useCallback, useRef } = React;
const {
  LineChart, Line, AreaChart, Area, BarChart, Bar, PieChart, Pie, Cell,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, ReferenceLine,
} = window.Recharts;

const PIE_COLORS = ['#1c3a5e','#1a7a4a','#c8972a','#5b21b6','#8b4513','#2d6a8f'];

// ─── API CLIENT ───────────────────────────────────────────────────────────────
// All data fetching goes through the Express backend.
// Never calls external APIs directly.

const API_BASE = window.location.hostname === 'localhost' ? '' : '';

async function apiFetch(path, opts) {
  const res = await fetch(`${API_BASE}${path}`, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ─── SOURCE BADGE HELPER ─────────────────────────────────────────────────────
// Returns a React element showing provenance: source, timestamp, stale flag.
function SourceBadge({ source, fetchedAt, stale }) {
  if (!source) return null;
  const cls = source === 'live' ? 'src-live' : source === 'cache' ? 'src-cache' : 'src-seeded';
  const dotCls = source === 'live' ? 'src-dot-live' : source === 'cache' ? 'src-dot-cache' : 'src-dot-seeded';
  const label = source === 'live' ? 'LIVE' : source === 'cache' ? 'CACHED' : 'SEEDED';
  const ts    = fetchedAt ? new Date(fetchedAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
  return React.createElement('span', { className:`src-badge ${cls}`, title: fetchedAt || source },
    React.createElement('span', { className:`src-dot ${dotCls}` }),
    `${label}${ts ? ' · ' + ts : ''}${stale && source !== 'seeded' ? ' ⚠' : ''}`
  );
}

// ─── AI COST BADGE ────────────────────────────────────────────────────────────
function AICostBadge({ calls = 1, cached = '24h' }) {
  return React.createElement('span', { className:'ai-cost-badge', title:`Uses ${calls} Anthropic API call(s) — counted against your daily/monthly cap` },
    `⚡ ${calls} AI call${calls > 1 ? 's' : ''} · cached ${cached}`
  );
}

function FreeBadge({ source = 'FRED' }) {
  return React.createElement('span', { className:'free-badge', title:`Free data from ${source}` },
    `FREE · ${source}`
  );
}

// ─── STAT CARD ────────────────────────────────────────────────────────────────
function StatCard(title, val, label, cls, explainer) {
  return React.createElement('div', { className:'card' },
    React.createElement('div', { className:'card-title' }, title),
    React.createElement('div', { className:`stat-val ${cls||''}` }, val),
    React.createElement('div', { className:'stat-label' }, label),
    explainer || null
  );
}

// ─── EXPLAINER DATA (educational context for each metric) ────────────────────
const EXPLAINERS = {
  dgs10:   { term:'10-Year Treasury Yield', what:"The annualised return investors demand to lend to the US government for 10 years. The benchmark 'risk-free rate' against which all assets are priced.", port:"Every equity in your portfolio is discounted against this rate. AMD, as a high-growth stock with earnings weighted far into the future, is most sensitive — a 50bp rise in the 10Y historically reduces growth stock P/Es by 6–10%." },
  dfii10:  { term:'Real Yield (10Y TIPS)', what:"The return on inflation-protected Treasuries. Real yield = Nominal yield − Breakeven inflation. The true risk-free real return with zero credit risk and zero inflation risk.", port:"AMD is a 'long-duration equity': most of its value comes from earnings projected 5–10 years out. Every 25bp rise in real yields reduces the present value of those future earnings by roughly 1–2 P/E turns." },
  t10yie:  { term:'Breakeven Inflation Rate', what:"Nominal 10Y yield minus TIPS 10Y yield — the market's implied 10-year average inflation forecast. If actual inflation matches the breakeven exactly, nominal bonds and TIPS earn identical returns.", port:"High breakevens structurally support SGLN (gold as inflation hedge). They are negative for HBKS (nominal bonds lose purchasing power) and AMD (persistent inflation keeps the Fed hawkish, deferring re-rating)." },
  hyspread:{ term:'High Yield OAS', what:"Option-Adjusted Spread: the extra yield investors demand over Treasuries to hold sub-investment-grade bonds. It's the credit market's real-time fear gauge.", port:"HY spreads are a leading indicator — they typically widen 2–4 months before equity drawdowns materialise. A rapid widening from 3% to 5%+ would signal a risk-off shift pressuring HIUS and AMD." },
  t10y2y:  { term:'10Y–2Y Yield Curve', what:"Spread between 10-year and 2-year Treasury yields. An inverted curve (negative) has preceded every US recession since the 1970s — inversion signals markets expect the Fed to cut, implying a slowdown today.", port:"A bear steepener (long rates rising faster than short-end) simultaneously hurts long-duration equities (AMD) and bond funds (HBKS). HIJS faces additional pressure as BoJ allows JGB yields to rise." },
  rsi14:   { term:'RSI — Relative Strength Index', what:"A momentum oscillator (0–100) measuring speed of recent price moves over a 14-day lookback. Above 70 = overbought; below 30 = oversold.", port:"RSI does not determine intrinsic value — it measures momentum. A sustained move below 30 alongside high volume signals capitulation. A confirmed move above RSI 50 signals a momentum regime shift." },
  portbeta:{ term:'Weighted Portfolio Beta', what:"Portfolio beta = sum of (each position's weight × its beta vs S&P 500). Beta of 1.0 means your portfolio moves in line with the index; 1.5 means 50% more. Measures systematic (market) risk.", port:"SGLN's negative beta (−0.08) is your partial hedge against equity selloffs. AMD's high beta (1.82) means a 10% S&P drawdown historically corresponds to an ~18% AMD drawdown." },
  hhiindex:{ term:'Herfindahl-Hirschman Index', what:"HHI = sum of squared portfolio weights × 10,000. Below 1,000 = diversified; 1,000–1,800 = moderate; above 1,800 = concentrated. Adopted from competition law by risk managers.", port:"A high HHI means returns are dominated by one or two positions. Institutional risk desks set maximum HHI thresholds to ensure no single idea drives performance." },
  usdexp:  { term:'Unhedged USD Exposure', what:"The proportion of your GBP portfolio whose sterling value fluctuates with GBP/USD. Unhedged means no FX forwards are in place — a 1% GBP appreciation directly reduces GBP value of all USD assets by 1%.", port:"AMD and SGLN are 100% USD-denominated and unhedged. A 5% GBP appreciation — plausible in a tariff-rollback scenario — would reduce GBP value of USD positions by 5% with no change in stock prices." },
};

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('market');
  const [toasts, setToasts] = useState([]);

  // ── Adaptive day/night theme ───────────────────────────────────────────────
  const [themeMode, setThemeMode] = useState(() => {
    const h = new Date().getHours();
    return (h >= 6 && h < 19) ? 'day' : 'night';
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', themeMode === 'night' ? 'night' : '');
  }, [themeMode]);
  function toggleTheme() {
    setThemeMode(m => m === 'day' ? 'night' : 'day');
  }

  // ── Data state ─────────────────────────────────────────────────────────────
  const [snapshot, setSnapshot]       = useState(null);
  const [snapshotMeta, setSnapshotMeta] = useState(null);
  const [snapshotLoading, setSnapshotLoading] = useState(true);

  const [portfolio, setPortfolio]     = useState(null);
  const [portMeta, setPortMeta]       = useState(null);
  const [portLoading, setPortLoading] = useState(true);

  const [events, setEvents]           = useState([]);
  const [econ, setEcon]               = useState([]);
  const [eventsMeta, setEventsMeta]   = useState(null);
  const [eventsLoading, setEventsLoading] = useState(true);

  const [riskItems, setRiskItems]     = useState([]);
  const [riskMeta, setRiskMeta]       = useState(null);
  const [riskLoading, setRiskLoading] = useState(true);

  const [expandedPos, setExpandedPos] = useState(null);
  const [stressScenario, setStressScenario] = useState('base');
  const [openExplainer, setOpenExplainer] = useState(null);
  const [explainData, setExplainData] = useState({});
  const [explainLoading, setExplainLoading] = useState({});

  // ── Phase 2 state ──────────────────────────────────────────────────────────
  // Thesis Lab
  const [thesisTicker, setThesisTicker]     = useState('AMD');
  const [thesisText, setThesisText]         = useState('');
  const [thesisHorizon, setThesisHorizon]   = useState('12 months');
  const [thesisResult, setThesisResult]     = useState(null);
  const [thesisLoading, setThesisLoading]   = useState(false);

  // Scenario Engine
  const [scenarioData, setScenarioData]     = useState(null);
  const [scenarioLoading, setScenarioLoading] = useState(true);
  const [customEq, setCustomEq]             = useState('');
  const [customRates, setCustomRates]       = useState('');
  const [customFx, setCustomFx]             = useState('');
  const [customResult, setCustomResult]     = useState(null);

    const key = ticker.toLowerCase().replace(/[^a-z0-9]/g, '_');
    if (explainData[key]) return; // cached in component state
    setExplainLoading(prev => ({ ...prev, [key]: true }));
    try {
      const resp = await apiFetch(`/api/explain/${encodeURIComponent(ticker)}`);
      setExplainData(prev => ({ ...prev, [key]: resp.data }));
    } catch (err) {
      setExplainData(prev => ({ ...prev, [key]: { ticker, what: 'Unavailable', now: err.message, portfolio: '', confidence: 0 } }));

      setThesisResult(resp);

    const fx = parseFloat(customFx || '0') / 100;   // user enters %, we pass decimal

      showToast('Enter at least one shock to run a scenario', 'info');
      return;
    }
    setCustomRunning(true);
    setCustomResult(null);
    try {
      const resp = await apiFetch('/api/scenario/custom', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ equityMktDelta: eq, ratesDelta: rd, fxDelta: fx }),

      setCustomResult(resp.data);
      showToast('Custom scenario computed', 'success');

  // ── DESK: submit new idea ────────────────────────────────────────────────
  async function submitNewIdea(e) {
    e && e.preventDefault();
    const body = {
      ticker:       newIdea.ticker.toUpperCase().trim(),
      direction:    newIdea.direction,
      thesis:       newIdea.thesis.trim(),
      catalyst:     newIdea.catalyst.trim(),
      entry:        parseFloat(newIdea.entry),
      stop:         parseFloat(newIdea.stop),
      target:       parseFloat(newIdea.target),
      invalidation: newIdea.invalidation.trim(),
      horizon:      newIdea.horizon,
      confidence:   parseInt(newIdea.confidence, 10),
      sizePct:      parseFloat(newIdea.sizePct),
      notes:        newIdea.notes.trim(),
    };
    setIdeaSubmitting(true);
    setLastRiskCheck(null);
    try {
      const resp = await apiFetch('/api/ideas', {
        method:  'POST',
        headers: { 'content-type': 'application/json' },
        body:    JSON.stringify(body),
      });
      setLastRiskCheck(resp.data.riskCheck);
      await loadIdeasData();
      if (resp.data.riskCheck?.level !== 'BLOCK') {
        setShowIdeaForm(false);
        setNewIdea({ ticker:'', direction:'LONG', thesis:'', catalyst:'', entry:'', stop:'', target:'', invalidation:'', horizon:'3 months', confidence:65, sizePct:5, notes:'' });
        showToast(`Idea created: ${body.ticker} ${body.direction}`, 'success');
      } else {
        showToast('BLOCK: address risk check before creating idea', 'error');
      }
    } catch (err) {
      showToast('Create idea failed: ' + err.message, 'error');
    }
    setIdeaSubmitting(false);
  }

  // ── ExplainerCard: shows educational explainer or AI explanation ───────────
  function ExplainerCard(id, overrides, liveKey) {
    const staticData = { ...(EXPLAINERS[id] || {}), ...(overrides || {}) };
    if (!staticData.term && !liveKey) return null;

    const liveKeyNorm = liveKey ? liveKey.toLowerCase().replace(/[^a-z0-9]/g, '_') : null;
    const aiData      = liveKeyNorm ? explainData[liveKeyNorm] : null;
    const aiLoading   = liveKeyNorm ? explainLoading[liveKeyNorm] : false;

    const data = aiData
      ? { term: aiData.ticker || staticData.term, what: aiData.what, now: aiData.now, port: aiData.portfolio }
      : staticData;

    const isOpen = openExplainer === id;

    function handleToggle(e) {
      e.stopPropagation();
      const next = isOpen ? null : id;
      setOpenExplainer(next);
      // Trigger AI fetch on first open if liveKey provided
      if (next && liveKey && !aiData) fetchExplain(liveKey);
    }

    return React.createElement(React.Fragment, null,
      React.createElement('div', {
        style:{ marginTop:10, display:'flex', alignItems:'center', gap:6, cursor:'pointer', userSelect:'none' },
        onClick: handleToggle,
      },
        React.createElement('span', { className:`explain-btn ${isOpen ? 'xopen' : ''}` }, isOpen ? '×' : '?'),
        React.createElement('span', { style:{ fontFamily:'var(--mono)', fontSize:9, color:'var(--steel)', letterSpacing:'0.1em' } },
          isOpen ? 'CLOSE' : (liveKey ? `EXPLAIN ${liveKey}` : 'WHAT IS THIS?')
        )
      ),
      isOpen && React.createElement('div', { className:'explainer-panel' },
        aiLoading && React.createElement('div', { style:{color:'var(--steel)',fontSize:11} },
          React.createElement('span', { className:'spin' }, '↻'), ' Loading AI explanation…'
        ),
        !aiLoading && React.createElement(React.Fragment, null,
          data.term && React.createElement('div', { className:'explainer-term' }, (data.term + '').toUpperCase()),
          data.what && React.createElement('div', { style:{color:'#0d0d0f',marginBottom:6} }, data.what),
          data.now && React.createElement('div', null,
            React.createElement('span', { className:'explainer-row-label', style:{color:'var(--gold)'} }, '▸ RIGHT NOW'),
            React.createElement('div', { style:{color:'var(--steel)'} }, data.now)
          ),
          data.port && React.createElement('div', null,
            React.createElement('span', { className:'explainer-row-label', style:{color:'var(--green)'} }, '▸ YOUR PORTFOLIO'),
            React.createElement('div', { style:{color:'var(--steel)'} }, data.port)
          ),
          aiData && React.createElement('div', { style:{fontFamily:'var(--mono)',fontSize:8.5,color:'var(--steel)',marginTop:8} },
            `AI confidence: ${aiData.confidence || 0}%  ·  Source: Claude / web_search`
          )
        )
      )

    if (researchLoading) {
      const secs = researchElapsed;

      const elapsed = mins > 0 ? `${mins}:${ss}` : `0:${ss}`;
      const phases = [
        { at:  0, msg: 'Querying live web data via Anthropic search…' },

      ];
      const phase = [...phases].reverse().find(p => secs >= p.at) || phases[0];
      const barPct = Math.min(100, Math.round((secs / 180) * 100));
      return React.createElement('div', null,
        typeTabs, controls,

    const sourceLabel = src === 'live' ? 'LIVE' : src === 'cached' ? 'CACHED' : 'SEEDED';

      if (mins < 1440) return `${Math.round(mins/60)}h ago`;
      return new Date(iso).toLocaleDateString();

    if (!isoStr) return '';
    var diff = Date.now() - new Date(isoStr).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

    React.createElement('div', { className:'command-bar' },
      React.createElement('button', { className:'cmd-btn', onClick: () => { loadSnapshot(); loadEvents(); loadRisk(); showToast('Refreshing all data…', 'info'); } }, '↻ REFRESH ALL'),
      React.createElement('button', { className:'cmd-btn', onClick: () => { loadEvents(); loadRisk(); showToast('Refreshing risk + events…', 'info'); } }, '⚡ RISK + EVENTS'),
      React.createElement('span', { className:'cmd-sep' }),
      snapshotMeta && React.createElement('span', {
        className: 'cmd-badge ' + (snapshotMeta.stale ? 'cmd-badge-cache' : snapshotMeta.source === 'live' ? 'cmd-badge-live' : 'cmd-badge-seeded')
      }, snapshotMeta.source.toUpperCase() + (snapshotMeta.stale ? ' · STALE' : '')),
      React.createElement('span', { className:'cmd-sep' }),
      budgetStatus && React.createElement('span', { className:'budget-widget' },
        React.createElement('span', { className:'budget-label' }, 'AI'),
        React.createElement('span', {
          className:'budget-val ' + (
            budgetStatus.daily.remaining === 0 ? 'budget-red' :
            budgetStatus.daily.remaining <= Math.ceil(budgetStatus.daily.cap * 0.25) ? 'budget-amber' : 'budget-green'
          )
        }, `${budgetStatus.daily.used}/${budgetStatus.daily.cap} TODAY`),
        React.createElement('span', { className:'budget-sep' }, '·'),
        React.createElement('span', {
          className:'budget-val ' + (
            budgetStatus.monthly.remaining === 0 ? 'budget-red' :
            budgetStatus.monthly.remaining <= Math.ceil(budgetStatus.monthly.cap * 0.25) ? 'budget-amber' : 'budget-green'
          )
        }, `${budgetStatus.monthly.used}/${budgetStatus.monthly.cap} MO`)
      ),
      snapshotMeta && snapshotMeta.fetchedAt && React.createElement('span', { className:'cmd-sync' },
        'SYNC ' + new Date(snapshotMeta.fetchedAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
      )
    ),

    // ── Tiered nav ────────────────────────────────────────────────────────────
    React.createElement('div', { className:'nav-wrapper' },
      React.createElement('div', { className:'nav-primary' },
        [
          { id:'market',    label:'SNAPSHOT',  accent:'tab-market'    },
          { id:'risk',      label:'RISK',       accent:'tab-risk'      },
          { id:'signals',   label:'SIGNALS',    accent:'tab-signals'   },
          { id:'portfolio', label:'PORTFOLIO',  accent:'tab-portfolio' },
        ].map(t =>
          React.createElement('div', {
            key: t.id,
            className: `tab tab-primary ${t.accent} ${tab === t.id ? 'active' : ''}`,
            onClick: () => setTab(t.id),
          }, t.label)
        )
      ),
      React.createElement('div', { className:'nav-secondary' },
        [
          { id:'scenario', label:'SCENARIO' },
          { id:'desk',     label:'DESK'     },
          { id:'sales',    label:'SALES'    },
          { id:'news',     label:'NEWS'     },
          { id:'research', label:'RESEARCH' },
          { id:'glossary', label:'GLOSSARY' },
        ].map(t =>
          React.createElement('div', {
            key: t.id,
            className: `tab tab-secondary ${tab === t.id ? 'active' : ''}`,
            onClick: () => setTab(t.id),
          }, t.label)
        ),
        React.createElement('div', { style:{flex:1} }),
        [
          { id:'thesis', label:'THESIS LAB' },
          { id:'engine', label:'ENGINE'     },
        ].map(t =>
          React.createElement('div', {
            key: t.id,
            className: `tab tab-lab ${tab === t.id ? 'active' : ''}`,
            onClick: () => setTab(t.id),
          }, t.label)
        )
      )
    ),

    // Content
    React.createElement('div', { className:'content' },
      renderTab()
    ),

    // Toast container
    React.createElement('div', { className:'toast-wrap' },
      toasts.map(t =>
        React.createElement('div', {
          key: t.id,
          className: `toast toast-${t.type} show`,
        }, t.msg)
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
}
</script>
</body>
</html>
